<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자전축 기울기와 계절</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style id="sim-kit">
/* ===== sim-kit 공통 스타일 (tools/sim-kit/kit.css에서 자동으로 넣음 — 이 블록은 직접 고치지 마세요) ===== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #ffffff; overflow: hidden; font-family: 'Gowun Dodum', sans-serif; color: #1e293b; }
button, input, select, textarea, table { font-family: 'Gowun Dodum', sans-serif; }
p, h3, h4, figure { margin: 0; }
html.fit, html.fit body { height: 100%; background: #0f172a; }
html.pfs body { position: fixed; inset: 0; z-index: 9999; }

/* 1920×1080 화면을 통째로 비율 맞춰 줄이고 늘림 (아래 sim-kit-fit 스크립트) */
#presentation-wrapper { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
.slide { display: none; width: 100%; height: 100%; padding: 34px 60px 40px 60px; flex-direction: column; min-height: 0; }
.slide.active { display: flex; }

/* 제목은 사이트 페이지에 이미 있으므로 감춤(파일 단독 실행 때는 <title>로 보임) · 한 줄 안내만 보임 */
.ppt-title { display: none; }
.ppt-subtitle { display: inline-block; font-size: 32px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 10px 30px; border-radius: 0 20px 20px 0; margin-bottom: 22px; align-self: flex-start; max-width: calc(100% - 300px); }
.sim-tag { display: inline-block; background: #0f172a; color: #facc15; font-size: 28px; padding: 6px 18px; border-radius: 12px; margin-right: 18px; vertical-align: 8px; letter-spacing: 0; }
.hl { color: #2563eb; font-weight: bold; }
.or, .ppt-subtitle .or { color: #ea580c; font-weight: bold; }

/* 그림(왼쪽, 남는 공간을 모두 씀) + 조작 패널(오른쪽 600px) */
.sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
.sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.sim-stage.light { background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
.sim-stage canvas { display: block; touch-action: none; width: auto; height: auto; max-width: 100%; max-height: 100%; }
.sim-panel { flex: 0 0 600px; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
[hidden] { display: none !important; }
.sim-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 14px 24px; font-size: 26px; color: #1e293b; line-height: 1.5; word-break: keep-all; }
.sim-box.key { background: #fff7ed; border-color: #fdba74; }
.sim-box.blue { background: #eff6ff; border-color: #bfdbfe; }
.sim-box h4 { font-size: 28px; font-weight: 800; color: #1d4ed8; margin: 0 0 8px 0; }
.sim-box.key h4 { color: #c2410c; }
.sim-box p, .sim-box div { margin: 0; }
.sim-row { display: flex; align-items: center; gap: 14px; font-size: 26px; margin: 6px 0; }
.sim-row > .lbl { flex: none; width: 190px; font-weight: bold; color: #334155; }
input[type=range].sim-range { flex: 1; accent-color: #3b82f6; height: 36px; cursor: pointer; min-width: 0; }
.sim-val { flex: none; min-width: 150px; text-align: right; font-weight: bold; color: #ea580c; font-size: 28px; }
.sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
.sim-btn { font-size: 25px; font-weight: bold; padding: 8px 20px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
.sim-btn:hover { background: #e2e8f0; }
.sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.sim-btn.orange { border-color: #fdba74; color: #c2410c; }
.sim-btn.orange.on { background: #ea580c; border-color: #ea580c; color: #fff; }
.sim-btn:disabled { opacity: .45; cursor: not-allowed; }
.sim-table { width: 100%; border-collapse: collapse; font-size: 24px; }
.sim-table th { background: #3b82f6; color: #fff; padding: 6px 10px; font-weight: bold; }
.sim-table td { padding: 5px 10px; border-bottom: 2px solid #e2e8f0; text-align: center; background: #fff; }
.sim-big { font-size: 40px; font-weight: 800; color: #ea580c; }
.sim-note { font-size: 21px; color: #64748b; line-height: 1.45; }
.sim-ok { color: #16a34a; font-weight: bold; }
.sim-hint { position: absolute; left: 20px; top: 16px; font-size: 22px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 6px 14px; border-radius: 10px; pointer-events: none; }
.sim-stage.light .sim-hint { color: #475569; background: rgba(255,255,255,0.9); }
.chip { display: inline-block; border: 2px solid #cbd5e1; border-radius: 999px; padding: 2px 16px; font-size: 24px; font-weight: bold; margin: 3px 6px 3px 0; background: #fff; color: #334155; }
.chip.b { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }
.chip.o { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.slide.active .ppt-title { animation: rise .6s both; }
.slide.active .ppt-subtitle { animation: rise .6s .1s both; }
.slide.active .sim-wrap { animation: rise .6s .2s both; }

/* 전체화면 버튼 */
.fs-btn { position: absolute; top: 34px; right: 60px; z-index: 60; font-size: 30px; font-weight: bold; padding: 8px 26px; border-radius: 999px; border: 3px solid #cbd5e1; background: #fff; color: #1e293b; cursor: pointer; transition: all .2s; }
.fs-btn:hover { border-color: #3b82f6; color: #1d4ed8; }

/* ===== 예측 → 실험 → 미션 탭 ===== */
.sim-tabs { display: flex; gap: 8px; background: #e2e8f0; padding: 6px; border-radius: 18px; flex: none; position: sticky; top: 0; z-index: 5; box-shadow: 0 6px 10px -6px rgba(15,23,42,.25); }
.sim-tab { flex: 1; font-size: 25px; font-weight: bold; padding: 9px 10px; border: none; border-radius: 13px; background: transparent; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.sim-tab:hover { background: rgba(255,255,255,.6); }
.sim-tab.on { background: #fff; color: #1d4ed8; box-shadow: 0 2px 6px rgba(15,23,42,.12); }
.sim-tab .badge { font-size: 19px; padding: 1px 10px; border-radius: 999px; background: #cbd5e1; color: #1e293b; }
.sim-tab .badge.done { background: #16a34a; color: #fff; }
.sim-tab.nudge { animation: nudge 1.6s ease-in-out 3; }
@keyframes nudge { 0%, 100% { transform: none; } 40% { transform: translateY(-4px); background: #fef3c7; } }
.sim-tabpage { display: none; flex-direction: column; gap: 14px; min-height: 0; }
.sim-tabpage.on { display: flex; animation: rise .35s both; }

/* 예측 */
.predict-q { font-size: 28px; font-weight: 800; color: #1e293b; line-height: 1.45; }
.predict-q .tag { display: inline-block; font-size: 20px; color: #fff; background: #7c3aed; border-radius: 8px; padding: 2px 10px; margin-right: 10px; vertical-align: 4px; }
.predict-opts { display: flex; flex-direction: column; gap: 10px; }
.predict-opt { text-align: left; font-size: 25px; font-weight: bold; padding: 12px 20px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; display: flex; gap: 14px; align-items: center; transition: all .2s; }
.predict-opt:hover:not(:disabled) { border-color: #7c3aed; color: #6d28d9; }
.predict-opt .n { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #ede9fe; color: #6d28d9; display: inline-flex; align-items: center; justify-content: center; }
.predict-opt.picked { border-color: #7c3aed; background: #f5f3ff; color: #5b21b6; }
.predict-opt.right { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
.predict-opt.right .n { background: #16a34a; color: #fff; }
.predict-opt.wrong { border-color: #f87171; background: #fef2f2; color: #b91c1c; }
.predict-opt:disabled { cursor: default; }
.predict-result { font-size: 25px; line-height: 1.55; padding: 14px 20px; border-radius: 14px; background: #f0fdf4; border: 2px solid #86efac; }
.predict-result.miss { background: #fff7ed; border-color: #fdba74; }
.predict-result b { color: #15803d; }
.predict-result.miss b { color: #c2410c; }

/* 미션 */
.mission-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mission-list li { display: flex; gap: 14px; align-items: flex-start; font-size: 25px; line-height: 1.45; padding: 12px 16px; border-radius: 14px; background: #fff; border: 2px solid #e2e8f0; transition: all .3s; }
.mission-list li .ck { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 3px solid #cbd5e1; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: transparent; margin-top: 1px; }
.mission-list li.done { border-color: #86efac; background: #f0fdf4; }
.mission-list li.done .ck { background: #16a34a; border-color: #16a34a; color: #fff; }
.mission-list li .hint { display: block; font-size: 21px; color: #64748b; margin-top: 2px; }
.mission-bar { height: 16px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
.mission-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #16a34a); transition: width .5s; }
.mission-all { font-size: 26px; font-weight: 800; color: #15803d; text-align: center; padding: 10px; border-radius: 14px; background: #dcfce7; }

/* 실제 자료 */
.real-src { font-size: 20px; color: #64748b; margin-top: 6px; }
.real-src::before { content: "자료: "; font-weight: bold; }

/* 알림 (그림 위에 잠깐 뜸) */
.sim-toast { position: absolute; left: 50%; top: 22px; transform: translate(-50%, -20px); opacity: 0; z-index: 30; pointer-events: none; font-size: 28px; font-weight: 800; padding: 12px 30px; border-radius: 999px; background: #16a34a; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,.25); transition: all .35s; white-space: nowrap; }
.sim-toast.show { opacity: 1; transform: translate(-50%, 0); }
.sim-toast.info { background: #1d4ed8; }
.sim-toast.warn { background: #ea580c; }
.sim-burst { position: absolute; width: 14px; height: 14px; border-radius: 3px; z-index: 29; pointer-events: none; animation: burst 1.1s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sim-burst { display: none; } .sim-tab.nudge, .pulse { animation: none; } }
</style>
<style>

  #oM1 { font-size: 22px; }
  .sim-row > .lbl { width: 90px; }
  .sim-val { min-width: 100px; }
  #realBox .sim-btn { font-size: 20px; padding: 6px 11px; }

</style>
<style id="mission-pop-css">
  /* 미션 시작 버튼 + 팝업 */
  .sim-tab.mission-open { background: #fff7ed; color: #c2410c; border: 2px solid #fdba74; }
  .sim-tab.mission-open:hover { background: #ffedd5; }
  .mission-pop { position: absolute; inset: 0; z-index: 80; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; }
  .mission-card { width: 900px; max-height: 900px; overflow-y: auto; background: #fff; border-radius: 24px; padding: 28px 36px; box-shadow: 0 20px 50px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 16px; animation: rise .3s both; }
  .mission-card h3 { font-size: 34px; font-weight: 800; color: #c2410c; display: flex; align-items: center; justify-content: space-between; }
  .mission-card #missionBox { display: flex; flex-direction: column; gap: 12px; }
  /* 모든 미션 완료 축하 */
  .fw-msg { position: absolute; left: 50%; top: 50%; z-index: 91; pointer-events: none; transform: translate(-50%,-50%); text-align: center; font-size: 84px; font-weight: 800; color: #fff; background: linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6); padding: 30px 70px; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: fwPop .7s cubic-bezier(.2,1.6,.4,1) both, fwGlow 1.2s ease-in-out .7s infinite alternate; transition: opacity .6s; }
  .fw-msg small { display: block; font-size: 38px; margin-top: 6px; opacity: .95; }
  .fw-msg.out { opacity: 0; }
  @keyframes fwPop { from { transform: translate(-50%,-50%) scale(.2) rotate(-8deg); opacity: 0; } to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  @keyframes fwGlow { to { box-shadow: 0 0 80px rgba(250,204,21,.9); transform: translate(-50%,-50%) scale(1.04); } }
</style>
</head>
<body>
<div id="presentation-wrapper">
<button class="fs-btn" id="fsBtn" type="button">⛶ 전체화면</button>
<div class="mission-pop" id="missionPop" hidden>
  <div class="mission-card" role="dialog" aria-label="미션">
    <h3>🎯 미션 <button class="sim-btn" id="missionClose" type="button">✕ 닫기</button></h3>
    <div id="missionBox"></div>
    <div class="sim-btns" style="justify-content:center"><button class="sim-btn on" id="missionGo" type="button">실험하러 가기 →</button></div>
  </div>
</div>
<div class="slide sim-slide active" id="slideMain">
  <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>자전축을 기울여 우리나라의 여름·겨울 비교하기</div>
  <div class="ppt-subtitle">기울기와 위도를 바꾸며 <span class="or">남중 고도</span>와 <span class="or">하루 동안 받는 태양 에너지</span>를 비교해 봐요.</div>
  <div class="sim-wrap">
    <div class="sim-stage light"><canvas id="cM1" width="1060" height="610" role="img" aria-label="하지와 동지의 남중 고도와 빛이 닿는 넓이"></canvas></div>
    <div class="sim-panel">
      <div class="sim-tabs">
        <button class="sim-tab on" data-tab="predict">① 예측</button>
        <button class="sim-tab" data-tab="lab">② 실험</button>
        <button class="sim-tab mission-open" data-tab="mission" type="button">🎯 미션 시작</button>
      </div>
      <div class="sim-tabpage" data-page="predict"><div class="sim-box" id="predictBox"></div></div>
      <div class="sim-tabpage" data-page="lab">
        <div class="sim-box blue">
          <div class="sim-row"><span class="lbl">기울기</span><input type="range" class="sim-range" id="rM1" min="22.1" max="24.5" step="0.1" value="23.5" aria-label="자전축 기울기"><span class="sim-val" id="vM1"></span></div>
          <div class="sim-row"><span class="lbl">위도</span><input type="range" class="sim-range" id="rLat" min="0" max="60" step="0.1" value="37.5" aria-label="위도"><span class="sim-val" id="vLat"></span></div>
          <div class="sim-btns"><button class="sim-btn" data-t="22.1" type="button">22.1°</button><button class="sim-btn" data-t="23.5" type="button">23.5°</button><button class="sim-btn" data-t="24.5" type="button">24.5°</button></div>
        </div>
        <div class="sim-box key" id="oM1"></div>
        <div class="sim-box" id="realBox">
          <h4>실제 도시에서 비교하기</h4>
          <div class="sim-btns"><button class="sim-btn orange" data-real="0" type="button">싱가포르</button><button class="sim-btn orange" data-real="1" type="button">제주</button><button class="sim-btn orange" data-real="2" type="button">서울</button><button class="sim-btn orange" data-real="3" type="button">헬싱키</button></div>
          <div class="sim-note" id="realOut" style="margin-top:6px;font-size:19px;color:#334155">버튼을 누르면 그 도시의 위도로 맞춰요. (기울기는 현재 23.4°)</div>
          <div class="real-src">도시 위도: 싱가포르 1.3°N, 제주 33.5°N, 서울 37.6°N, 헬싱키 60.2°N</div>
        </div>
      </div>
      <div class="sim-note">※ 하지·동지의 대기 상단 하루 평균 일사량을 계산(태양 상수 1361 W/m², 궤도는 원으로 가정)한 값이에요.</div>
    </div>
  </div>
</div>
</div>
<script id="sim-kit">
/* ===== sim-kit 공통 도구 (tools/sim-kit/kit.js에서 자동으로 넣음 — 이 블록은 직접 고치지 마세요) =====
   SIM.loop / SIM.pos / SIM.font ...  : 그리기 도우미 (행성우주과학 시뮬레이션과 같음)
   SIM.tabs()                          : ① 예측 ② 실험 ③ 미션 탭
   SIM.predict({...})                  : 예측하고 확인
   SIM.missions({...})                 : 도전 미션 (조건을 자동으로 확인)
   SIM.toast(글, 'info'|'warn')        : 그림 위에 잠깐 뜨는 알림
*/
window.SIM = {
  FONT: "'Gowun Dodum', sans-serif",
  // 해당 슬라이드가 화면에 보일 때만 그리기
  loop(slideId, fn) {
    const el = document.getElementById(slideId);
    let last = performance.now();
    function f(t) {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!el || el.classList.contains('active')) fn(t, dt);
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  },
  rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
  font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  lerp(a, b, t) { return a + (b - a) * t; },
  fmtExp(v, digits) {
    if (!isFinite(v) || v <= 0) return '0';
    const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
    const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
    return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
  },

  // ---- 고해상도 캔버스 (W×H 좌표로 그리면 됨) ----
  // const S = SIM.stage({ canvas, W: 1000, H: 620 });  S.begin(); 그리기…  S.pt(이벤트) → {x,y}
  // 1920 화면이 줄었다 늘었다 해도 그림이 흐려지지 않게 내부 해상도를 고정(기본 2배)으로 둠
  stage(o) {
    const cvs = o.canvas, W = o.W, H = o.H, k = o.scale || 2;
    cvs.width = Math.round(W * k); cvs.height = Math.round(H * k);
    cvs.style.aspectRatio = W + '/' + H;
    const ctx = cvs.getContext('2d');
    return {
      ctx, W, H,
      begin() { ctx.setTransform(k, 0, 0, k, 0, 0); },
      pt(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; },
      resize() {},
    };
  },

  // ---- 알림 ----
  toast(text, kind, ms) {
    const stage = document.querySelector('.slide.active .sim-stage') || document.getElementById('presentation-wrapper');
    let t = stage.querySelector(':scope > .sim-toast');
    if (!t) { t = document.createElement('div'); t.className = 'sim-toast'; stage.appendChild(t); }
    t.textContent = text; t.className = 'sim-toast ' + (kind || '');
    void t.offsetWidth; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2600);
  },
  burst() {
    const stage = document.querySelector('.slide.active .sim-stage');
    if (!stage) return;
    const cols = ['#22c55e', '#3b82f6', '#f59e0b', '#ec4899', '#a855f7'];
    for (let i = 0; i < 26; i++) {
      const b = document.createElement('i'); b.className = 'sim-burst';
      b.style.left = '50%'; b.style.top = '60px'; b.style.background = cols[i % cols.length];
      const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      b.style.setProperty('--dx', Math.cos(a) * r + 'px'); b.style.setProperty('--dy', Math.sin(a) * r * 0.7 + 120 + 'px');
      stage.appendChild(b); setTimeout(() => b.remove(), 1200);
    }
  },

  // ---- ① 예측 ② 실험 ③ 미션 탭 ----
  // 패널 안의 .sim-tabs > .sim-tab[data-tab] 와 .sim-tabpage[data-page] 를 이어 줌
  tabs(root) {
    root = root || document;
    const tabs = [...root.querySelectorAll('.sim-tab')], pages = [...root.querySelectorAll('.sim-tabpage')];
    const show = name => {
      tabs.forEach(t => { t.classList.toggle('on', t.dataset.tab === name); t.setAttribute('aria-selected', t.dataset.tab === name); });
      pages.forEach(p => p.classList.toggle('on', p.dataset.page === name));
    };
    tabs.forEach(t => { t.setAttribute('role', 'tab'); t.onclick = () => { t.classList.remove('nudge'); show(t.dataset.tab); }; });
    const first = tabs.find(t => t.classList.contains('on')) || tabs[0];
    if (first) show(first.dataset.tab);
    SIM.showTab = show;
    return show;
  },

  // ---- 예측하고 확인 ----
  // SIM.predict({ el: 상자, q: '질문', options: ['…','…'], answer: 정답 번호(0부터),
  //   why: '맞았을 때 함께 보여 줄 설명', setup: () => {실험을 그 조건으로 맞춤},
  //   reached: () => true/false (실험이 확인할 상태에 도달했는지; 없으면 [결과 보기] 버튼) })
  predict(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    let picked = -1, revealed = false;
    el.innerHTML = `<div class="predict-q"><span class="tag">예측</span>${o.q}</div>
      <div class="predict-opts">${o.options.map((t, i) => `<button type="button" class="predict-opt" data-i="${i}"><span class="n">${'ABCDEF'[i]}</span><span>${t}</span></button>`).join('')}</div>
      <div class="predict-go" hidden><div class="sim-note" style="margin-bottom:8px">좋아요! 이제 실험해서 확인해 봐요.</div>
        <div class="sim-btns"><button type="button" class="sim-btn on" data-act="go">② 실험하러 가기 →</button>${o.reached ? '' : '<button type="button" class="sim-btn" data-act="show">결과 보기</button>'}</div></div>
      <div class="predict-result" hidden></div>`;
    const opts = [...el.querySelectorAll('.predict-opt')];
    const reveal = () => {
      if (revealed || picked < 0) return; revealed = true;
      opts.forEach((b, i) => { b.disabled = true; b.classList.toggle('right', i === o.answer); b.classList.toggle('wrong', i === picked && i !== o.answer); });
      const ok = picked === o.answer, r = el.querySelector('.predict-result');
      r.hidden = false; r.classList.toggle('miss', !ok);
      r.innerHTML = (ok ? '<b>예측 성공!</b> ' : `<b>정답은 ${'ABCDEF'[o.answer]}</b> — `) + (o.why || '');
      el.querySelector('.predict-go').hidden = true;
      SIM.toast(ok ? '예측 성공!' : '예측과 결과가 달라요. 까닭을 확인해 봐요', ok ? '' : 'warn');
      if (ok) SIM.burst();
      const tab = document.querySelector('.sim-tab[data-tab="predict"]');
      if (tab) { tab.classList.add('nudge'); const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge ' + (ok ? 'done' : ''); b.textContent = ok ? '✓' : '!'; }
      o.onReveal && o.onReveal(ok);
    };
    opts.forEach((b, i) => b.onclick = () => {
      if (revealed) return;
      picked = i; opts.forEach(x => x.classList.toggle('picked', x === b));
      el.querySelector('.predict-go').hidden = false;
    });
    el.querySelector('[data-act="go"]').onclick = () => { o.setup && o.setup(); SIM.showTab && SIM.showTab('lab'); };
    const sb = el.querySelector('[data-act="show"]'); if (sb) sb.onclick = reveal;
    // 고른 뒤, 실험 상태가 '확인할 상태'에서 한 번 벗어났다가 다시 들어오면 결과를 보여 줌
    // (처음부터 그 상태였다면 학생이 직접 조작해 만들 때까지 기다림)
    let armed = false;
    if (o.reached) SIM._checks.push(() => {
      if (picked < 0 || revealed) return;
      const r = o.reached();
      if (!r) armed = true; else if (armed) reveal();
    });
    return { reveal, get picked() { return picked; } };
  },

  // ---- 도전 미션 ----
  // SIM.missions({ el: 상자, items: [{ t: '할 일', hint: '도움말(선택)', test: () => true/false }] })
  // test는 0.25초마다 자동으로 확인. 한 번 달성하면 계속 달성으로 남음.
  // 처음부터 맞아 있던 조건은 세지 않음 (조건이 거짓이 된 적이 있어야 함).
  missions(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    const done = o.items.map(() => false);
    el.innerHTML = `<div class="mission-bar"><i></i></div>
      <ul class="mission-list">${o.items.map(m => `<li><span class="ck">✓</span><span>${m.t}${m.hint ? `<span class="hint">${m.hint}</span>` : ''}</span></li>`).join('')}</ul>
      <div class="mission-all" hidden>모든 미션 달성!</div>`;
    const lis = [...el.querySelectorAll('li')], tab = document.querySelector('.sim-tab[data-tab="mission"]');
    const badge = () => {
      const n = done.filter(Boolean).length;
      el.querySelector('.mission-bar i').style.width = (n / done.length * 100) + '%';
      el.querySelector('.mission-all').hidden = n < done.length;
      if (tab) { const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge' + (n === done.length ? ' done' : ''); b.textContent = n + '/' + done.length; }
    };
    const mark = i => {
      if (done[i]) return; done[i] = true; lis[i].classList.add('done');
      badge(); SIM.burst();
      const txt = lis[i].querySelector('span:not(.ck)').cloneNode(true); txt.querySelectorAll('.hint').forEach(h => h.remove());
      const t = txt.textContent.trim();
      SIM.toast(done.every(Boolean) ? '모든 미션 달성!' : '미션 달성! ' + (t.length > 24 ? t.slice(0, 23) + '…' : t));
      if (tab && !tab.classList.contains('on')) tab.classList.add('nudge');
    };
    // 처음 열었을 때 이미 조건이 맞아 있으면 달성으로 치지 않음: 한 번 조건에서 벗어났다가 학생이 다시 맞춰야 달성
    const armed = o.items.map(() => false);
    SIM._checks.push(() => o.items.forEach((m, i) => {
      if (done[i]) return;
      let ok = false; try { ok = !!m.test(); } catch (e) {}
      if (!ok) armed[i] = true; else if (armed[i]) mark(i);
    }));
    badge();
    return { mark, done };
  },
  _checks: [],
};
setInterval(() => SIM._checks.forEach(f => f()), 250);
// 슬라이더·입력칸 조작 중에는 키 입력이 다른 곳으로 새지 않게
document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT' && a.type === 'range') a.blur(); });
</script>
<script>
(function(){
  const c=document.getElementById('cM1'),W=1060,H=610,S=SIM.stage({canvas:c,W,H}),g=S.ctx;let tilt=23.5,cur=23.5,lat=37.5,cl=37.5,eqSeen=false;const realSeen=new Set();
  const r=document.getElementById('rM1'),rl=document.getElementById('rLat'),S0=1361;
  function Qday(la,decDeg){const P=la*Math.PI/180,d=decDeg*Math.PI/180;let x=-Math.tan(P)*Math.tan(d);x=Math.max(-1,Math.min(1,x));const h0=Math.acos(x);return S0/Math.PI*(h0*Math.sin(P)*Math.sin(d)+Math.cos(P)*Math.cos(d)*Math.sin(h0));}
  const sum=()=>Qday(lat,tilt),win=()=>Qday(lat,-tilt),diff=()=>sum()-win(),base=()=>Qday(lat,23.5)-Qday(lat,-23.5);
  function out(){r.value=tilt;rl.value=lat;document.getElementById('vM1').textContent=tilt.toFixed(1)+'°';document.getElementById('vLat').textContent=lat.toFixed(1)+'°N';if(lat<0.5)eqSeen=true;
    document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.t-tilt)<0.05));
    const s=sum(),w=win(),d=s-w,d0=base();
    document.getElementById('oM1').innerHTML='<h4>북위 '+lat.toFixed(1)+'°</h4><div>하지 남중 고도 <b>'+Math.min(90,90-lat+tilt).toFixed(1)+'°</b>'+(90-lat+tilt>90?' (천정의 북쪽)':'')+' / 동지 <b>'+(90-lat-tilt).toFixed(1)+'°</b></div><div>하지 일사량 <b style="color:#dc2626">'+s.toFixed(0)+'</b>, 동지 <b style="color:#2563eb">'+w.toFixed(0)+'</b> W/m²</div><div>여름−겨울 차이: <span class="sim-big">'+d.toFixed(0)+' W/m²</span></div><div>23.5°일 때보다 '+(Math.abs(d-d0)<1?'<b>같음</b>':(d>d0?'<b style="color:#dc2626">'+(d-d0).toFixed(0)+' 큼 → 연교차 증가</b>':'<b style="color:#2563eb">'+(d0-d).toFixed(0)+' 작음 → 연교차 감소</b>'))+'</div>';}
  r.oninput=e=>{tilt=+e.target.value;out();};rl.oninput=e=>{lat=+e.target.value;out();};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tilt=+b.dataset.t;out();});
  const REAL=[{n:'싱가포르',l:1.3,t:'적도 근처라 1년 내내 태양이 높이 떠서 <b>계절에 따른 차이가 작아요</b>.'},{n:'제주',l:33.5,t:'서울보다 남쪽이라 겨울에도 태양이 조금 더 높이 떠요.'},{n:'서울',l:37.6,t:'여름과 겨울의 남중 고도 차이가 약 47°로, 사계절이 뚜렷해요.'},{n:'헬싱키',l:60.2,t:'겨울에는 태양이 겨우 6° 정도만 올라 낮이 아주 짧고, 여름에는 밤이 거의 없을 만큼 낮이 길어요.'}];
  document.querySelectorAll('[data-real]').forEach(b=>b.onclick=()=>{const q=+b.dataset.real,d=REAL[q];realSeen.add(q);lat=d.l;tilt=23.4;out();
    document.querySelectorAll('[data-real]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('realOut').innerHTML='<b>'+d.n+'</b> (북위 '+d.l+'°) · '+d.t;});
  out();
  function scene(x0,label,alt,col,tm){
    const gy=420,a=alt*Math.PI/180,cx=x0+230,R=230,sx=cx-R*Math.cos(a),sy=gy-R*Math.sin(a);
    g.fillStyle='#e0f2fe';g.fillRect(x0,30,460,gy-30);g.fillStyle='#86efac';g.fillRect(x0,gy,460,50);g.fillStyle='#65a30d';g.fillRect(x0,gy+50,460,10);
    const beam=70,foot=beam/Math.sin(a);
    g.save();g.beginPath();g.rect(x0,30,460,gy+30);g.clip();
    g.fillStyle=col==='s'?'rgba(250,204,21,.45)':'rgba(250,204,21,.3)';g.beginPath();
    const px=-Math.sin(a)*beam/2,py=Math.cos(a)*beam/2;g.moveTo(sx+px,sy+py);g.lineTo(sx-px,sy-py);g.lineTo(cx+foot/2,gy);g.lineTo(cx-foot/2,gy);g.closePath();g.fill();
    g.fillStyle='rgba(234,88,12,.85)';g.fillRect(cx-foot/2,gy-4,foot,8);
    for(let k=0;k<5;k++){const p=((tm/1600)+k/5)%1;const x=sx+(cx-sx)*p+((k-2)/4)*px*1.6,y=sy+(gy-sy)*p+((k-2)/4)*py*1.6;g.fillStyle='#f59e0b';g.beginPath();g.arc(x,y,5,0,7);g.fill();}
    g.restore();
    const gr=g.createRadialGradient(sx,sy,4,sx,sy,34);gr.addColorStop(0,'#fef08a');gr.addColorStop(1,'#f97316');g.fillStyle=gr;g.beginPath();g.arc(sx,sy,30,0,7);g.fill();
    g.strokeStyle='#334155';g.lineWidth=2;g.beginPath();g.arc(cx,gy,70,Math.PI,Math.PI+a);g.stroke();
    g.fillStyle='#0f172a';g.font=SIM.font(22);g.textAlign='center';g.fillText(alt.toFixed(1)+'°',cx-110,gy-24);
    g.font=SIM.font(28);g.fillStyle=col==='s'?'#dc2626':'#2563eb';g.fillText(label,x0+230,64);
    g.font=SIM.font(19);g.fillStyle='#7c2d12';g.fillText('같은 빛이 닿는 폭: '+(foot/beam).toFixed(2)+'배',cx,gy+86);}
  SIM.loop('slideMain',(tm,dt)=>{cur+=(tilt-cur)*Math.min(1,dt*6);cl+=(lat-cl)*Math.min(1,dt*6);S.begin();g.clearRect(0,0,W,H);
    scene(40,'하지(여름)',90-cl+cur,'s',tm);scene(560,'동지(겨울)',90-cl-cur,'w',tm);
    g.fillStyle='#334155';g.font=SIM.font(20);g.textAlign='center';g.fillText('남중 고도가 낮을수록 같은 양의 빛이 넓게 퍼져 단위 면적당 에너지가 줄어요',W/2,590);
  });

  SIM.tabs();
  SIM.predict({el:'#predictBox',
    q:'자전축 기울기가 23.5°에서 <b>24.5°로 커지면</b>, 우리나라의 남중 고도는 어떻게 될까요?',
    options:['여름은 높아지고 겨울은 낮아진다','여름은 낮아지고 겨울은 높아진다','여름과 겨울 모두 높아진다'],answer:0,
    why:'하지 남중 고도는 90° − 위도 + 기울기, 동지는 90° − 위도 − 기울기예요. 기울기가 커지면 <b>여름 태양은 더 높이, 겨울 태양은 더 낮게</b> 떠서 여름은 더 덥고 겨울은 더 추워져 <b>연교차가 커져요</b>.',
    setup:()=>{tilt=23.5;lat=37.5;out();},
    reached:()=>tilt>=24.4});
  SIM.missions({el:'#missionBox',items:[
    {t:'북위 37.5° 근처(±1°)에서 여름−겨울 일사량 차이를 23.5°일 때보다 <b>크게</b> 만들어 보세요.',test:()=>Math.abs(lat-37.5)<=1&&diff()>base()+1},
    {t:'동지 남중 고도가 <b>10° 이하</b>인 곳을 찾아보세요.',hint:'위도를 높여 봐요',test:()=>90-lat-tilt<=10},
    {t:'<b>적도(0°)</b>의 하지 일사량을 본 뒤, 하지 일사량이 적도보다 <b>더 많은</b> 위도를 찾아보세요.',hint:'여름에는 고위도의 낮이 길어요',test:()=>eqSeen&&lat>20&&sum()>Qday(0,tilt)},
    {t:'<b>실제 도시 4곳</b>을 모두 불러와 비교해 보세요.',hint:'② 실험 탭 아래쪽 버튼',test:()=>realSeen.size>=4},
  ]});
})();
</script>
<script id="mission-pop-js">
/* 미션: 탭 대신 버튼 → 팝업 (실험 중에도 언제든 열어 보기) · 모두 달성하면 폭죽 */
(function(){
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script>
<script id="sim-kit-fit">
/* ===== sim-kit 화면 맞춤 · 전체화면 (tools/sim-kit/kit-fit.js에서 자동으로 넣음 — 이 블록은 직접 고치지 마세요) =====
   - 사이트 안(iframe)에서는 폭에 맞춰 1920×1080 화면을 줄이고, 높이를 사이트에 알려 줌(sim-height)
   - 새 창·전체화면에서는 화면 안에 16:9로 꽉 차게 가운데 정렬
   - 전체화면을 켜면 휴대폰·태블릿은 가로 화면으로 돌림(지원하는 기기만) */
(function () {
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self, de = document.documentElement;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function fit() {
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || isFs();
    var s = window.innerWidth / 1920, x = 0, y = 0;
    de.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920 * s) / 2; y = Math.max(0, (window.innerHeight - h * s) / 2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h * s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h * s) }, '*'); } catch (e) {} }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  var btn = document.getElementById('fsBtn');
  function lockLandscape() {
    try { if (screen.orientation && screen.orientation.lock && matchMedia('(pointer: coarse)').matches) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  }
  function unlock() { try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {} }
  function sync() { if (btn) btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; if (!isFs()) unlock(); fit(); setTimeout(fit, 120); }
  if (btn) btn.onclick = function () {
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function () { de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(function () { lockLandscape(); sync(); }, fallback); else { lockLandscape(); sync(); } } catch (e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
</script>
