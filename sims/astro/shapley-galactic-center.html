<!DOCTYPE html>

<title>섀플리처럼 우리은하의 중심 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', sans-serif; color: #1e293b; }
        button, input { font-family: 'Gowun Dodum', sans-serif; }
        p, h3, figure { margin: 0; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }
        .slide.active { display: flex; }

        /* 표지 (03~05단원과 동일) */
        .slide.cover-slide { background-color: #1e293b; padding: 60px; }
        .cover-card { background-color: white; width: 100%; height: 100%; border-radius: 20px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; }

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px; line-height: 1.25; }
        .ppt-subtitle { display: inline-block; font-size: 38px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 12px 32px; border-radius: 0 20px 20px 0; margin-bottom: 28px; align-self: flex-start; }
        .ppt-text { font-size: 38px; color: #334155; line-height: 1.6; margin-bottom: 25px; word-break: keep-all; }
        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; }
        #fullscreen-btn:hover { background-color: #1e293b; }

        .card.soft { background: #f8fafc; border-color: #e2e8f0; }
        .card.key { background: #fff7ed; border-color: #fdba74; }
        .card h3 { font-size: 34px; font-weight: 800; color: #1d4ed8; margin: 0 0 6px 0; }

<style id="standalone">
  /* ---- 독립 실행용 (사이트 iframe·수업 모드·새 창에 맞춤) ---- */

<div id="presentation-wrapper">

            <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>섀플리처럼 우리은하의 중심 찾기</div>

                <div class="sim-stage"><canvas id="cU" width="1160" height="720"></canvas></div>

                        <div class="sim-btns"><button class="sim-btn" id="bU1">⏸ 멈춤</button><button class="sim-btn" id="bU5">↺ 다시 관측</button></div>

                    </div>

                    <div class="sim-note">※ 거리는 세페이드 변광성으로 구했다고 가정해요. 가상의 구상 성단 분포 모형이에요.</div>

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>


/* ===================== 시뮬레이션 U: 구상 성단으로 은하 중심 찾기 ===================== */
(function(){
  const c=document.getElementById('cU'),g=c.getContext('2d'),W=1160,H=720;
  const r=SIM.rng(42),GC=[],CX=8.5;
  for(let i=0;i<150;i++){const d=Math.min(22,-Math.log(1-r()*0.97)*4.2),u=r()*2-1,a=r()*6.283,s=Math.sqrt(1-u*u);GC.push({x:CX+d*s*Math.cos(a),y:d*s*Math.sin(a),z:d*u});}
  // 두 그림: 위에서 본 모습(x,y) · 옆에서 본 모습(x,z), 범위 x −12~28, 세로 −20~20 kpc
  const S=13.2,TY=78,VW=40*S,VIEWS=[{k:'top',name:'위에서 본 모습',tx:36,b:'y'},{k:'side',name:'옆에서 본 모습',tx:36+VW+60,b:'z'}];
  const P=(v,x,b)=>[v.tx+(x+12)*S,TY+(20-b)*S],inv=(v,p)=>[(p.x-v.tx)/S-12,20-(p.y-TY)/S];
  const inView=(v,p)=>p.x>=v.tx&&p.x<=v.tx+VW&&p.y>=TY&&p.y<=TY+VW;
  const STEP_MS=45,TOL=2.5; // 하나씩 찍히는 간격(ms) · 정답 인정 거리(kpc)
  let n=0,clock=0,playing=true,showD=false,reveal=false,hover=null,marks=[],guess={},ok={},last='';
  const shown=[]; // 각 성단이 찍힌 시각(애니메이션용)
  function cen(){let a=0,b=0,d=0;for(let i=0;i<n;i++){a+=GC[i].x;b+=GC[i].y;d+=GC[i].z;}return{x:a/n,y:b/n,z:d/n};}
  const done=()=>n>=GC.length;
  const b1=document.getElementById('bU1'),b3=document.getElementById('bU3'),b4=document.getElementById('bU4');
  function out(){
    let h='<h4>관측한 구상 성단: <span class="or">'+n+'</span> / '+GC.length+'개</h4>';
    if(!done()) h+='<div class="sim-note">관측이 끝나면, 두 그림에서 구상 성단 <b>분포의 중심</b>을 직접 클릭해 찾아보세요.</div>';
    else{
      const st=v=>ok[v.k]?'<span class="sim-ok">✔ 찾았어요</span>':'<span style="color:#64748b">아직 못 찾았어요</span>';
      h+='<div>👆 '+VIEWS[0].name+': '+st(VIEWS[0])+'</div><div>👆 '+VIEWS[1].name+': '+st(VIEWS[1])+'</div>';
      if(ok.top&&ok.side||reveal){const m=cen();
        h+='<div style="margin-top:8px">태양에서 분포의 중심까지: <span class="sim-big" style="font-size:36px">약 '+Math.hypot(m.x,m.y).toFixed(1)+' kpc</span></div>'+
          '<div>구상 성단은 <b>은하 중심</b>을 둘러싸고 분포해요. → 태양은 은하 중심이 <b>아니에요!</b></div>';}
      else if(last) h+='<div style="margin-top:8px">'+last+'</div>';
      else h+='<div class="sim-note" style="margin-top:6px">구상 성단이 가장 많이 모여 있는 곳의 한가운데를 눌러 보세요.</div>';
    }
    document.getElementById('oU').innerHTML=h;
  }
  function restart(){n=0;clock=0;shown.length=0;playing=true;reveal=false;guess={};ok={};last='';marks=[];b1.textContent='⏸ 멈춤';b3.classList.remove('on');out();}
  b1.onclick=()=>{if(done())return;playing=!playing;b1.textContent=playing?'⏸ 멈춤':'▶ 계속';};
  document.getElementById('bU5').onclick=restart;
  b3.onclick=()=>{if(!done()){n=GC.length;const t=performance.now();for(let i=0;i<n;i++)if(!shown[i])shown[i]=t-1000;}reveal=!reveal;b3.classList.toggle('on',reveal);out();};
  b4.onclick=()=>{showD=!showD;b4.classList.toggle('on',showD);};
  // 클릭: 분포의 중심 찾기 (그림마다 따로 판정)
  c.addEventListener('pointermove',e=>{const p=SIM.pos(e,c);const v=VIEWS.find(v=>inView(v,p));hover=v?{v,p}:null;c.style.cursor=v&&done()&&!ok[v.k]?'crosshair':'default';});
  c.addEventListener('pointerleave',()=>{hover=null;});
  c.addEventListener('click',e=>{
    const p=SIM.pos(e,c),v=VIEWS.find(v=>inView(v,p));if(!v)return;
    if(!done()){last='';out();return;}
    if(ok[v.k])return;
    const q=inv(v,p),m=cen(),tx=m.x,tb=m[v.b],d=Math.hypot(q[0]-tx,q[1]-tb),now=performance.now();
    if(d<=TOL){ok[v.k]=true;guess[v.k]={p,at:now};last=ok.top&&ok.side?'':'<span class="sim-ok">✔ 정답!</span> 이제 '+(v.k==='top'?VIEWS[1].name:VIEWS[0].name)+'에서도 찾아보세요.';}
    else{marks.push({x:p.x,y:p.y,until:now+1500});
      const dx=tx-q[0],db=tb-q[1],dir=Math.abs(dx)>Math.abs(db)?(dx>0?'오른쪽':'왼쪽'):(db>0?'위쪽':'아래쪽');
      last='<span class="sim-bad">✘ 아직 아니에요.</span> ('+v.name+') 중심에서 약 <b>'+d.toFixed(1)+' kpc</b> 떨어져 있어요. 조금 더 <b>'+dir+'</b>을 눌러 보세요.';}
    out();
  });
  restart();
  // 수업 자료(3.02 우리은하의 규모와 구조.html) 안에서 이 슬라이드가 열릴 때마다 관측을 처음부터
  addEventListener('message',e=>{if(e.data&&e.data.type==='deck-show')restart();});
  SIM.loop('u10',(t,dt)=>{
    if(playing&&!done()){clock+=dt*1000;while(!done()&&clock>=STEP_MS){clock-=STEP_MS;shown[n]=t;n++;}if(done()){b1.textContent='✔ 관측 완료';}out();}
    g.fillStyle='#0f172a';g.fillRect(0,0,W,H);
    VIEWS.forEach(v=>{
      g.fillStyle='#e2e8f0';g.font=SIM.font(25);g.textAlign='left';g.fillText(v.name+(v.k==='top'?' (은하면)':''),v.tx,TY-30);
      g.save();g.beginPath();g.rect(v.tx,TY,VW,VW);g.clip();
      g.fillStyle='rgba(30,41,59,.55)';g.fillRect(v.tx,TY,VW,VW);
      g.strokeStyle='rgba(148,163,184,.18)';g.lineWidth=1;for(let x=-10;x<=28;x+=10){const a=P(v,x,20),b=P(v,x,-20);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}for(let y=-20;y<=20;y+=10){const a=P(v,-12,y),b=P(v,28,y);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
      if(showD){
        if(v.k==='top'){const o=P(v,CX,0),gr=g.createRadialGradient(o[0],o[1],5,o[0],o[1],15*S);gr.addColorStop(0,'rgba(254,240,138,.45)');gr.addColorStop(1,'rgba(96,165,250,0.04)');g.fillStyle=gr;g.beginPath();g.arc(o[0],o[1],15*S,0,7);g.fill();
          g.strokeStyle='rgba(147,197,253,.5)';g.lineWidth=2;g.beginPath();g.arc(o[0],o[1],15*S,0,7);g.stroke();}
        else{const a=P(v,CX-15,0),b=P(v,CX+15,0),gr2=g.createLinearGradient(a[0],0,b[0],0);gr2.addColorStop(0,'rgba(147,197,253,.15)');gr2.addColorStop(.5,'rgba(254,240,138,.7)');gr2.addColorStop(1,'rgba(147,197,253,.15)');g.fillStyle=gr2;g.beginPath();g.ellipse((a[0]+b[0])/2,a[1],(b[0]-a[0])/2,7,0,0,7);g.fill();
          const cb=P(v,CX,0);g.fillStyle='rgba(254,240,138,.5)';g.beginPath();g.ellipse(cb[0],cb[1],28,18,0,0,7);g.fill();}
      }
      // 구상 성단 (하나씩 톡 튀어나오며 찍힘)
      for(let i=0;i<n;i++){const p=GC[i],q=P(v,p.x,p[v.b]),age=t-(shown[i]||0),k=Math.max(0,1-age/300);
        g.fillStyle=p.z>=0?'#60a5fa':'#f87171';g.beginPath();g.arc(q[0],q[1],5.5*(1+1.4*k),0,7);g.fill();
        if(k>0){g.strokeStyle='rgba(253,224,71,'+k+')';g.lineWidth=2;g.beginPath();g.arc(q[0],q[1],6+18*(1-k),0,7);g.stroke();}}
      // 태양
      const s=P(v,0,0);g.fillStyle='#facc15';g.beginPath();g.arc(s[0],s[1],9,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#fde68a';g.font=SIM.font(21);g.textAlign='center';g.fillText('태양',s[0],s[1]-16);
      // 마우스 안내 (관측 끝, 아직 못 찾은 그림)
      if(done()&&!ok[v.k]&&!reveal&&hover&&hover.v===v){g.strokeStyle='rgba(226,232,240,.8)';g.lineWidth=2;g.beginPath();g.arc(hover.p.x,hover.p.y,TOL*S,0,7);g.stroke();
        g.beginPath();g.moveTo(hover.p.x-8,hover.p.y);g.lineTo(hover.p.x+8,hover.p.y);g.moveTo(hover.p.x,hover.p.y-8);g.lineTo(hover.p.x,hover.p.y+8);g.stroke();}
      // 정답(찾았거나 정답 보기)
      if(ok[v.k]||reveal){const m=cen(),q=P(v,m.x,m[v.b]),gs=guess[v.k];
        g.setLineDash([7,7]);g.strokeStyle='#fb923c';g.lineWidth=2.5;g.beginPath();g.moveTo(s[0],s[1]);g.lineTo(q[0],q[1]);g.stroke();g.setLineDash([]);
        if(gs){const k=Math.min(1,(t-gs.at)/600);g.strokeStyle='rgba(74,222,128,'+(1-0.4*k)+')';g.lineWidth=4;g.beginPath();g.arc(gs.p.x,gs.p.y,16+20*(1-k),0,7);g.stroke();}
        g.strokeStyle='#fb923c';g.lineWidth=5;g.beginPath();g.moveTo(q[0]-13,q[1]-13);g.lineTo(q[0]+13,q[1]+13);g.moveTo(q[0]+13,q[1]-13);g.lineTo(q[0]-13,q[1]+13);g.stroke();
        g.fillStyle='#fdba74';g.font=SIM.font(22);g.textAlign='center';g.fillText('분포의 중심',q[0],q[1]+38);}
      g.restore();
      g.strokeStyle='#475569';g.lineWidth=2;g.strokeRect(v.tx,TY,VW,VW);
      g.fillStyle='#94a3b8';g.font=SIM.font(19,false);g.textAlign='center';for(let x=-10;x<=28;x+=10){const a=P(v,x,-20);g.fillText(x+' kpc',a[0],a[1]+26);}
    });
    // 틀린 곳
    const now=performance.now();marks=marks.filter(m=>m.until>now);
    marks.forEach(m=>{g.save();g.globalAlpha=Math.min(1,(m.until-now)/400);g.strokeStyle='#f87171';g.lineWidth=5;g.beginPath();g.moveTo(m.x-13,m.y-13);g.lineTo(m.x+13,m.y+13);g.moveTo(m.x+13,m.y-13);g.lineTo(m.x-13,m.y+13);g.stroke();g.restore();});
    g.textAlign='left';g.font=SIM.font(21,false);g.fillStyle='#60a5fa';g.fillText('● 은하면 위',VIEWS[1].tx,H-20);g.fillStyle='#f87171';g.fillText('● 은하면 아래',VIEWS[1].tx+150,H-20);
    g.fillStyle=done()&&!(ok.top&&ok.side)&&!reveal?'#fde68a':'#94a3b8';g.font=SIM.font(23);
    g.fillText(done()?(ok.top&&ok.side||reveal?'✔ 분포의 중심 = 우리은하의 중심':'👆 두 그림에서 분포의 중심을 클릭!'):'🔭 구상 성단 관측 중…',VIEWS[0].tx,H-20);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
</body>
