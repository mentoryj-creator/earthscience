<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>

  const c=document.getElementById('cB'),g=c.getContext('2d'),W=1060,H=610,L=120,R=1020,T=40,B=530,KS=c.width/W;
  const DATA=[[0.91,4.63],[3.92,-0.37],[1.19,3.8],[1.76,2.15],[1.39,3.2],[4.53,-0.85],[1.4,3.11],[2.5,1.49],[1.46,3.06],[0.9,5.53],[5.16,-1],[0.78,7],[1.78,2.03],[1.19,3.95],[1.78,1.77],[0.56,8.69]];
  const pts=DATA.map(d=>[Math.log10(d[0]),(4.83-d[1])/2.5]);
  let a=2,M=-0.2,sel=null; // sel: 클릭한 별 번호 (-1 = 태양)
  const fmtL=v=>v>=10?Math.round(v).toLocaleString():(v>=1?v.toFixed(1):v.toFixed(3));
  const info=i=>i<0?{m:1,Mv:4.83,L:1,nm:'태양'}:{m:DATA[i][0],Mv:DATA[i][1],L:Math.pow(10,pts[i][1]),nm:'별 '+(i+1)};
  const best=(()=>{let s1=0,s2=0;pts.forEach(p=>{s1+=p[0]*p[1];s2+=p[0]*p[0];});return s1/s2;})();
  const X=v=>L+(v+0.4)/1.3*(R-L),Y=v=>B-(v+2)/5*(B-T);
  function out(){document.getElementById('vB').textContent=a.toFixed(2);document.getElementById('rB').value=a;
    let err=0;pts.forEach(p=>err+=(p[1]-a*p[0])**2);
    document.getElementById('oB').innerHTML='<div>관계식: <b>L/L☉ = (M/M☉)<sup>'+a.toFixed(2)+'</sup></b></div><div>맞음 정도: <b class="'+(Math.abs(a-best)<0.15?'sim-ok':'or')+'">'+(Math.abs(a-best)<0.15?'아주 잘 맞아요! ✔':'조금 더 조절해 보세요')+'</b></div>'+
      (sel==null?'<div class="sim-note" style="margin-top:6px">그래프의 별(●)을 클릭하면 그 별의 광도를 볼 수 있어요.</div>'
        :(()=>{const s=info(sel);return '<div style="margin-top:8px;padding-top:8px;border-top:2px dashed #cbd5e1">🔍 <b>'+s.nm+'</b>: 질량 <b>'+s.m+'</b> M☉ · 절대 등급 '+s.Mv+'<br>→ 광도 = 태양의 <span class="sim-big" style="font-size:32px">'+fmtL(s.L)+'</span>배</div>';})());
    const lL=(4.83-M)/2.5,m=Math.pow(10,lL/a);document.getElementById('vB2').textContent=M.toFixed(1);
    document.getElementById('oB2').innerHTML='광도 = 태양의 <b>'+(Math.pow(10,lL)>=10?Math.round(Math.pow(10,lL)).toLocaleString():Math.pow(10,lL).toFixed(2))+'배</b> → 질량 ≈ <span class="sim-big" style="font-size:32px">'+m.toFixed(2)+'</span> 배';}
  document.getElementById('rB').oninput=e=>{a=+e.target.value;out();};document.getElementById('rB2').oninput=e=>{M=+e.target.value;out();};
  document.getElementById('bB').onclick=()=>{a=Math.round(best*100)/100;out();};out();
  // 별 클릭 → 광도 표시
  const hit=e=>{const p=SIM.pos(e,c),x=p.x/KS,y=p.y/KS;let bi=null,bd=22;
    pts.forEach((q,i)=>{const d=Math.hypot(X(q[0])-x,Y(q[1])-y);if(d<bd){bd=d;bi=i;}});
    if(Math.hypot(X(0)-x,Y(0)-y)<bd)bi=-1;return bi;};
  c.addEventListener('click',e=>{const h=hit(e);sel=h==null?null:h;out();});
  c.addEventListener('pointermove',e=>{c.style.cursor=hit(e)==null?'default':'pointer';});
  SIM.loop('d204_ml',()=>{
    g.setTransform(KS,0,0,KS,0,0);
    g.clearRect(0,0,W,H);g.strokeStyle='#e2e8f0';g.lineWidth=1.5;
    for(let v=-0.4;v<=0.9;v+=0.2){g.beginPath();g.moveTo(X(v),T);g.lineTo(X(v),B);g.stroke();}for(let v=-2;v<=3;v+=1){g.beginPath();g.moveTo(L,Y(v));g.lineTo(R,Y(v));g.stroke();}
    g.strokeStyle='#334155';g.lineWidth=3;g.beginPath();g.moveTo(L,T);g.lineTo(L,B);g.lineTo(R,B);g.stroke();
    g.fillStyle='#334155';g.font=SIM.font(18,false);g.textAlign='center';for(let v=-0.4;v<=0.81;v+=0.2)g.fillText(v.toFixed(1),X(v),B+24);g.textAlign='right';for(let v=-2;v<=3;v++)g.fillText(v,L-10,Y(v)+6);
    g.textAlign='center';g.font=SIM.font(22);g.fillText('log (질량 / 태양 질량)',(L+R)/2,B+58);g.save();g.translate(36,(T+B)/2);g.rotate(-Math.PI/2);g.fillText('log (광도 / 태양 광도)',0,0);g.restore();
    g.strokeStyle='#ea580c';g.lineWidth=4;g.beginPath();g.moveTo(X(-0.4),Y(-0.4*a));g.lineTo(X(0.9),Y(0.9*a));g.stroke();
    pts.forEach(p=>{g.fillStyle='#2563eb';g.beginPath();g.arc(X(p[0]),Y(p[1]),8,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();});
    g.fillStyle='#facc15';g.beginPath();g.arc(X(0),Y(0),10,0,7);g.fill();g.strokeStyle='#92400e';g.stroke();g.fillStyle='#92400e';g.font=SIM.font(19);g.textAlign='left';g.fillText('태양',X(0)+14,Y(0)+24);
    const lL=(4.83-M)/2.5,lm=lL/a;if(lm>-0.4&&lm<0.9){g.setLineDash([6,6]);g.strokeStyle='#16a34a';g.lineWidth=2;g.beginPath();g.moveTo(L,Y(lL));g.lineTo(X(lm),Y(lL));g.lineTo(X(lm),B);g.stroke();g.setLineDash([]);g.fillStyle='#16a34a';g.beginPath();g.arc(X(lm),Y(lL),9,0,7);g.fill();}
    // 선택한 별: 축까지 점선 + 광도 말풍선
    if(sel!=null){const s=info(sel),px=X(Math.log10(s.m)),py=Y(Math.log10(s.L));
      g.setLineDash([4,5]);g.strokeStyle='#7c3aed';g.lineWidth=2;g.beginPath();g.moveTo(L,py);g.lineTo(px,py);g.lineTo(px,B);g.stroke();g.setLineDash([]);
      g.strokeStyle='#7c3aed';g.lineWidth=3;g.beginPath();g.arc(px,py,15,0,7);g.stroke();
      const t1=s.nm+'  질량 '+s.m+' M☉',t2='광도 = 태양의 '+fmtL(s.L)+'배';g.font=SIM.font(20);
      const bw=Math.max(g.measureText(t1).width,g.measureText(t2).width)+28,bx=Math.min(px+22,R-bw),by=Math.max(T+30,py-80);
      g.fillStyle='rgba(255,255,255,.95)';g.strokeStyle='#7c3aed';g.lineWidth=2;g.beginPath();g.roundRect(bx,by,bw,64,10);g.fill();g.stroke();
      g.textAlign='left';g.fillStyle='#334155';g.fillText(t1,bx+14,by+26);g.fillStyle='#7c3aed';g.fillText(t2,bx+14,by+52);}
    g.fillStyle='#475569';g.font=SIM.font(18);g.textAlign='left';g.fillText('● 쌍성 자료 (교과서 p.74)   ━ 추세선   ● 추정할 별   (별을 클릭하면 광도 표시)',L+16,T+20);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
