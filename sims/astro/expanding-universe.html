<style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }
        .slide.active { display: flex; }
        
        /* 03단원 스타일 표지 디자인 */
        .slide.cover-slide { background-color: #1e293b; padding: 60px; }
        .cover-card { background-color: white; width: 100%; height: 100%; border-radius: 20px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; }

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px;}
        .ppt-subtitle { display: inline-block; font-size: 42px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 15px 35px; border-radius: 0 20px 20px 0; margin-bottom: 40px; align-self: flex-start;}

        .ppt-list li:last-child { margin-bottom: 0; }
        
        .math-box { font-size: 55px; background-color: #faf5ff; border-left: 8px solid #a855f7; padding: 30px; text-align: center; border-radius: 0 20px 20px 0; margin: 30px 0; font-weight: bold;}
        .cite { display: none; }

        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px;}

        .ppt-table th { background-color: #3b82f6; color: white; padding: 20px; border: 2px solid #93c5fd; font-weight: bold;}
        .ppt-table td { padding: 25px 20px; border: 2px solid #cbd5e1; background-color: white; text-align: center; }
        .ppt-table tr:nth-child(even) td { background-color: #f8fafc; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; font-family: 'Gowun Dodum', sans-serif;}
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; font-family: 'Gowun Dodum', sans-serif;}
        #fullscreen-btn:hover { background-color: #1e293b; }

        /* 애니메이션 모음 */
        @keyframes expand-space { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        @keyframes stretch-wave { 0% { stroke-dasharray: 10, 10; stroke: #3b82f6;} 50% { stroke-dasharray: 25, 25; stroke: #ef4444; } 100% { stroke-dasharray: 10, 10; stroke: #3b82f6;} }
        @keyframes redshift-shift { 0% { transform: translateX(0); } 50% { transform: translateX(80px); } 100% { transform: translateX(0); } }
        @keyframes scatter-dots { 0% { transform: scale(0.8) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes scan-line { 0% { transform: translateY(0); } 50% { transform: translateY(200px); } 100% { transform: translateY(0); } }
        @keyframes pulse-light { 0%, 100% { opacity: 0.7; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

        .anim-expand { animation: expand-space 6s ease-in-out infinite; transform-origin: center; }
        .anim-stretch { animation: stretch-wave 6s ease-in-out infinite; }
        .anim-shift { animation: redshift-shift 4s ease-in-out infinite; }
        .anim-scatter { animation: scatter-dots 1s ease-out forwards; }
        .anim-scan { animation: scan-line 3s linear infinite; }
        .anim-pulse { animation: pulse-light 3s ease-in-out infinite; transform-origin: center; }
    
        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */

        .sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
        .sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: none; }

        .sim-slide, .sim-slide button, .sim-slide table { font-family: 'Gowun Dodum', sans-serif; }
        .sim-box p, .sim-box div { margin: 0; }
        .sim-box.key h4 { color: #c2410c; }
        .sim-row { display: flex; align-items: center; gap: 14px; font-size: 27px; margin: 6px 0; }

        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
        .sim-btn:hover { background: #e2e8f0; }
        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .sim-btn.orange { border-color: #fdba74; color: #c2410c; }

        .sim-table { width: 100%; border-collapse: collapse; font-size: 26px; }

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }

(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  /* 휴대폰·태블릿: 전체화면이 되면 가로 화면으로 고정 (지원하는 기기만) */
  function land(){ try { var o = screen.orientation; if (!o) return; if (document.fullscreenElement || document.webkitFullscreenElement) { if (o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function(){}); } } else if (o.unlock) o.unlock(); } catch(e){} }
  function sync(){ land(); btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();

    SIM._checks.push(() => o.items.forEach((m, i) => {
      if (done[i]) return;
      let ok = false; try { ok = !!m.test(); } catch (e) {}
      if (!ok) armed[i] = true; else if (armed[i]) mark(i);
    }));
    badge();
    return { mark, done };
  },
  _checks: [],
});
setInterval(() => SIM._checks.forEach(f => f()), 250);
</script>
<script id="pem-cfg">

// 3.05 팽창하는 우주 — 상태: rK 크기 배율, #tK 은하 A·B 거리 표, #oK 은하 A·B 빛의 z, 캔버스 클릭 = 기준 은하 바꾸기
const a = () => SIM.val('rK');
const zB = () => { const x = SIM.text('#oK').match(/은하 B에서 온 빛.*?z = ([\d.]+)/); return x ? +x[1] : NaN; };

<script id="pem-pop">
/* 미션: 버튼 → 팝업 · 모두 달성하면 폭죽 */
(function(){
  const pp=document.getElementById('predictPop');
  if(pp){const pg=pp.querySelector('[data-page="predict"]'),sync=()=>{pp.hidden=!pg.classList.contains('on');};
    new MutationObserver(sync).observe(pg,{attributes:true,attributeFilter:['class']});sync();
    document.getElementById('predictClose').onclick=()=>SIM.showTab('lab');
    pp.addEventListener('pointerdown',e=>{if(e.target===pp)SIM.showTab('lab');});}
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script><!--pem:end-->
