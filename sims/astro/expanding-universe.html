<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }
        .slide.active { display: flex; }
        
        /* 03단원 스타일 표지 디자인 */
        .slide.cover-slide { background-color: #1e293b; padding: 60px; }
        .cover-card { background-color: white; width: 100%; height: 100%; border-radius: 20px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; }

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px;}
        .ppt-subtitle { display: inline-block; font-size: 42px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 15px 35px; border-radius: 0 20px 20px 0; margin-bottom: 40px; align-self: flex-start;}

        .ppt-list { font-size: 38px; color: #1e293b; line-height: 1.6; background-color: #f8fafc; padding: 30px 40px; border-radius: 20px; border: 2px solid #e2e8f0; }

        .ppt-list li:last-child { margin-bottom: 0; }
        
        .math-box { font-size: 55px; background-color: #faf5ff; border-left: 8px solid #a855f7; padding: 30px; text-align: center; border-radius: 0 20px 20px 0; margin: 30px 0; font-weight: bold;}

        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px;}

        .ppt-table { width: 100%; border-collapse: collapse; font-size: 34px; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-radius: 15px; overflow: hidden; }

        .ppt-table td { padding: 25px 20px; border: 2px solid #cbd5e1; background-color: white; text-align: center; }
        .ppt-table tr:nth-child(even) td { background-color: #f8fafc; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; font-family: 'Gowun Dodum', sans-serif;}
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; font-family: 'Gowun Dodum', sans-serif;}
        #fullscreen-btn:hover { background-color: #1e293b; }

        /* 애니메이션 모음 */
        @keyframes expand-space { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        @keyframes stretch-wave { 0% { stroke-dasharray: 10, 10; stroke: #3b82f6;} 50% { stroke-dasharray: 25, 25; stroke: #ef4444; } 100% { stroke-dasharray: 10, 10; stroke: #3b82f6;} }
        @keyframes redshift-shift { 0% { transform: translateX(0); } 50% { transform: translateX(80px); } 100% { transform: translateX(0); } }
        @keyframes scatter-dots { 0% { transform: scale(0.8) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes scan-line { 0% { transform: translateY(0); } 50% { transform: translateY(200px); } 100% { transform: translateY(0); } }
        @keyframes pulse-light { 0%, 100% { opacity: 0.7; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

        .anim-expand { animation: expand-space 6s ease-in-out infinite; transform-origin: center; }
        .anim-stretch { animation: stretch-wave 6s ease-in-out infinite; }
        .anim-shift { animation: redshift-shift 4s ease-in-out infinite; }
        .anim-scatter { animation: scatter-dots 1s ease-out forwards; }
        .anim-scan { animation: scan-line 3s linear infinite; }
        .anim-pulse { animation: pulse-light 3s ease-in-out infinite; transform-origin: center; }
    
        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */
        .sim-slide .ppt-title { margin-bottom: 20px; padding-bottom: 14px; }
        .sim-slide .ppt-subtitle { font-size: 34px; padding: 10px 30px; margin-bottom: 22px; }
        .sim-tag { display: inline-block; background: #0f172a; color: #facc15; font-size: 28px; padding: 6px 18px; border-radius: 12px; margin-right: 18px; vertical-align: 8px; letter-spacing: 0; }
        .sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
        .sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: none; }
        .sim-stage.light { background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .sim-stage canvas { display: block; }
        .sim-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .sim-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px 26px; font-size: 28px; color: #1e293b; line-height: 1.5; word-break: keep-all; }
        .sim-box.key { background: #fff7ed; border-color: #fdba74; }
        .sim-box.blue { background: #eff6ff; border-color: #bfdbfe; }
        .sim-box h4 { font-size: 30px; font-weight: 800; color: #1d4ed8; margin: 0 0 8px 0; }
        .sim-slide, .sim-slide button, .sim-slide table { font-family: 'Gowun Dodum', sans-serif; }
        .sim-box p, .sim-box div { margin: 0; }
        .sim-box.key h4 { color: #c2410c; }
        .sim-row { display: flex; align-items: center; gap: 14px; font-size: 27px; margin: 6px 0; }
        .sim-row > .lbl { flex: none; width: 190px; font-weight: bold; color: #334155; }
        input[type=range].sim-range { flex: 1; accent-color: #3b82f6; height: 36px; cursor: pointer; min-width: 0; }
        .sim-val { flex: none; min-width: 150px; text-align: right; font-weight: bold; color: #ea580c; font-size: 29px; }
        .sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
        .sim-btn:hover { background: #e2e8f0; }
        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .sim-btn.orange { border-color: #fdba74; color: #c2410c; }
        .sim-btn.orange.on { background: #ea580c; border-color: #ea580c; color: #fff; }
        .sim-table { width: 100%; border-collapse: collapse; font-size: 26px; }
        .sim-table th { background: #3b82f6; color: #fff; padding: 8px 10px; font-weight: bold; }
        .sim-table td { padding: 6px 10px; border-bottom: 2px solid #e2e8f0; text-align: center; background: #fff; }
        .sim-big { font-size: 40px; font-weight: 800; color: #ea580c; }
        .sim-note { font-size: 22px; color: #64748b; line-height: 1.45; }
        .sim-ok { color: #16a34a; font-weight: bold; }
        .sim-hint { position: absolute; left: 20px; top: 16px; font-size: 22px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 6px 14px; border-radius: 10px; pointer-events: none; }
        .sim-stage.light .sim-hint { color: #475569; background: rgba(255,255,255,0.9); }
    </style>
<style id="standalone">
  /* ---- 독립 실행용 (사이트 iframe·수업 모드·새 창에 맞춤) ---- */

<body>
<div id="presentation-wrapper">
<div class="slide sim-slide active" id="simK">
            <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>팽창하는 우주에서 은하와 빛 관찰하기</div>
            <div class="ppt-subtitle">어느 은하에서 보아도 먼 은하일수록 더 빨리 멀어집니다.</div>
            <div class="sim-wrap">
                <div class="sim-stage"><canvas id="cK" width="1060" height="610" style="cursor:pointer"></canvas><div class="sim-hint">은하를 클릭하면 그 은하가 ‘우리 은하’가 돼요</div></div>
                <div class="sim-panel">
                    <div class="sim-box blue">
                        <h4>우주의 크기</h4>
                        <div class="sim-row"><span class="lbl">크기 배율</span><input type="range" class="sim-range" id="rK" min="1" max="2" step="0.01" value="1"><span class="sim-val" id="vK">× 1.00</span></div>
                        <div class="sim-btns"><button class="sim-btn on" id="bK1">▶ 팽창 시작</button><button class="sim-btn" id="bK2">↺ 처음으로</button></div>
                    </div>
                    <div class="sim-box">
                        <h4>기준 은하에서 잰 거리</h4>
                        <table class="sim-table">
                            <thead><tr><th></th><th>처음</th><th>지금</th><th>늘어난 거리</th></tr></thead>
                            <tbody id="tK"></tbody>
                        </table>
                    </div>
                    <div class="sim-box key" id="oK" style="font-size:26px"></div>
                </div>
            </div>
        </div>
</div>
<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>


    /* ===================== 시뮬레이션 K: 팽창하는 우주 ===================== */
    (function () {
        const c = document.getElementById('cK'), g = c.getContext('2d'), r = SIM.rng(12);
        const W = 1060, H = 610, CX = 530, CY = 250, SP = 95, NC = 13, NR = 7;
        const gal = [];
        for (let j = 0; j < NR; j++) for (let i = 0; i < NC; i++) gal.push({ i: i, j: j, x: (i - (NC - 1) / 2) * SP + SIM.gauss(r) * 9, y: (j - (NR - 1) / 2) * SP + SIM.gauss(r) * 9, rot: r() * 3, col: r() < .5 ? [253, 230, 138] : [191, 219, 254] });
        let obs = gal.findIndex(p => p.i === 6 && p.j === 3), a = 1, play = false, ph = 0;
        const find = (i, j) => gal.findIndex(p => p.i === i && p.j === j);
        function AB() { const o = gal[obs]; let dir = o.i + 3 < NC ? 1 : -1; return [find(o.i + dir, o.j), find(o.i + 3 * dir, o.j)]; }
        const dist = (k) => Math.hypot(gal[k].x - gal[obs].x, gal[k].y - gal[obs].y) / SP * 100;
        function out() {
            document.getElementById('vK').textContent = '× ' + a.toFixed(2);
            document.getElementById('rK').value = a;
            const [ka, kb] = AB(); let h = '';
            [['A', ka, '#2563eb'], ['B', kb, '#dc2626']].forEach(([n, k, col]) => { const d0 = dist(k); h += '<tr><td style="font-weight:bold;color:' + col + '">은하 ' + n + '</td><td>' + d0.toFixed(0) + ' Mpc</td><td>' + (d0 * a).toFixed(0) + ' Mpc</td><td style="font-weight:bold;color:' + col + '">+' + (d0 * (a - 1)).toFixed(0) + '</td></tr>'; });
            document.getElementById('tK').innerHTML = h;
            const lam = 450 * a;
            document.getElementById('oK').innerHTML = '<h4>빛의 파장도 함께 늘어나요</h4>출발할 때 <b style="color:#2563eb">450 nm</b> → 지금 <b style="color:' + (lam > 780 ? '#64748b' : '#dc2626') + '">' + lam.toFixed(0) + ' nm</b>' + (lam > 780 ? ' (적외선)' : '') + '<br>적색 이동 z = ' + (a - 1).toFixed(2) + ' <span class="sim-note">(= 우주가 커진 비율 − 1)</span>';
        }
        const bp = document.getElementById('bK1');
        bp.onclick = () => { if (a >= 2) a = 1; play = !play; bp.textContent = play ? '❚❚ 멈춤' : '▶ 팽창 시작'; out(); };
        document.getElementById('bK2').onclick = () => { a = 1; play = false; bp.textContent = '▶ 팽창 시작'; out(); };
        document.getElementById('rK').oninput = e => { a = +e.target.value; play = false; bp.textContent = '▶ 팽창 시작'; out(); };
        c.addEventListener('click', e => {
            const p = SIM.pos(e, c); let best = -1, bd = 1e9;
            gal.forEach((q, k) => { const x = CX + (q.x - gal[obs].x) * a, y = CY + (q.y - gal[obs].y) * a, d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = k; } });
            if (bd < 40) { obs = best; out(); }
        });
        out();
        SIM.loop('simK', (t, dt) => {
            if (play) { a = Math.min(2, a + dt * 0.12); if (a >= 2) { play = false; bp.textContent = '▶ 팽창 시작'; } out(); }
            g.fillStyle = '#0f172a'; g.fillRect(0, 0, W, H);
            const o = gal[obs], [ka, kb] = AB();
            // 격자 (공간)
            g.strokeStyle = 'rgba(71,85,105,.35)'; g.lineWidth = 1;
            for (let i = -8; i <= 8; i++) { const x = CX + (i * SP - o.x % SP) * a; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 470); g.stroke(); }
            for (let j = -5; j <= 5; j++) { const y = CY + (j * SP - o.y % SP) * a; if (y > 470) continue; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
            gal.forEach((q, k) => {
                const dx = (q.x - o.x) * a, dy = (q.y - o.y) * a, x = CX + dx, y = CY + dy;
                if (y < -20 || y > 470 || x < -20 || x > W + 20) return;
                // 후퇴 속도 화살표 (거리에 비례)
                if (k !== obs) {
                    const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, len = L * 0.16;
                    g.strokeStyle = 'rgba(248,113,113,.75)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + ux * 12, y + uy * 12); g.lineTo(x + ux * (12 + len), y + uy * (12 + len)); g.stroke();
                    g.fillStyle = 'rgba(248,113,113,.75)'; const ex = x + ux * (12 + len), ey = y + uy * (12 + len); g.beginPath(); g.moveTo(ex + ux * 8, ey + uy * 8); g.lineTo(ex - uy * 6, ey + ux * 6); g.lineTo(ex + uy * 6, ey - ux * 6); g.fill();
                }
                g.save(); g.translate(x, y); g.rotate(q.rot); g.fillStyle = 'rgba(' + q.col.join(',') + ',.95)'; g.beginPath(); g.ellipse(0, 0, 9, 4, 0, 0, 7); g.fill(); g.restore();
                if (k === obs) { g.strokeStyle = '#4ade80'; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 20, 0, 7); g.stroke(); g.fillStyle = '#4ade80'; g.font = SIM.font(22); g.textAlign = 'center'; g.fillText('기준 은하 (우리)', x, y - 30); }
                if (k === ka || k === kb) { const col = k === ka ? '#60a5fa' : '#f87171'; g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 17, 0, 7); g.stroke(); g.fillStyle = col; g.font = SIM.font(22); g.textAlign = 'center'; g.fillText(k === ka ? 'A' : 'B', x, y + 40); }
            });
            // 빛의 파장
            g.fillStyle = '#020617'; g.fillRect(0, 470, W, 140);
            const lam = 450 * a, rgb = lam > 780 ? [148, 163, 184] : SIM.wl2rgb(lam), wl = 46 * a; ph += dt * 120;
            g.strokeStyle = 'rgba(96,165,250,.35)'; g.lineWidth = 2; g.beginPath();
            for (let x = 250; x < 1030; x += 2) { const y = 515 + 18 * Math.sin((x - ph) / 46 * 6.283); x === 250 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
            g.strokeStyle = 'rgb(' + rgb.join(',') + ')'; g.lineWidth = 4; g.beginPath();
            for (let x = 250; x < 1030; x += 2) { const y = 570 + 18 * Math.sin((x - ph) / wl * 6.283); x === 250 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
            g.textAlign = 'left'; g.font = SIM.font(21);
            g.fillStyle = '#93c5fd'; g.fillText('출발할 때 빛 (450 nm)', 20, 522);
            g.fillStyle = 'rgb(' + rgb.join(',') + ')'; g.fillText('지금 도착한 빛 (' + lam.toFixed(0) + ' nm)', 20, 577);
            g.fillStyle = '#fca5a5'; g.font = SIM.font(20, false); g.textAlign = 'right'; g.fillText('빨간 화살표 = 멀어지는 속도 (거리에 비례)', W - 16, 30);
        });
    })();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
