<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생명 가능 지대 탐험</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', sans-serif; color: #1e293b; }
        button, input { font-family: 'Gowun Dodum', sans-serif; }
        p, h3, figure { margin: 0; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }
        .slide.active { display: flex; }

        /* 표지 (03~05단원과 동일) */
        .slide.cover-slide { background-color: #1e293b; padding: 60px; }
        .cover-card { background-color: white; width: 100%; height: 100%; border-radius: 20px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; }

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px; line-height: 1.25; }
        .ppt-subtitle { display: inline-block; font-size: 38px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 12px 32px; border-radius: 0 20px 20px 0; margin-bottom: 28px; align-self: flex-start; }
        .ppt-text { font-size: 38px; color: #334155; line-height: 1.6; margin-bottom: 25px; word-break: keep-all; }
        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; }
        #fullscreen-btn:hover { background-color: #1e293b; }

        .guide-label { position: absolute; bottom: 20px; right: 30px; font-size: 24px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 10px 20px; border-radius: 10px; font-weight: bold; z-index: 10; }
        /* 06단원 본문 요소 (03~05단원 색·글꼴 체계에 맞춤) */
        .main { flex: 1; min-height: 0; display: flex; gap: 40px; }
        .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .grow { flex: 1; min-width: 0; }
        .card { background: #fff; border: 2px solid #cbd5e1; border-radius: 20px; padding: 20px 28px; font-size: 31px; line-height: 1.55; color: #1e293b; word-break: keep-all; }
        .card.soft { background: #f8fafc; border-color: #e2e8f0; }
        .card.key { background: #fff7ed; border-color: #fdba74; }
        .card h3 { font-size: 34px; font-weight: 800; color: #1d4ed8; margin: 0 0 6px 0; }
        .card.goal { display: flex; align-items: center; gap: 24px; font-size: 36px; padding: 26px 32px; }
        .gnum { flex: none; display: inline-flex; width: 60px; height: 60px; border-radius: 50%; background: #3b82f6; color: #fff; font-weight: 800; font-size: 34px; align-items: center; justify-content: center; }
        .gnum.s { width: auto; height: auto; background: none; color: #ea580c; font-size: 34px; }
        .hl { color: #2563eb; font-weight: bold; }
        .or { color: #ea580c; font-weight: bold; }
        .ppt-subtitle .or { color: #ea580c; }
        .look { display: inline-block; background: #3b82f6; color: #fff; border-radius: 10px; padding: 2px 14px; font-size: 25px; font-weight: bold; margin-right: 10px; vertical-align: 3px; }
        .look.o { background: #ea580c; }
        .cap { font-size: 23px; color: #64748b; margin-top: 8px; }
        figure { position: relative; }
        figure img { display: block; width: 100%; border-radius: 16px; border: 2px solid #e2e8f0; }
        .chip { display: inline-block; border: 2px solid #cbd5e1; border-radius: 999px; padding: 2px 18px; font-size: 27px; font-weight: bold; margin: 4px 8px 4px 0; background: #fff; color: #334155; }
        .chip.b { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }
        .chip.o { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
        .big { font-size: 64px; font-weight: 800; color: #ea580c; line-height: 1.1; }
        .note { font-size: 24px; color: #64748b; line-height: 1.45; }
        .gcard { flex: 1; border: 2px solid #cbd5e1; background: #f8fafc; border-radius: 20px; padding: 22px 28px; display: flex; flex-direction: column; gap: 8px; font-size: 28px; line-height: 1.5; word-break: keep-all; }
        .gcard.orange { border-color: #fdba74; background: #fff7ed; }
        .gcard h3 { font-size: 44px; font-weight: 800; color: #1e293b; }
        .gcard .kw { font-size: 32px; font-weight: bold; color: #2563eb; }
        .ox { display: inline-block; width: 52px; height: 52px; border-radius: 50%; border: 3px solid #dc2626; color: #dc2626; text-align: center; font-size: 32px; line-height: 46px; font-weight: bold; margin-right: 8px; }
        .blank { display: inline-block; min-width: 200px; border-bottom: 4px dashed #ea580c; text-align: center; color: transparent; cursor: pointer; font-weight: bold; transition: color .4s; user-select: none; }
        .blank.on { color: #ea580c; border-bottom-style: solid; }
        .barrow { display: flex; align-items: center; gap: 20px; height: 84px; }
        .barrow .bl { width: 340px; }
        .barrow .bt { position: relative; flex: 1; height: 44px; background: #e2e8f0; border-radius: 10px; }
        .barrow .rb { position: absolute; top: 0; height: 100%; border-radius: 10px; transition: width .9s; }
        .barrow .bv { width: 200px; font-size: 34px; font-weight: 800; }
        .qrow { display: flex; align-items: center; gap: 16px; }
        .q { font-size: 32px; padding: 18px 28px; }
        .q .sim-btn { font-size: 32px; padding: 4px 26px; }
        .q .res { width: 160px; font-size: 32px; font-weight: 800; }
        .q .why { margin-top: 6px; font-size: 26px; }
        .sim-btn.tool.on { background: var(--c); border-color: var(--c); color: #fff; }
        .sim-btn.tool { border-color: var(--c); color: var(--c); }
        .sim-row span { font-size: 26px; }
        .pulse { animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

        /* 단계별로 나타나기 (다음 ▶ 버튼으로 하나씩 보여 줌) */
        [data-step] { opacity: 0; transform: translateY(14px); transition: opacity .55s, transform .55s; pointer-events: none; }
        [data-step].on { opacity: 1; transform: none; pointer-events: auto; }
        svg [data-step] { transform: none !important; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .slide.active .ppt-title { animation: rise .6s both; }
        .slide.active .ppt-subtitle { animation: rise .6s .1s both; }
        .slide.active .main { animation: rise .6s .2s both; }

        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */
        .sim-slide .ppt-title { margin-bottom: 20px; padding-bottom: 14px; }
        .sim-slide .ppt-subtitle { font-size: 34px; padding: 10px 30px; margin-bottom: 22px; }
        .sim-tag { display: inline-block; background: #0f172a; color: #facc15; font-size: 28px; padding: 6px 18px; border-radius: 12px; margin-right: 18px; vertical-align: 8px; letter-spacing: 0; }
        .sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
        .sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: none; }
        .sim-stage.light { background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .sim-stage canvas { display: block; }
        .sim-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .sim-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px 26px; font-size: 28px; color: #1e293b; line-height: 1.5; word-break: keep-all; }
        .sim-box.key { background: #fff7ed; border-color: #fdba74; }
        .sim-box.blue { background: #eff6ff; border-color: #bfdbfe; }
        .sim-box h4 { font-size: 30px; font-weight: 800; color: #1d4ed8; margin: 0 0 8px 0; }
        .sim-slide, .sim-slide button, .sim-slide table { font-family: 'Gowun Dodum', sans-serif; }
        .sim-box p, .sim-box div { margin: 0; }
        .sim-box.key h4 { color: #c2410c; }
        .sim-row { display: flex; align-items: center; gap: 14px; font-size: 27px; margin: 6px 0; }
        .sim-row > .lbl { flex: none; width: 190px; font-weight: bold; color: #334155; }
        input[type=range].sim-range { flex: 1; accent-color: #3b82f6; height: 36px; cursor: pointer; min-width: 0; }
        .sim-val { flex: none; min-width: 150px; text-align: right; font-weight: bold; color: #ea580c; font-size: 29px; }
        .sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
        .sim-btn:hover { background: #e2e8f0; }
        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .sim-btn.orange { border-color: #fdba74; color: #c2410c; }
        .sim-btn.orange.on { background: #ea580c; border-color: #ea580c; color: #fff; }
        .sim-table { width: 100%; border-collapse: collapse; font-size: 26px; }
        .sim-table th { background: #3b82f6; color: #fff; padding: 8px 10px; font-weight: bold; }
        .sim-table td { padding: 6px 10px; border-bottom: 2px solid #e2e8f0; text-align: center; background: #fff; }
        .sim-big { font-size: 40px; font-weight: 800; color: #ea580c; }
        .sim-note { font-size: 22px; color: #64748b; line-height: 1.45; }
        .sim-ok { color: #16a34a; font-weight: bold; }
        .sim-hint { position: absolute; left: 20px; top: 16px; font-size: 22px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 6px 14px; border-radius: 10px; pointer-events: none; }
        .sim-stage.light .sim-hint { color: #475569; background: rgba(255,255,255,0.9); }

        /* ===== 3.01 / 3.02 추가 요소 ===== */
        .ppt-table { width: 100%; border-collapse: collapse; font-size: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-radius: 15px; overflow: hidden; }
        .ppt-table th { background-color: #2563eb; color: white; padding: 18px; border: 2px solid #93c5fd; font-weight: bold; }
        .ppt-table td { padding: 16px 18px; border: 2px solid #cbd5e1; background-color: white; text-align: center; }
        .ppt-table tr:nth-child(even) td { background-color: #f8fafc; }
        .ppt-table td.rowh { background: #eff6ff; font-weight: bold; color: #1e3a8a; }
        .video-frame { background: #000; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; }
        .video-frame video { display: block; max-width: 100%; max-height: 100%; }
        .imgbox { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 12px; display: flex; align-items: center; justify-content: center; }
        .imgbox img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
        .formula { font-size: 44px; font-weight: 800; background: #eff6ff; border-left: 8px solid #3b82f6; padding: 18px 30px; border-radius: 0 20px 20px 0; color: #1e293b; text-align: center; }
        .flow { display: flex; flex-direction: column; gap: 14px; }
        .flow .card { display: flex; align-items: center; gap: 20px; }
        .arrow-down { text-align: center; color: #94a3b8; font-size: 30px; line-height: 1; margin: -6px 0; }
        .ans { color: #dc2626; font-weight: 800; }
        .filter-chip { display: flex; align-items: center; gap: 16px; border-radius: 14px; padding: 12px 20px; font-size: 30px; font-weight: bold; }
        .filter-chip .dot { width: 46px; height: 46px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }

        .two { display:flex; gap:40px; flex:1; min-height:0; }
        .stack { display:flex; flex-direction:column; gap:18px; justify-content:center; flex:1; min-width:0; }
        .imgbox video { max-width:100%; max-height:100%; }
        .sim-stage canvas { touch-action:none; }
        .vid-miss { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; color:#e2e8f0; font-size:28px; line-height:1.6; background:#0f172a; }
        .fs-btn { position: absolute; top: 34px; right: 60px; z-index: 60; font-family: 'Gowun Dodum', sans-serif; font-size: 32px; font-weight: bold; padding: 8px 26px; border-radius: 999px; border: 3px solid #cbd5e1; background: #fff; color: #1e293b; cursor: pointer; transition: all .2s; }
        .fs-btn:hover { border-color: #3b82f6; color: #1d4ed8; }
    </style>
<style id="standalone">
  /* ---- 독립 실행용 (사이트 iframe·수업 모드·새 창에 맞춤) ---- */
  html, body { margin: 0 !important; padding: 0 !important; width: auto !important; height: auto !important;
    overflow: hidden !important; display: block !important; background: #ffffff; }
  html.fit, html.fit body { height: 100% !important; background: #0f172a; }
  html.pfs body { position: fixed !important; inset: 0 !important; z-index: 9999; }
  #presentation-wrapper { position: relative !important; top: 0 !important; left: 0 !important;
    width: 1920px !important; height: auto !important; transform-origin: 0 0 !important;
    border-radius: 0 !important; box-shadow: none !important; overflow: visible !important; background: #fff !important; }
  #presentation-wrapper > .slide { display: flex !important; height: auto !important; min-height: 0 !important;
    padding: 34px 60px 40px 60px !important; }
  #presentation-wrapper > .slide > .ppt-title { display: none !important; }
  /* 16:9 고정 (1920×1080) */
  #presentation-wrapper { height: 1080px !important; overflow: hidden !important; }
  #presentation-wrapper > .slide { height: 100% !important; }
  #d105_hz .sim-stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
  #d105_hz .sim-stage canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  #d105_hz .sim-panel { flex: 0 0 600px; justify-content: center; }
  #presentation-wrapper > .slide > .ppt-subtitle { margin-top: 0 !important; }
  #presentation-wrapper [data-step] { opacity: 1 !important; visibility: visible !important; }
  #presentation-wrapper .slide, #presentation-wrapper .slide * { animation: none !important; }
</style>
</head>
<body>
<div id="presentation-wrapper">
<button class="fs-btn" id="fsBtn" type="button">⛶ 전체화면</button>
<div class="slide sim-slide active" id="d105_hz"><div class="ppt-title"><span class="sim-tag">시뮬레이션</span>생명 가능 지대 탐험</div><div class="ppt-subtitle">중심별의 광도, 행성의 궤도·반사율·온실 효과를 바꾸며 생명 가능 지대를 찾아보세요.</div>
<div class="sim-wrap"><div class="sim-stage"><canvas id="cD" width="1160" height="900"></canvas></div>
<div class="sim-panel"><div class="sim-box blue"><h4>중심별과 공전 궤도</h4>
<div class="sim-row"><span class="lbl" style="width:170px">중심별 광도</span><input type="range" class="sim-range" id="rD1" min="-2" max="1.5" step="0.01" value="0"><span class="sim-val" id="vD1" style="min-width:160px"></span></div>
<div class="sim-row"><span class="lbl" style="width:170px">궤도 긴반지름</span><input type="range" class="sim-range" id="rD2" min="0.05" max="6" step="0.01" value="1"><span class="sim-val" id="vD2" style="min-width:160px"></span></div>
<div class="sim-row"><span class="lbl" style="width:170px">궤도 이심률</span><input type="range" class="sim-range" id="rD5" min="0" max="0.8" step="0.01" value="0"><span class="sim-val" id="vD5" style="min-width:160px"></span></div>
<div class="sim-btns"><button class="sim-btn" data-s="1,1">태양-지구</button><button class="sim-btn" data-s="0.01,0.08">적색 왜성</button><button class="sim-btn" data-s="20,3.5">밝은 별</button></div></div>
<div class="sim-box blue"><h4>행성의 반사율과 대기</h4>
<div class="sim-row"><span class="lbl" style="width:170px">반사율</span><input type="range" class="sim-range" id="rD3" min="0" max="0.9" step="0.01" value="0.3"><span class="sim-val" id="vD3" style="min-width:160px"></span></div>
<div class="sim-row"><span class="lbl" style="width:170px">온실 효과</span><input type="range" class="sim-range" id="rD4" min="0" max="150" step="1" value="33"><span class="sim-val" id="vD4" style="min-width:160px"></span></div>
<div class="sim-btns"><button class="sim-btn" data-a="0,0">없음</button><button class="sim-btn" data-a="0.3,33">지구</button><button class="sim-btn" data-a="0.25,5">화성형</button><button class="sim-btn" data-a="0.75,150">금성형</button></div></div><div class="sim-box" id="oD" style="font-size:26px"></div></div></div></div>
</div>
<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');

        }
    };

    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));

<script>



/* ===== 생명 가능 지대 ===== */
(function(){
  const c=document.getElementById('cD'),g=c.getContext('2d'),W=1160,H=900,TAU=Math.PI*2;
  let L=1,a=1,e=0,Al=0.3,GH=33,Mn=0;
  // 행성 온도 (단순 복사 평형): 별빛만 → 반사율 반영 → 온실 효과 더하기 (r: 지금 별까지 거리)
  const T0=al=>278.6*Math.pow(1-al,0.25)*Math.pow(L,0.25);
  const Tbb=r=>T0(0)/Math.sqrt(r),Teq=r=>T0(Al)/Math.sqrt(r),Ts=r=>Teq(r)+GH;
  // 생명 가능 지대 = 표면 온도가 0~100 ℃ (273~373 K)인 거리
  const inner=()=>373-GH>0?Math.pow(T0(Al)/(373-GH),2):Infinity,outer=()=>273-GH>0?Math.pow(T0(Al)/(273-GH),2):Infinity;
  const Ms=()=>Math.pow(L,1/3.8),life=()=>100*Math.pow(Ms(),-2.5),Teff=()=>5778*Math.pow(Ms(),0.55);

  function kep(M){let E=e>0.8?Math.PI:M;for(let k=0;k<20;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;}
  const pos=M=>{const E=kep(M);return {x:a*(Math.cos(E)-e),y:a*Math.sqrt(1-e*e)*Math.sin(E),r:a*(1-e*Math.cos(E))};};
  // 한 바퀴 동안의 온도 (시간 기준으로 고르게 샘플)
  function orbitStats(){const N=360;let mn=1e9,mx=-1e9,inn=0;const arr=[];for(let k=0;k<N;k++){const T=C(Ts(pos(k/N*TAU).r));arr.push(T);mn=Math.min(mn,T);mx=Math.max(mx,T);if(T>=0&&T<=100)inn++;}return {arr,mn,mx,frac:inn/N};}
  let ST=orbitStats();
  function out(){ST=orbitStats();
    document.getElementById('vD1').textContent='태양의 '+fmtL(L)+'배';document.getElementById('vD2').textContent=a.toFixed(2)+' AU';document.getElementById('vD5').textContent=e.toFixed(2);
    document.getElementById('vD3').textContent=Al.toFixed(2);document.getElementById('vD4').textContent='+'+GH+' ℃';
    document.getElementById('rD1').value=Math.log10(L);document.getElementById('rD2').value=a;document.getElementById('rD5').value=e;document.getElementById('rD3').value=Al;document.getElementById('rD4').value=GH;
    const i=inner(),o=outer(),f=ST.frac;let st,col;
    if(f>0.999){st='공전하는 내내 생명 가능 지대 안! 💧';col='#16a34a';}else if(f>0){st='공전 시간의 '+Math.round(f*100)+'%만 생명 가능 지대 안';col='#ea580c';}else{st=ST.mn>100?'늘 너무 뜨거워요! 물이 증발해요.':'늘 너무 추워요! 물이 얼어요.';col=ST.mn>100?'#dc2626':'#2563eb';}

      '<div>표면 기온: <b>'+ST.mn+' ℃ ~ '+ST.mx+' ℃</b> <span class="sim-note">(공전하는 동안)</span></div><div style="color:'+col+';font-weight:bold;font-size:27px">'+st+'</div>'+
      '<div>중심별의 수명: <b>약 '+(lf>=1?Math.round(lf).toLocaleString():lf.toFixed(1))+'억 년</b>'+(lf<10?' <span style="color:#dc2626">(생명체 진화엔 너무 짧아요!)</span>':'')+'</div>';
    document.querySelectorAll('#d105_hz [data-s]').forEach(b=>{const s=b.dataset.s.split(',');b.classList.toggle('on',Math.abs(+s[0]-L)<1e-6&&+s[1]===a);});
    document.querySelectorAll('#d105_hz [data-a]').forEach(b=>{const s=b.dataset.a.split(',');b.classList.toggle('on',+s[0]===Al&&+s[1]===GH);});}
  const on=(id,f)=>document.getElementById(id).oninput=ev=>{f(+ev.target.value);out();};
  on('rD1',v=>L=Math.pow(10,v));on('rD2',v=>a=v);on('rD5',v=>e=v);on('rD3',v=>Al=v);on('rD4',v=>GH=v);
  document.querySelectorAll('#d105_hz [data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s.split(',');L=+s[0];a=+s[1];out();});
  document.querySelectorAll('#d105_hz [data-a]').forEach(b=>b.onclick=()=>{const s=b.dataset.a.split(',');Al=+s[0];GH=+s[1];out();});out();

  SIM.loop('d105_hz',(t,dt)=>{
    Mn=(Mn+dt*TAU/7)%TAU; // 한 바퀴 약 7초 (실제 시간과는 다름)

    g.strokeStyle='rgba(134,239,172,.6)';g.lineWidth=1.5;g.setLineDash([6,6]);[i,o].forEach(r=>{if(isFinite(r)){g.beginPath();g.arc(OX,OY,r*S,0,TAU);g.stroke();}});g.setLineDash([]);
    // 궤도 (별은 초점)
    g.strokeStyle='rgba(226,232,240,.75)';g.lineWidth=2;g.beginPath();g.ellipse(OX-a*e*S,OY,a*S,a*Math.sqrt(1-e*e)*S,0,0,TAU);g.stroke();
    const rgb=SIM.bbRGB(Teff()),R=12+Math.min(26,Math.pow(L,0.2)*10),sg=g.createRadialGradient(OX,OY,1,OX,OY,R*2.2);sg.addColorStop(0,'#fff');sg.addColorStop(.35,'rgba('+rgb.join(',')+',1)');sg.addColorStop(1,'rgba('+rgb.join(',')+',0)');g.fillStyle=sg;g.beginPath();g.arc(OX,OY,R*2.2,0,TAU);g.fill();
    const px=OX+P.x*S,py=OY-P.y*S,inZ=Tnow>=0&&Tnow<=100;
    g.strokeStyle='rgba(253,224,71,.35)';g.setLineDash([4,6]);g.lineWidth=1.5;g.beginPath();g.moveTo(OX,OY);g.lineTo(px,py);g.stroke();g.setLineDash([]);
    if(GH>0){g.fillStyle='rgba(251,191,36,'+Math.min(0.5,GH/300)+')';g.beginPath();g.arc(px,py,12+GH/14,0,TAU);g.fill();}
    const pc=inZ?[34,197,94]:(Tnow>100?[180,83,9]:[186,230,253]),mix=v=>Math.round(v+(255-v)*Al*0.7);
    g.fillStyle='rgb('+pc.map(mix).join(',')+')';g.beginPath();g.arc(px,py,12,0,TAU);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    g.font=SIM.font(20);g.textAlign='center';g.lineWidth=5;g.strokeStyle='rgba(2,6,23,.85)';const lb='행성 '+Tnow+' ℃',lx=Math.max(80,Math.min(570,px)),ly=py<70?py+38:py-22;g.strokeText(lb,lx,ly);g.fillStyle='#fff';g.fillText(lb,lx,ly);
    if(e>0.02){g.fillStyle='#cbd5e1';g.font=SIM.font(17);const qx=OX+a*(1-e)*S,ax=OX-a*(1+e)*S;g.fillText('근일점',qx,OY+30);g.fillText('원일점',ax,OY+30);}
    g.restore();
    g.strokeStyle='#334155';g.lineWidth=2;g.strokeRect(10,10,630,640);
    // 범례·축척
    g.textAlign='left';g.font=SIM.font(19);
    [['rgba(239,68,68,.6)','너무 뜨거움'],['rgba(34,197,94,.75)','생명 가능 지대'],['rgba(59,130,246,.6)','너무 추움']].forEach((q,k)=>{g.fillStyle=q[0];g.fillRect(26+k*200,618,18,18);g.fillStyle='#e2e8f0';g.fillText(q[1],50+k*200,634);});
    const sb=[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10].filter(v=>v<=Rm*0.45).pop()||0.01;const sbp=sb*S;g.strokeStyle='#e2e8f0';g.lineWidth=2;g.beginPath();g.moveTo(620-sbp,32);g.lineTo(620,32);g.stroke();g.fillStyle='#e2e8f0';g.textAlign='right';g.font=SIM.font(17,false);g.fillText(sb+' AU',620,56);
    g.textAlign='left';g.fillStyle='#94a3b8';g.font=SIM.font(19);g.fillText('위에서 내려다본 모습',26,36);
    // ② 공전하는 동안의 표면 온도 (오른쪽)
    const gx=730,gy=60,gw=400,gh=520,tmn=Math.min(-60,ST.mn-20),tmx=Math.max(160,ST.mx+20),GY=v=>gy+gh-(v-tmn)/(tmx-tmn)*gh,GX=m=>gx+m/TAU*gw;
    g.fillStyle='#0b1222';g.fillRect(gx,gy,gw,gh);g.fillStyle='rgba(56,189,248,.16)';g.fillRect(gx,GY(100),gw,GY(0)-GY(100));
    g.strokeStyle='#475569';g.lineWidth=2;g.strokeRect(gx,gy,gw,gh);
    g.font=SIM.font(16,false);g.fillStyle='#94a3b8';g.textAlign='right';const tst=(tmx-tmn)>400?100:50;for(let v=Math.ceil(tmn/tst)*tst;v<=tmx;v+=tst){g.fillText(v+' ℃',gx-8,GY(v)+5);}
    g.fillStyle='#7dd3fc';g.font=SIM.font(16);g.textAlign='left';g.fillText('액체 물 (0~100 ℃)',gx+8,GY(100)+20);
    g.strokeStyle='#f87171';g.lineWidth=3;g.beginPath();ST.arr.forEach((T,k)=>{const x=GX(k/ST.arr.length*TAU),y=GY(T);k?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(GX(Mn),GY(Tnow),7,0,TAU);g.fill();
    g.fillStyle='#94a3b8';g.font=SIM.font(16,false);g.textAlign='center';g.fillText('근일점',GX(0)+22,gy+gh+22);g.fillText('원일점',GX(Math.PI),gy+gh+22);g.fillText('근일점',GX(TAU)-22,gy+gh+22);
    g.fillStyle='#fde68a';g.font=SIM.font(22);g.textAlign='left';g.fillText('공전하는 동안 표면 온도',gx-60,gy-20);
    g.fillStyle='#94a3b8';g.font=SIM.font(16,false);g.textAlign='right';g.fillText('한 바퀴 (시간) →',gx+gw,gy+gh+46);
    // ③ 지금 위치의 온도 구성 (아래): 별빛만 → 반사율 → 온실 효과
    const bx0=380,bx1=1120,TL=-200,TH=300,BX=tc=>bx0+(Math.max(TL,Math.min(TH,tc))-TL)/(TH-TL)*(bx1-bx0),y0=700,RH=56;
    g.fillStyle='#e2e8f0';g.font=SIM.font(22);g.textAlign='left';g.fillText('지금 위치('+P.r.toFixed(2)+' AU)의 표면 온도는 어떻게 정해질까?',26,y0-14);
    g.fillStyle='rgba(56,189,248,.18)';g.fillRect(BX(0),y0,BX(100)-BX(0),3*RH);

    rows.forEach((q,k)=>{const y=y0+k*RH;g.textAlign='left';g.fillStyle='#e2e8f0';g.font=SIM.font(20);g.fillText(q[0],26,y+26);g.fillStyle='#94a3b8';g.font=SIM.font(15,false);g.fillText(q[1],26,y+46);
      const bw=BX(q[2])-bx0;g.fillStyle=q[3];g.globalAlpha=0.85;g.fillRect(bx0,y+10,Math.max(2,bw),34);g.globalAlpha=1;
      g.fillStyle='#fff';g.font=SIM.font(20);const lx=bx0+bw+10,rt=lx>bx1-80;g.textAlign=rt?'right':'left';g.fillText(q[2]+' ℃',rt?bx0+bw-10:lx,y+34);});
  });
})();

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
