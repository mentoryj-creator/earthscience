<style>
        * { box-sizing: border-box; }

        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }

        /* 표지 (03~05단원과 동일) */

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px; line-height: 1.25; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }

        .gnum.s { width: auto; height: auto; background: none; color: #ea580c; font-size: 34px; }

        .or { color: #ea580c; font-weight: bold; }

        .look { display: inline-block; background: #3b82f6; color: #fff; border-radius: 10px; padding: 2px 14px; font-size: 25px; font-weight: bold; margin-right: 10px; vertical-align: 3px; }
        .look.o { background: #ea580c; }
        .cap { font-size: 23px; color: #64748b; margin-top: 8px; }

        figure img { display: block; width: 100%; border-radius: 16px; border: 2px solid #e2e8f0; }
        .chip { display: inline-block; border: 2px solid #cbd5e1; border-radius: 999px; padding: 2px 18px; font-size: 27px; font-weight: bold; margin: 4px 8px 4px 0; background: #fff; color: #334155; }
        .chip.b { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }
        .chip.o { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
        .big { font-size: 64px; font-weight: 800; color: #ea580c; line-height: 1.1; }
        .note { font-size: 24px; color: #64748b; line-height: 1.45; }
        .gcard { flex: 1; border: 2px solid #cbd5e1; background: #f8fafc; border-radius: 20px; padding: 22px 28px; display: flex; flex-direction: column; gap: 8px; font-size: 28px; line-height: 1.5; word-break: keep-all; }

        .blank { display: inline-block; min-width: 200px; border-bottom: 4px dashed #ea580c; text-align: center; color: transparent; cursor: pointer; font-weight: bold; transition: color .4s; user-select: none; }
        .blank.on { color: #ea580c; border-bottom-style: solid; }
        .barrow { display: flex; align-items: center; gap: 20px; height: 84px; }
        .barrow .bl { width: 340px; }
        .barrow .bt { position: relative; flex: 1; height: 44px; background: #e2e8f0; border-radius: 10px; }
        .barrow .rb { position: absolute; top: 0; height: 100%; border-radius: 10px; transition: width .9s; }
        .barrow .bv { width: 200px; font-size: 34px; font-weight: 800; }
        .qrow { display: flex; align-items: center; gap: 16px; }
        .q { font-size: 32px; padding: 18px 28px; }

        .q .res { width: 160px; font-size: 32px; font-weight: 800; }
        .q .why { margin-top: 6px; font-size: 26px; }
        .sim-btn.tool.on { background: var(--c); border-color: var(--c); color: #fff; }
        .sim-btn.tool { border-color: var(--c); color: var(--c); }
        .sim-row span { font-size: 26px; }
        .pulse { animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

        /* 단계별로 나타나기 (다음 ▶ 버튼으로 하나씩 보여 줌) */
        [data-step] { opacity: 0; transform: translateY(14px); transition: opacity .55s, transform .55s; pointer-events: none; }
        [data-step].on { opacity: 1; transform: none; pointer-events: auto; }
        svg [data-step] { transform: none !important; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .slide.active .ppt-title { animation: rise .6s both; }
        .slide.active .ppt-subtitle { animation: rise .6s .1s both; }
        .slide.active .main { animation: rise .6s .2s both; }

        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */
        .sim-slide .ppt-title { margin-bottom: 20px; padding-bottom: 14px; }
        .sim-slide .ppt-subtitle { font-size: 34px; padding: 10px 30px; margin-bottom: 22px; }
        .sim-tag { display: inline-block; background: #0f172a; color: #facc15; font-size: 28px; padding: 6px 18px; border-radius: 12px; margin-right: 18px; vertical-align: 8px; letter-spacing: 0; }
        .sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
        .sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: none; }
        .sim-stage.light { background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .sim-stage canvas { display: block; }
        .sim-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .sim-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px 26px; font-size: 28px; color: #1e293b; line-height: 1.5; word-break: keep-all; }
        .sim-box.key { background: #fff7ed; border-color: #fdba74; }
        .sim-box.blue { background: #eff6ff; border-color: #bfdbfe; }
        .sim-box h4 { font-size: 30px; font-weight: 800; color: #1d4ed8; margin: 0 0 8px 0; }
        .sim-slide, .sim-slide button, .sim-slide table { font-family: 'Gowun Dodum', sans-serif; }
        .sim-box p, .sim-box div { margin: 0; }
        .sim-box.key h4 { color: #c2410c; }
        .sim-row { display: flex; align-items: center; gap: 14px; font-size: 27px; margin: 6px 0; }
        .sim-row > .lbl { flex: none; width: 190px; font-weight: bold; color: #334155; }
        input[type=range].sim-range { flex: 1; accent-color: #3b82f6; height: 36px; cursor: pointer; min-width: 0; }
        .sim-val { flex: none; min-width: 150px; text-align: right; font-weight: bold; color: #ea580c; font-size: 29px; }
        .sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }

        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }

        .sim-btn.orange.on { background: #ea580c; border-color: #ea580c; color: #fff; }
        .sim-table { width: 100%; border-collapse: collapse; font-size: 26px; }
        .sim-table th { background: #3b82f6; color: #fff; padding: 8px 10px; font-weight: bold; }
        .sim-table td { padding: 6px 10px; border-bottom: 2px solid #e2e8f0; text-align: center; background: #fff; }
        .sim-big { font-size: 40px; font-weight: 800; color: #ea580c; }
        .sim-note { font-size: 22px; color: #64748b; line-height: 1.45; }
        .sim-ok { color: #16a34a; font-weight: bold; }
        .sim-hint { position: absolute; left: 20px; top: 16px; font-size: 22px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 6px 14px; border-radius: 10px; pointer-events: none; }
        .sim-stage.light .sim-hint { color: #475569; background: rgba(255,255,255,0.9); }

        /* ===== 3.01 / 3.02 추가 요소 ===== */
        .ppt-table { width: 100%; border-collapse: collapse; font-size: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-radius: 15px; overflow: hidden; }
        .ppt-table th { background-color: #2563eb; color: white; padding: 18px; border: 2px solid #93c5fd; font-weight: bold; }
        .ppt-table td { padding: 16px 18px; border: 2px solid #cbd5e1; background-color: white; text-align: center; }
        .ppt-table tr:nth-child(even) td { background-color: #f8fafc; }
        .ppt-table td.rowh { background: #eff6ff; font-weight: bold; color: #1e3a8a; }
        .video-frame { background: #000; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; }
        .video-frame video { display: block; max-width: 100%; max-height: 100%; }
        .imgbox { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 12px; display: flex; align-items: center; justify-content: center; }
        .imgbox img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
        .formula { font-size: 44px; font-weight: 800; background: #eff6ff; border-left: 8px solid #3b82f6; padding: 18px 30px; border-radius: 0 20px 20px 0; color: #1e293b; text-align: center; }
        .flow { display: flex; flex-direction: column; gap: 14px; }
        .flow .card { display: flex; align-items: center; gap: 20px; }
        .arrow-down { text-align: center; color: #94a3b8; font-size: 30px; line-height: 1; margin: -6px 0; }
        .ans { color: #dc2626; font-weight: 800; }
        .filter-chip { display: flex; align-items: center; gap: 16px; border-radius: 14px; padding: 12px 20px; font-size: 30px; font-weight: bold; }
        .filter-chip .dot { width: 46px; height: 46px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }

        .two { display:flex; gap:40px; flex:1; min-height:0; }
        .stack { display:flex; flex-direction:column; gap:18px; justify-content:center; flex:1; min-width:0; }
        .imgbox video { max-width:100%; max-height:100%; }
        .sim-stage canvas { touch-action:none; }

        .fs-btn { position: absolute; top: 34px; right: 60px; z-index: 60; font-family: 'Gowun Dodum', sans-serif; font-size: 32px; font-weight: bold; padding: 8px 26px; border-radius: 999px; border: 3px solid #cbd5e1; background: #fff; color: #1e293b; cursor: pointer; transition: all .2s; }
        .fs-btn:hover { border-color: #3b82f6; color: #1d4ed8; }

    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {

            return [c(r), c(g), c(b)];

            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };

/* ===== 시선 속도 ===== */
(function(){
  const c=document.getElementById('cA'),g=c.getContext('2d'),W=1160,H=900;
  let m=1,inc=90,ph=0,hist=[];
  const K=()=>m*Math.sin(inc*Math.PI/180);
  function out(){document.getElementById('vA1').textContent='목성의 '+m.toFixed(1)+'배';document.getElementById('vA2').textContent=inc+'°';document.getElementById('rA1').value=m;document.getElementById('rA2').value=inc;
    const k=12.5*K();document.getElementById('oA').innerHTML='<h4>관측 결과</h4><div>별의 최대 시선 속도: <span class="sim-big" style="font-size:36px">'+k.toFixed(1)+' m/s</span></div><div class="sim-note">'+(inc<5?'궤도면이 시선 방향에 수직이라 <b>시선 속도 변화가 없어요</b> → 도플러 효과로 찾을 수 없어요!':(k>20?'변화가 커서 행성을 찾기 <b>쉬워요.</b>':'변화가 작아 찾기 <b>어려워요.</b>'))+'</div>';
    document.querySelectorAll('#d105_rv [data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===inc));}
  document.getElementById('rA1').oninput=e=>{m=+e.target.value;out();};document.getElementById('rA2').oninput=e=>{inc=+e.target.value;out();};
  document.querySelectorAll('#d105_rv [data-i]').forEach(b=>b.onclick=()=>{inc=+b.dataset.i;out();});out();
  const LINES=[430,486,527,589,656];
  SIM.loop('d105_rv',(t,dt)=>{
    ph+=dt*0.9;const vr=-Math.sin(ph)*K();hist.push([ph,vr]);const SPAN=3.4*2*Math.PI;while(hist.length&&hist[0][0]<ph-SPAN)hist.shift();
    g.fillStyle='#0f172a';g.fillRect(0,0,W,H);
    // 궤도 (왼쪽 위, 시선은 아래쪽 지구에서 위로)
    const cx=290,cy=205,R=230,ci=Math.cos(inc*Math.PI/180),ry=R*ci*0.75;
    const px=Math.cos(ph)*R,py=Math.sin(ph)*ry;
    g.strokeStyle='rgba(148,163,184,.4)';g.lineWidth=2;g.beginPath();g.ellipse(cx,cy,R,Math.max(2,ry),0,0,7);g.stroke();
    const sx=cx-px*0.06*m,sy=cy-py*0.06*m;const sg=g.createRadialGradient(sx,sy,3,sx,sy,50);sg.addColorStop(0,'#fff');sg.addColorStop(.4,'#fde68a');sg.addColorStop(1,'rgba(253,224,71,0)');g.fillStyle=sg;g.beginPath();g.arc(sx,sy,50,0,7);g.fill();
    g.fillStyle='#fb923c';g.beginPath();g.arc(cx+px,cy+py,9+m*3,0,7);g.fill();
    g.fillStyle='#e2e8f0';g.font=SIM.font(22);g.textAlign='center';g.fillText('+ 공통 질량 중심',cx,Math.min(cy+Math.max(ry,20)+36,412));
    g.fillStyle='#93c5fd';g.fillText('↓ 지구 방향 (시선)',cx,450);
    // 스펙트럼 (오른쪽 위) — 흡수선 이동은 눈에 잘 띄도록 크게 과장 (실제는 매우 작음)
    const x0=600,x1=1130,y0=70,h=170,L0=400,L1=700,X=l=>x0+(l-L0)/(L1-L0)*(x1-x0),DX=l=>vr*30*(l/550);
    for(let x=x0;x<x1;x++){const l=L0+(x-x0)/(x1-x0)*(L1-L0);g.fillStyle='rgb('+SIM.wl2rgb(l).join(',')+')';g.fillRect(x,y0,1.5,h);}
    const shc=vr>0?'#f87171':'#60a5fa',big=Math.abs(vr)*30>4;
    LINES.forEach(l=>{const xr=X(l),xs=xr+DX(l);
      g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.moveTo(xr,y0-12);g.lineTo(xr,y0);g.moveTo(xr,y0+h);g.lineTo(xr,y0+h+12);g.stroke();g.setLineDash([]);
      g.fillStyle='#000';g.fillRect(xs-3,y0,6,h);
      if(big){g.strokeStyle=shc;g.fillStyle=shc;g.lineWidth=3;const ya=y0+h+24,d=Math.sign(xs-xr);g.beginPath();g.moveTo(xr,ya);g.lineTo(xs,ya);g.stroke();g.beginPath();g.moveTo(xs,ya);g.lineTo(xs-d*10,ya-7);g.lineTo(xs-d*10,ya+7);g.fill();}});
    const still=Math.abs(vr)<0.05*Math.max(K(),0.01)||K()<0.01;
    g.font=SIM.font(30);g.textAlign='left';g.fillStyle=still?'#e2e8f0':shc;g.fillText('별의 스펙트럼 '+(still?'— 이동 없음':(vr>0?'→ 적색 편이':'← 청색 편이')),x0,y0+h+72);
    g.font=SIM.font(24);g.fillText(still?'별이 시선 방향으로 움직이지 않아요':(vr>0?'별이 지구에서 멀어지는 중':'별이 지구로 다가오는 중'),x0,y0+h+112);
    g.fillStyle='#94a3b8';g.font=SIM.font(17,false);g.textAlign='right';g.fillText('점선: 원래 위치 · 이동량은 과장',x1,y0-18);

    const gx=110,gy=495,gw=1020,gh=320;g.strokeStyle='#475569';g.lineWidth=2;g.strokeRect(gx,gy,gw,gh);g.strokeStyle='rgba(148,163,184,.4)';g.beginPath();g.moveTo(gx,gy+gh/2);g.lineTo(gx+gw,gy+gh/2);g.stroke();

    const p0=Math.max(0,ph-SPAN),PX=q=>gx+(q-p0)/SPAN*gw;
    g.setLineDash([5,5]);g.strokeStyle='rgba(148,163,184,.35)';g.lineWidth=1;g.font=SIM.font(18,false);g.fillStyle='#94a3b8';g.textAlign='center';
    for(let n=Math.ceil(p0/(2*Math.PI));n*2*Math.PI<=ph;n++){const x=PX(n*2*Math.PI);if(n>0){g.beginPath();g.moveTo(x,gy);g.lineTo(x,gy+gh);g.stroke();g.fillText(n+'주기',x,gy+gh+24);}}g.setLineDash([]);
    g.strokeStyle='#4ade80';g.lineWidth=3.5;g.beginPath();hist.forEach((h,i)=>{const x=PX(h[0]),y=gy+gh/2-h[1]/3*gh/2*0.95;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
    g.fillStyle='#86efac';g.font=SIM.font(24);g.textAlign='left';g.fillText('별의 시선 속도 (최근 약 3주기)',gx,gy+gh+62);
    // 오른쪽 패널의 시선 속도 막대
    const bw=Math.min(50,Math.abs(vr)/3*50),vb=document.getElementById('vBar');vb.style.left=(vr<0?50-bw:50)+'%';vb.style.width=bw+'%';vb.style.background=vr>0?'#f87171':'#60a5fa';
    const v=vr*12.5;document.getElementById('vNow').innerHTML='<span style="color:'+(still?'#334155':(vr>0?'#dc2626':'#2563eb'))+'">'+(v>0?'+':'')+v.toFixed(1)+' m/s</span> '+(still?'':(vr>0?'(멀어지는 중)':'(다가오는 중)'));  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  /* 휴대폰·태블릿: 전체화면이 되면 가로 화면으로 고정 (지원하는 기기만) */
  function land(){ try { var o = screen.orientation; if (!o) return; if (document.fullscreenElement || document.webkitFullscreenElement) { if (o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function(){}); } } else if (o.unlock) o.unlock(); } catch(e){} }
  function sync(){ land(); btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');

      b.style.left = '50%'; b.style.top = '60px'; b.style.background = cols[i % cols.length];
      const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      b.style.setProperty('--dx', Math.cos(a) * r + 'px'); b.style.setProperty('--dy', Math.sin(a) * r * 0.7 + 120 + 'px');
      stage.appendChild(b); setTimeout(() => b.remove(), 1200);
    }
  },
  tabs(root) {
    root = root || document;
    const tabs = [...root.querySelectorAll('.sim-tab')], pages = [...root.querySelectorAll('.sim-tabpage')];
    const show = name => {
      tabs.forEach(t => { t.classList.toggle('on', t.dataset.tab === name); t.setAttribute('aria-selected', t.dataset.tab === name); });
      pages.forEach(p => p.classList.toggle('on', p.dataset.page === name));
    };
    tabs.forEach(t => { t.setAttribute('role', 'tab'); t.onclick = () => { t.classList.remove('nudge'); show(t.dataset.tab); }; });
    const first = tabs.find(t => t.classList.contains('on')) || tabs[0];
    if (first) show(first.dataset.tab);
    SIM.showTab = show; return show;
  },
  predict(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    let picked = -1, revealed = false;
    el.innerHTML = `<div class="predict-q"><span class="tag">예측</span>${o.q}</div>
      <div class="predict-opts">${o.options.map((t, i) => `<button type="button" class="predict-opt" data-i="${i}"><span class="n">${'ABCDEF'[i]}</span><span>${t}</span></button>`).join('')}</div>
      <div class="predict-go" hidden><div class="sim-note" style="margin-bottom:8px">좋아요! 이제 실험해서 확인해 봐요.</div>
        <div class="sim-btns"><button type="button" class="sim-btn on" data-act="go">② 실험하러 가기 →</button><button type="button" class="sim-btn orange" data-act="show">✔ 정답 확인</button></div></div>
      <div class="predict-result" hidden></div>`;
    const opts = [...el.querySelectorAll('.predict-opt')];
    const reveal = () => {
      if (revealed || picked < 0) return; revealed = true;
      opts.forEach((b, i) => { b.disabled = true; b.classList.toggle('right', i === o.answer); b.classList.toggle('wrong', i === picked && i !== o.answer); });
      const ok = picked === o.answer, r = el.querySelector('.predict-result');
      r.hidden = false; r.classList.toggle('miss', !ok);
      r.innerHTML = (ok ? '<b>예측 성공!</b> ' : `<b>정답은 ${'ABCDEF'[o.answer]}</b> — `) + (o.why || '');
      el.querySelector('.predict-go').hidden = true;
      SIM.toast(ok ? '예측 성공!' : '예측과 결과가 달라요. 까닭을 확인해 봐요', ok ? '' : 'warn');
      if (ok) SIM.burst();
      const tab = document.querySelector('.sim-tab[data-tab="predict"]');
      if (tab) { tab.classList.add('nudge'); const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge ' + (ok ? 'done' : ''); b.textContent = ok ? '✓' : '!'; }
    };
    opts.forEach((b, i) => b.onclick = () => {
      if (revealed) return;
      picked = i; opts.forEach(x => x.classList.toggle('picked', x === b));
      el.querySelector('.predict-go').hidden = false;
    });
    el.querySelector('[data-act="go"]').onclick = () => { o.setup && o.setup(); SIM.showTab && SIM.showTab('lab'); };
    el.querySelector('[data-act="show"]').onclick = reveal;
    let armed = false;
    if (o.reached) SIM._checks.push(() => {
      if (picked < 0 || revealed) return;
      let r = false; try { r = o.reached(); } catch (e) {}
      if (!r) armed = true; else if (armed) reveal();
    });
    return { reveal };
  },
  missions(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    const done = o.items.map(() => false);
    el.innerHTML = `<div class="mission-bar"><i></i></div>
      <ul class="mission-list">${o.items.map(m => `<li><span class="ck">✓</span><span>${m.t}${m.hint ? `<span class="hint">${m.hint}</span>` : ''}</span></li>`).join('')}</ul>
      <div class="mission-all" hidden>모든 미션 달성!</div>`;
    const lis = [...el.querySelectorAll('li')], tab = document.querySelector('.sim-tab[data-tab="mission"]');
    const badge = () => {
      const n = done.filter(Boolean).length;
      el.querySelector('.mission-bar i').style.width = (n / done.length * 100) + '%';
      el.querySelector('.mission-all').hidden = n < done.length;
      if (tab) { const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge' + (n === done.length ? ' done' : ''); b.textContent = n + '/' + done.length; }
    };
    const mark = i => {
      if (done[i]) return; done[i] = true; lis[i].classList.add('done');
      badge(); SIM.burst();
      const txt = lis[i].querySelector('span:not(.ck)').cloneNode(true); txt.querySelectorAll('.hint').forEach(h => h.remove());
      const t = txt.textContent.trim();
      SIM.toast(done.every(Boolean) ? '모든 미션 달성!' : '미션 달성! ' + (t.length > 24 ? t.slice(0, 23) + '…' : t));
      if (tab) tab.classList.add('nudge');
    };
    // 처음부터 맞아 있던 조건은 세지 않음 (한 번 벗어났다가 다시 맞춰야 달성)
    const armed = o.items.map(() => false);
    SIM._checks.push(() => o.items.forEach((m, i) => {
      if (done[i]) return;
      let ok = false; try { ok = !!m.test(); } catch (e) {}
      if (!ok) armed[i] = true; else if (armed[i]) mark(i);
    }));
    badge();
    return { mark, done };
  },
  _checks: [],
});
setInterval(() => SIM._checks.forEach(f => f()), 250);
</script>
<script id="pem-cfg">
(function(){
// 1.05 시선 속도법 — 상태: rA1 행성 질량, rA2 궤도면 기울기(°), #oA .sim-big 최대 시선 속도(m/s)
const k = () => SIM.num('#oA .sim-big'), inc = () => SIM.val('rA2');
SIM.predict({ el: '#predictBox',
  q: '행성의 궤도면을 <b>정면(시선에 수직)</b>에서 보면 별의 시선 속도 변화는 어떻게 될까요?',
  options: ['가장 크게 나타난다', '나타나지 않는다', '옆에서 볼 때의 절반쯤이다'],
  answer: 1,
  why: '정면에서 보면 별이 우리 쪽으로 다가오거나 멀어지지 않고 <b>옆으로만</b> 움직여요. 그래서 도플러 효과가 없어 이 방법으로는 찾을 수 없어요.',
  setup: () => SIM.click('[data-i="90"]'),
  reached: () => inc() <= 2 });
SIM.missions({ el: '#missionBox', items: [
  { t: '별의 최대 시선 속도를 <b>30 m/s 이상</b>으로 만들어 보세요.', test: () => k() >= 30 },
  { t: '궤도면이 옆에 가까운데도(<b>60° 이상</b>) 시선 속도가 <b>5 m/s 이하</b>인, 찾기 어려운 행성을 만들어 보세요.', hint: '행성의 질량은?', test: () => inc() >= 60 && k() <= 5 },
  { t: '행성이 있어도 시선 속도 변화가 <b>전혀 없는</b> 경우를 만들어 보세요.', test: () => k() === 0 },
] });

SIM.tabs();
})();
</script>
<script id="pem-pop">
/* 미션: 버튼 → 팝업 · 모두 달성하면 폭죽 */
(function(){
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script><!--pem:end-->
