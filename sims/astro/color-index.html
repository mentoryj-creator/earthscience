<style id="standalone">

            <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>별의 온도에 따라 색지수는 어떻게 변할까?</div>
            <div class="ppt-subtitle">온도를 바꾸며 B 필터와 V 필터에 들어오는 빛의 양을 비교해 봅시다.</div>
            <div class="sim-wrap">
                <div class="sim-stage"><canvas id="cQ" width="1060" height="610"></canvas></div>
                <div class="sim-panel">
                    <div class="sim-box blue">
                        <h4>별의 표면 온도</h4>
                        <div class="sim-row"><span class="lbl" style="width:120px">온도</span><input type="range" class="sim-range" id="rQ" min="3000" max="30000" step="100" value="15000"><span class="sim-val" id="vQ"></span></div>
                        <div class="sim-btns"><button class="sim-btn" data-t="20000">고온의 A별</button><button class="sim-btn" data-t="9600">B−V = 0인 별</button><button class="sim-btn" data-t="4000">저온의 B별</button></div>
                    </div>
                    <div class="sim-box" id="oQ" style="font-size:27px"></div>
                    <div class="sim-box key" style="font-size:25px">온도가 높을수록 <b>색지수(B−V)가 작아져요</b> (음수까지). → 색지수로 별의 <b>표면 온도</b>를 알 수 있어요!</div>
                </div>

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>


/* ===================== 시뮬레이션 Q: 별의 온도와 색지수 ===================== */
(function(){
  const c=document.getElementById('cQ'),g=c.getContext('2d'),W=1060,H=610;
  const L=90,R=1030,T=40,B=380,L0=250,L1=900;let Ts=15000;
  const planck=(l,T)=>Math.pow(l,-5)/(Math.exp(1.4388e7/(l*T))-1);
  const X=l=>L+(l-L0)/(L1-L0)*(R-L);
  const filt=(l,c,w)=>Math.exp(-Math.pow((l-c)/w,2));
  const FL={U:[365,30,'#7c3aed'],B:[440,40,'#2563eb'],V:[550,42,'#16a34a']};
  function flux(T,f){let s=0;for(let l=300;l<700;l+=2)s+=planck(l,T)*filt(l,FL[f][0],FL[f][1]);return s;}
  const C0=2.5*Math.log10(flux(9600,'B')/flux(9600,'V'));
  const bv=T=>-2.5*Math.log10(flux(T,'B')/flux(T,'V'))+C0;
  function out(){
    document.getElementById('vQ').textContent=Ts+' K';document.getElementById('rQ').value=Ts;
    const fb=flux(Ts,'B'),fv=flux(Ts,'V'),b=bv(Ts),k=fv/fb;
    const cmp=Math.abs(b)<0.02?'=':(b<0?'&gt;':'&lt;'),cmp2=Math.abs(b)<0.02?'=':(b<0?'&lt;':'&gt;');
    document.getElementById('oQ').innerHTML='<h4>측정 결과</h4>'+
      '<div>빛의 세기: B 필터 <b>'+cmp+'</b> V 필터</div><div>등급: B 등급 <b>'+cmp2+'</b> V 등급</div>'+
      '<div style="margin-top:6px">색지수 B − V = <span class="sim-big">'+(b>=0?'+':'')+b.toFixed(2)+'</span></div>';
    document.querySelectorAll('#t12 [data-t]').forEach(x=>x.classList.toggle('on',+x.dataset.t===Ts));
  }
  document.getElementById('rQ').oninput=e=>{Ts=+e.target.value;out();};
  document.querySelectorAll('#t12 [data-t]').forEach(b=>b.onclick=()=>{Ts=+b.dataset.t;out();});
  out();
  SIM.loop('t12',()=>{
    g.fillStyle='#0f172a';g.fillRect(0,0,W,H);
    let mx=0;for(let l=L0;l<=L1;l+=5)mx=Math.max(mx,planck(l,Ts));const Y=v=>B-v/mx*(B-T-30);
    // 필터 곡선
    Object.entries(FL).forEach(([n,f])=>{g.fillStyle=f[2]+'33';g.strokeStyle=f[2];g.lineWidth=3;g.beginPath();g.moveTo(X(f[0]-110),B);for(let l=f[0]-110;l<=f[0]+110;l+=3)g.lineTo(X(l),B-filt(l,f[0],f[1])*(B-T-20));g.lineTo(X(f[0]+110),B);g.fill();g.stroke();g.fillStyle='#fff';g.font=SIM.font(26);g.textAlign='center';g.fillText(n,X(f[0]),T+14);});
    // 별빛 스펙트럼
    for(let l=L0;l<L1;l+=2){const v=planck(l,Ts),rgb=SIM.wl2rgb(l),vis=l>=380&&l<=780;g.fillStyle=vis?'rgba('+rgb.join(',')+',.55)':'rgba(148,163,184,.25)';g.fillRect(X(l),Y(v),X(l+2)-X(l)+.5,B-Y(v));}
    g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();for(let l=L0;l<=L1;l+=3){const y=Y(planck(l,Ts));l===L0?g.moveTo(X(l),y):g.lineTo(X(l),y);}g.stroke();
    // B,V 막대 표시
    ['B','V'].forEach(n=>{const f=FL[n],y=Y(planck(f[0],Ts));g.fillStyle=f[2];g.beginPath();g.arc(X(f[0]),y,10,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();});
    g.strokeStyle='#94a3b8';g.lineWidth=2;g.beginPath();g.moveTo(L,T);g.lineTo(L,B);g.lineTo(R,B);g.stroke();
    g.fillStyle='#cbd5e1';g.font=SIM.font(19,false);g.textAlign='center';for(let l=300;l<=900;l+=100)g.fillText(l,X(l),B+26);
    g.font=SIM.font(21);g.fillText('파장 (nm)',(L+R)/2,B+56);g.save();g.translate(40,(T+B)/2);g.rotate(-Math.PI/2);g.fillText('빛의 세기',0,0);g.restore();
    // 별 색 & 막대 비교
    const rgb=SIM.bbRGB(Ts),cx=170,cy=520,gr=g.createRadialGradient(cx,cy,3,cx,cy,70);gr.addColorStop(0,'#fff');gr.addColorStop(.35,'rgba('+rgb.join(',')+',.95)');gr.addColorStop(1,'rgba('+rgb.join(',')+',0)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,70,0,7);g.fill();
    g.fillStyle='#fff';g.font=SIM.font(22);g.fillText(Ts+' K 별',cx,cy+86);
    const fb=flux(Ts,'B'),fv=flux(Ts,'V'),m=Math.max(fb,fv);
    g.textAlign='left';g.font=SIM.font(22);
    [['B 필터',fb,FL.B[2],470],['V 필터',fv,FL.V[2],530]].forEach(([n,v,col,y])=>{g.fillStyle='#e2e8f0';g.fillText(n+'로 들어온 빛',330,y+8);g.fillStyle='#334155';g.fillRect(560,y-14,440,30);g.fillStyle=col;g.fillRect(560,y-14,440*v/m,30);});
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
