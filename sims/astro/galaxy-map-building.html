<script>
(function(){
'use strict';
'use strict';
/* ---------- utils ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const $=(s,p)=> (p||document).querySelector(s);
const $$=(s,p)=> Array.from((p||document).querySelectorAll(s));
const FONT="'Gowun Dodum', sans-serif"; const F=(px)=>'bold '+px+'px '+FONT;
// 캔버스: 원래 좌표(w×h)는 그대로 쓰고, 화면에는 s배 크게 선명하게 그림
function hd(c,w,h,s){c.width=Math.round(w*s);c.height=Math.round(h*s);c.style.width=c.width+'px';c.style.height=c.height+'px';c._lw=w;c._lh=h;const g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);return g;}
function pos(ev,el){const r=el.getBoundingClientRect();return{x:(ev.clientX-r.left)*(el._lw||el.width)/r.width,y:(ev.clientY-r.top)*(el._lh||el.height)/r.height};}
const DARK='#0f172a', LIGHT='rgba(226,232,240,.85)', GRID='rgba(148,163,184,.45)', TXT='#94a3b8', BLUE='#60a5fa', ORANGE='#fb923c';

/* ---------- sim registry ---------- */
const SIM={}; const STEP={};
function loop(id,fn){let raf=0,run=false,last=0;
  function f(t){ if(!run)return; fn(t,(t-last)/1000||0.016); last=t; raf=requestAnimationFrame(f);}
  return {start(){ if(run)return; run=true; last=performance.now(); raf=requestAnimationFrame(f);}, stop(){run=false;cancelAnimationFrame(raf);}};}

const slides=[$('#s4')];let cur=0;function upd(){}
function setShown(el,n,fire){el._shown=n;$$('[data-step]',el).forEach(e=>e.classList.toggle('on',+e.dataset.step<=n));if(fire&&STEP[el.id])STEP[el.id](n);}
/* ---------- web galaxy generator (s4) ---------- */
function polarGalaxies(n,seed){
  const r=rng(seed),out=[];
  const cl=[[-38,.55],[-10,.62],[14,.47],[30,.72],[-22,.82],[5,.88],[-48,.8],[40,.55]];
  const P=cl.map(c=>({x:Math.sin(c[0]*Math.PI/180)*c[1],y:Math.cos(c[0]*Math.PI/180)*c[1]}));
  while(out.length<n){
    const k=r();let x,y;
    if(k<.35){const c=P[(r()*P.length)|0];x=c.x+gauss(r)*.03;y=c.y+gauss(r)*.03;}
    else if(k<.8){const f=[[0,1],[1,2],[2,3],[1,4],[0,5],[3,7],[4,5],[5,6]][(r()*8)|0];const a=P[f[0]],b=P[f[1]],t=r();x=a.x+(b.x-a.x)*t+gauss(r)*.012;y=a.y+(b.y-a.y)*t+gauss(r)*.012;}
    else{const th=(r()-.5)*Math.PI*2*(60/180);const rad=Math.sqrt(r())*0.98;x=Math.sin(th)*rad;y=Math.cos(th)*rad;}
    const rad=Math.hypot(x,y),th=Math.atan2(x,y)*180/Math.PI;
    if(rad<.98&&Math.abs(th)<60&&rad>.05)out.push({x:x,y:y});
  }
  return out;
}


/* ---------- 4. map building ---------- */
(function(){
  const c=$('#c4'),g=hd(c,640,410,1.8),OX=320,OY=392,R=368;
  const gal=polarGalaxies(650,11);let shown=0,adding=false,tt=0,placed=[],done=false;
  let A={th:-24,r:.64};
  // 측정 과정 시간표(초): 대상 표시 → 방향(각도) 재기 → 거리(적색 이동) 재기 → 점 찍기
  const T1=.8,T2=2.8,T3=4.4;
  const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
  const zOf=r=>r*0.1, mpcOf=r=>zOf(r)*299792/70;
  const side=th=>th<0?'왼쪽':'오른쪽';
  function ax(th,r){return[OX+Math.sin(th*Math.PI/180)*r*R,OY-Math.cos(th*Math.PI/180)*r*R];}
  function label(lines,x,y,col){g.font=F(18);const w=Math.max(...lines.map(s=>g.measureText(s).width))+16,h=lines.length*22+8;
    x=Math.max(4,Math.min(640-w-4,x-w/2));y=Math.max(4,Math.min(410-h-4,y-h/2));
    g.fillStyle='rgba(15,23,42,.85)';g.fillRect(x,y,w,h);g.fillStyle=col;g.textAlign='left';lines.forEach((s,i)=>g.fillText(s,x+8,y+22+i*22));}
  let lastA='',lastB='',lastK='';
  function cards(){
    const k=tt<T1?'':tt<T2?'k4a':tt<T3?'k4b':'k4c';
    if(k!==lastK){['k4a','k4b','k4c'].forEach(id=>$('#'+id).classList.toggle('cur',id===k));lastK=k;}
    const a=tt<T1?'':'→ 기준선에서 '+side(A.th)+' '+Math.round(Math.abs(A.th)*ease((tt-T1)/(T2-T1)))+'°';
    const b=tt<T2?'':'→ z = '+zOf(A.r).toFixed(3)+' → 거리 약 '+Math.round(mpcOf(A.r))+' Mpc';
    if(a!==lastA){$('#v4a').textContent=a;lastA=a;} if(b!==lastB){$('#v4b').textContent=b;lastB=b;}
  }
  function draw(){
    g.fillStyle=DARK;g.fillRect(0,0,640,410);
    g.strokeStyle=GRID;g.lineWidth=1.5;
    [.25,.5,.75,1].forEach(k=>{g.beginPath();g.arc(OX,OY,R*k,(-90-60)*Math.PI/180,(-90+60)*Math.PI/180);g.stroke();});
    [-60,60].forEach(a=>{const p=ax(a,1);g.beginPath();g.moveTo(OX,OY);g.lineTo(p[0],p[1]);g.stroke();});
    // 기준선 (0°)
    {const q=ax(0,1);g.strokeStyle='rgba(226,232,240,.8)';g.lineWidth=2;g.beginPath();g.moveTo(OX,OY);g.lineTo(q[0],q[1]);g.stroke();
     g.fillStyle='#e2e8f0';g.font=F(16);g.textAlign='left';g.fillText('기준선 (0°)',q[0]+6,q[1]+16);}
    g.fillStyle=TXT;g.font=F(15);g.textAlign='left';g.fillText('바깥쪽일수록 적색 이동 z가 커요(멀어요)',10,20);
    if(shown>0){g.fillStyle=LIGHT;for(let i=0;i<shown;i++){const q=ax(Math.atan2(gal[i].x,gal[i].y)*180/Math.PI,Math.hypot(gal[i].x,gal[i].y));g.fillRect(q[0]-1.3,q[1]-1.3,2.6,2.6);}}
    placed.forEach(p=>{const q=ax(p.th,p.r);g.fillStyle='#fde68a';g.beginPath();g.arc(q[0],q[1],3.5,0,7);g.fill();});
    const p=ax(A.th,A.r);
    if(tt<T3){g.strokeStyle=ORANGE;g.lineWidth=3;g.setLineDash([5,5]);g.beginPath();g.arc(p[0],p[1],12,0,7);g.stroke();g.setLineDash([]);
      if(tt<T1){g.fillStyle=ORANGE;g.font=F(18);g.textAlign=A.th>30?'right':'left';g.fillText('이 은하는 어디?',p[0]+(A.th>30?-18:18),p[1]+6);}}
    // ① 방향: 주황 선이 기준선에서 은하 쪽으로 돌아가며 각도를 잼
    if(tt>=T1){const cur=A.th*ease((tt-T1)/(T2-T1)),q=ax(cur,.98);
      g.strokeStyle=ORANGE;g.lineWidth=3;g.setLineDash([8,6]);g.beginPath();g.moveTo(OX,OY);g.lineTo(q[0],q[1]);g.stroke();g.setLineDash([]);
      g.lineWidth=3;g.beginPath();g.arc(OX,OY,60,-Math.PI/2,(cur-90)*Math.PI/180,cur<0);g.stroke();
      // 각도 글자는 기준선 건너편(은하 반대쪽)에 두어 거리 글자와 겹치지 않게
      label(['방향 '+side(A.th)+' '+Math.round(Math.abs(cur))+'°'],OX-(A.th<0?-1:1)*110,OY-62,'#fdba74');}
    // ② 거리: 적색 이동에 비례하는 길이만큼 선이 뻗어 나감
    if(tt>=T2){const f=ease((tt-T2)/(T3-T2)),e=ax(A.th,A.r*f),a=A.th*Math.PI/180,s=A.th<0?-1:1;
      g.strokeStyle=ORANGE;g.lineWidth=7;g.beginPath();g.moveTo(OX,OY);g.lineTo(e[0],e[1]);g.stroke();
      if(f>.4){const mid=ax(A.th,A.r*f*.6);label(['거리 ∝ 적색 이동','z = '+zOf(A.r).toFixed(3)],mid[0]+s*Math.cos(a)*85,mid[1]+s*Math.sin(a)*85,'#fdba74');}}
    // ③ 점 찍기
    if(tt>=T3){g.fillStyle='#fff';g.beginPath();g.arc(p[0],p[1],8,0,7);g.fill();g.strokeStyle=ORANGE;g.lineWidth=3;g.beginPath();g.arc(p[0],p[1],15,0,7);g.stroke();
      if(!done){placed.push({th:A.th,r:A.r});done=true;}}
    g.fillStyle='#facc15';g.beginPath();g.arc(OX,OY,8,0,7);g.fill();g.fillStyle='#e2e8f0';g.font=F(18);g.textAlign=A.th<0?'left':'right';g.fillText('관측자(우리)',OX+(A.th<0?14:-14),OY+4);
    g.fillStyle=TXT;g.font=F(15);g.textAlign='right';g.fillText('지도를 클릭하면 그 은하를 측정해요',632,20);
    cards();
  }
  function measure(th,r){A={th:th,r:r};tt=0;done=false;}
  c.addEventListener('click',ev=>{
    const q=pos(ev,c),dx=q.x-OX,dy=OY-q.y;let th=Math.atan2(dx,dy)*180/Math.PI,r=Math.hypot(dx,dy)/R;
    if(Math.abs(th)>60||r<.05||r>1)return;
    if(shown>0){let best=-1,bd=12;for(let i=0;i<shown;i++){const p=ax(Math.atan2(gal[i].x,gal[i].y)*180/Math.PI,Math.hypot(gal[i].x,gal[i].y)),d=Math.hypot(p[0]-q.x,p[1]-q.y);if(d<bd){bd=d;best=i;}}
      if(best>=0){th=Math.atan2(gal[best].x,gal[best].y)*180/Math.PI;r=Math.hypot(gal[best].x,gal[best].y);}}
    measure(th,r);
  });
  SIM.s4=loop('s4',(t,dt)=>{tt+=Math.min(.25,dt);if(adding){shown=Math.min(gal.length,shown+6);if(shown>=gal.length)adding=false;}draw();});
  $('#b4a').onclick=()=>{adding=true;};
  $('#b4n').onclick=()=>{const q=gal[(Math.random()*gal.length)|0];measure(Math.atan2(q.x,q.y)*180/Math.PI,Math.hypot(q.x,q.y));};
  $('#b4r').onclick=()=>{shown=0;adding=false;placed=[];measure(-24,.64);};
  // 수업 자료에서 이 페이지가 열릴 때마다 측정 과정을 처음부터 다시 보여 줌
  addEventListener('message',e=>{if(e.data&&e.data.type==='deck-show')measure(A.th,A.r);});
  draw();
})();


window.STEP=STEP;const el=slides[0];if(SIM[el.id])SIM[el.id].start();
})();
</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
</body>
