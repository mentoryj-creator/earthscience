<!DOCTYPE html>

<style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', sans-serif; color: #1e293b; }
        button, input { font-family: 'Gowun Dodum', sans-serif; }
        p, h3, figure { margin: 0; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }
        .slide.active { display: flex; }

        /* 표지 (03~05단원과 동일) */
        .slide.cover-slide { background-color: #1e293b; padding: 60px; }
        .cover-card { background-color: white; width: 100%; height: 100%; border-radius: 20px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; }

        .ppt-title { font-size: 60px; font-weight: 800; border-bottom: 6px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; color: #1e293b; letter-spacing: -1px; line-height: 1.25; }
        .ppt-subtitle { display: inline-block; font-size: 38px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 12px 32px; border-radius: 0 20px 20px 0; margin-bottom: 28px; align-self: flex-start; }
        .ppt-text { font-size: 38px; color: #334155; line-height: 1.6; margin-bottom: 25px; word-break: keep-all; }
        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; }
        #fullscreen-btn:hover { background-color: #1e293b; }

        .guide-label { position: absolute; bottom: 20px; right: 30px; font-size: 24px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 10px 20px; border-radius: 10px; font-weight: bold; z-index: 10; }
        /* 06단원 본문 요소 (03~05단원 색·글꼴 체계에 맞춤) */
        .main { flex: 1; min-height: 0; display: flex; gap: 40px; }
        .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .grow { flex: 1; min-width: 0; }
        .card { background: #fff; border: 2px solid #cbd5e1; border-radius: 20px; padding: 20px 28px; font-size: 31px; line-height: 1.55; color: #1e293b; word-break: keep-all; }
        .card.soft { background: #f8fafc; border-color: #e2e8f0; }
        .card.key { background: #fff7ed; border-color: #fdba74; }

        .card.goal { display: flex; align-items: center; gap: 24px; font-size: 36px; padding: 26px 32px; }
        .gnum { flex: none; display: inline-flex; width: 60px; height: 60px; border-radius: 50%; background: #3b82f6; color: #fff; font-weight: 800; font-size: 34px; align-items: center; justify-content: center; }
        .gnum.s { width: auto; height: auto; background: none; color: #ea580c; font-size: 34px; }
        .hl { color: #2563eb; font-weight: bold; }
        .or { color: #ea580c; font-weight: bold; }
        .ppt-subtitle .or { color: #ea580c; }
        .look { display: inline-block; background: #3b82f6; color: #fff; border-radius: 10px; padding: 2px 14px; font-size: 25px; font-weight: bold; margin-right: 10px; vertical-align: 3px; }
        .look.o { background: #ea580c; }

        .chip { display: inline-block; border: 2px solid #cbd5e1; border-radius: 999px; padding: 2px 18px; font-size: 27px; font-weight: bold; margin: 4px 8px 4px 0; background: #fff; color: #334155; }
        .chip.b { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }

        /* 단계별로 나타나기 (다음 ▶ 버튼으로 하나씩 보여 줌) */
        [data-step] { opacity: 0; transform: translateY(14px); transition: opacity .55s, transform .55s; pointer-events: none; }

        .slide.active .main { animation: rise .6s .2s both; }

        .fs-btn:hover { border-color: #3b82f6; color: #1d4ed8; }
    </style>
<style id="standalone">

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>

(function(){
  const c=document.getElementById('cA'),g=c.getContext('2d'),W=1260,H=760,KS=c.width/W;
  const cs=document.getElementById('cS'),gs=cs.getContext('2d'),SW=cs.width,SH=cs.height;
  const SX=630,SY=600,A=140,RC=560; // 태양, 공전 궤도 반지름, 천구 반지름
  let d=1.3,th=0,ph=Math.PI/2,run=true,drag=false;
  // 별의 위치: 태양에서 (160+25d)만큼, 방향 th(황도의 극=위쪽에서 기운 각, ±90°면 공전 궤도면)
  const star=()=>{const L=160+d*25;return [SX+L*Math.sin(th),SY-L*Math.cos(th)];};
  const r=SIM.rng(5),bg=[];for(let i=0;i<160;i++)bg.push([Math.PI*(0.9+r()*1.2),RC-6-r()*26,r()*1.6+.6]);
  const bgS=[];for(let i=0;i<50;i++)bgS.push([r(),r(),r()*1.5+.6]);
  function out(){const p=1/d;document.getElementById('vA').textContent=d.toFixed(2)+' pc';document.getElementById('rA').value=d;
    document.getElementById('oA').innerHTML='<div>연주 시차 p = 1 / '+d.toFixed(2)+' = <span class="sim-big" style="font-size:38px">'+p.toFixed(3)+'″</span></div>'+
      '<div>최대 시차 (6개월 간격) = 2p = <b>'+(2*p).toFixed(3)+'″</b></div>'+
      '<div class="sim-note">거리가 2배가 되면 연주 시차는 1/2. 별을 끌어 방향을 바꾸면 천구 위 궤적의 모양(원↔타원↔선)은 달라지지만 연주 시차는 거리로만 정해져요. ※ 실제 연주 시차는 1″보다 작아 그림에서는 크게 과장했어요.</div>';}
  document.getElementById('rA').oninput=e=>{d=+e.target.value;out();};
  const b1=document.getElementById('bA1');b1.onclick=()=>{run=!run;b1.textContent=run?'❚❚ 멈춤':'▶ 재생';};out();
  // 별 끌기: 태양에서 멀고 가까움 → 거리, 방향 → 별의 방향 (공전 궤도면까지)
  const at=e=>{const p=SIM.pos(e,c);return [p.x/KS,p.y/KS];};
  function moveTo(x,y){th=Math.max(-Math.PI/2,Math.min(Math.PI/2,Math.atan2(x-SX,SY-y)));
    d=Math.max(0.6,Math.min(10,Math.round(((Math.hypot(x-SX,SY-y)-160)/25)*20)/20));out();}
  c.addEventListener('pointerdown',e=>{const [x,y]=at(e),s=star();if(Math.hypot(x-s[0],y-s[1])<34){drag=true;c.setPointerCapture(e.pointerId);}});
  c.addEventListener('pointermove',e=>{const [x,y]=at(e);if(drag){moveTo(x,y);return;}const s=star();c.style.cursor=Math.hypot(x-s[0],y-s[1])<34?'grab':'default';});
  c.addEventListener('pointerup',()=>{drag=false;});
  // 지구에서 별을 지나는 시선이 천구(반지름 RC인 원)와 만나는 점
  function onSphere(x0,y0,sx,sy){const vx=sx-x0,vy=sy-y0,fx=x0-SX,fy=y0-SY,aa=vx*vx+vy*vy,bb=2*(fx*vx+fy*vy),cc=fx*fx+fy*fy-RC*RC,D=bb*bb-4*aa*cc;if(D<0)return null;const t=(-bb+Math.sqrt(D))/(2*aa);return [x0+vx*t,y0+vy*t];}
  const EARTH=a=>[SX+A*Math.cos(a),SY+A*0.35*Math.sin(a)];
  SIM.loop('d202_parallax',(t,dt)=>{
    g.setTransform(KS,0,0,KS,0,0);
    if(run)ph+=dt*0.8;
    g.fillStyle='#0f172a';g.fillRect(0,0,W,H);
    const [stx,sy]=star(),[ex,ey]=EARTH(ph);
    // 둥근 천구와 아주 먼 배경 별들
    const A0=Math.PI-0.22,A1=2*Math.PI+0.22;
    g.strokeStyle='rgba(51,65,85,.95)';g.lineWidth=34;g.beginPath();g.arc(SX,SY,RC-17,A0,A1);g.stroke();
    g.strokeStyle='rgba(148,163,184,.5)';g.lineWidth=2;g.beginPath();g.arc(SX,SY,RC,A0,A1);g.stroke();
    bg.forEach(b=>{g.fillStyle='#e2e8f0';g.fillRect(SX+b[1]*Math.cos(b[0]),SY+b[1]*Math.sin(b[0]),b[2],b[2]);});
    g.fillStyle='#94a3b8';g.font=SIM.font(19);g.textAlign='left';g.fillText('둥근 띠 = 천구 (아주 먼 배경 별들)',20,34);g.textAlign='center';
    // 1년 동안 천구 위에 보이는 위치들
    for(let a=0;a<6.283;a+=0.04){const e=EARTH(a),q=onSphere(e[0],e[1],stx,sy);if(q){g.fillStyle='rgba(253,224,71,.4)';g.beginPath();g.arc(q[0],q[1],2,0,7);g.fill();}}
    // 공전 궤도와 태양
    g.strokeStyle='rgba(148,163,184,.5)';g.lineWidth=1.5;g.beginPath();g.ellipse(SX,SY,A,A*0.35,0,0,7);g.stroke();
    const sg=g.createRadialGradient(SX,SY,2,SX,SY,26);sg.addColorStop(0,'#fff');sg.addColorStop(1,'rgba(250,204,21,0)');g.fillStyle=sg;g.beginPath();g.arc(SX,SY,26,0,7);g.fill();
    // 연주 시차 p: 태양–별 방향에 수직인 1 AU 기준선의 양 끝(공전 궤도 위 두 지점, 6개월 간격). 별의 방향이 바뀌면 함께 돌아감
    const ux=Math.cos(th),uy=Math.sin(th),tq=1/Math.sqrt((ux/A)**2+(uy/(A*0.35))**2),P1=[SX-ux*tq,SY-uy*tq],P2=[SX+ux*tq,SY+uy*tq];
    g.strokeStyle='rgba(250,204,21,.85)';g.lineWidth=1.5;g.beginPath();g.moveTo(P1[0],P1[1]);g.lineTo(stx,sy);g.lineTo(P2[0],P2[1]);g.stroke();g.beginPath();g.moveTo(stx,sy);g.lineTo(SX,SY);g.stroke();
    g.setLineDash([4,4]);g.beginPath();g.moveTo(P1[0],P1[1]);g.lineTo(P2[0],P2[1]);g.stroke();g.setLineDash([]);
    [P1,P2].forEach(q=>{g.fillStyle='#facc15';g.beginPath();g.arc(q[0],q[1],5,0,7);g.fill();});
    g.fillStyle='#fde68a';g.font=SIM.font(22);g.textAlign='center';g.fillText('p',stx+(SX-stx)*0.2+14,sy+(SY-sy)*0.2);
    // 지금의 시선과 보이는 위치
    const hp=onSphere(ex,ey,stx,sy);
    if(hp){g.strokeStyle='rgba(96,165,250,.7)';g.lineWidth=2;g.setLineDash([7,6]);g.beginPath();g.moveTo(ex,ey);g.lineTo(hp[0],hp[1]);g.stroke();g.setLineDash([]);
      const hg=g.createRadialGradient(hp[0],hp[1],1,hp[0],hp[1],14);hg.addColorStop(0,'#fff');hg.addColorStop(.5,'#facc15');hg.addColorStop(1,'rgba(250,204,21,0)');g.fillStyle=hg;g.beginPath();g.arc(hp[0],hp[1],14,0,7);g.fill();
      const ux=(hp[0]-SX)/RC,uy=(hp[1]-SY)/RC;g.fillStyle='#fde68a';g.font=SIM.font(18);g.fillText('보이는 위치',hp[0]-ux*58,hp[1]-uy*58+6);}
    // 별 (끌어서 옮길 수 있음)
    if(drag||c.style.cursor==='grab'){g.strokeStyle='rgba(253,230,138,.7)';g.lineWidth=2;g.setLineDash([4,4]);g.beginPath();g.arc(stx,sy,20,0,7);g.stroke();g.setLineDash([]);}
    g.fillStyle='#fde68a';g.beginPath();g.arc(stx,sy,9,0,7);g.fill();g.font=SIM.font(18);g.fillText('별',stx,sy-18);
    g.fillStyle='#60a5fa';g.beginPath();g.arc(ex,ey,10,0,7);g.fill();g.fillStyle='#93c5fd';g.fillText('지구',ex,ey+30);
    g.fillStyle='#cbd5e1';g.font=SIM.font(17,false);g.fillText('1 AU',(SX+P2[0])/2+(uy>0.3?16:0),(SY+P2[1])/2+18);
    g.fillStyle='#e2e8f0';g.font=SIM.font(22);g.textAlign='left';g.fillText(['1월','4월','7월','10월'][Math.floor(((ph%6.283)+6.283)%6.283/6.283*4)]+' 무렵',20,H-22);
    g.fillStyle='#94a3b8';g.font=SIM.font(18,false);g.textAlign='right';g.fillText('별을 끌어 옮겨 보세요 (멀리·가까이: 거리, 기울이기: 방향)',W-20,H-22);

    // ===== 오른쪽 창: 천구에서 본 별의 1년 동안 위치 =====
    // 1년 동안 별은 작은 타원을 그려요. 긴반지름 = 연주 시차 p, 짧은반지름 = p × sin(황위 β).
    // 크기는 보기 쉽게 로그로 줄여 나타냄(10 pc에서도 반지름 90, 가장 가까울 때 210, 실제 비율 아님)
    const p=1/d,beta=Math.PI/2-Math.abs(th),ra=90+120*Math.max(0,Math.min(1,Math.log(p/0.1)/Math.log(1/0.06))),rb=ra*Math.sin(beta),cx=SW/2,cy=330;
    gs.fillStyle='#020617';gs.fillRect(0,0,SW,SH);
    bgS.forEach(b=>{gs.fillStyle='rgba(226,232,240,.55)';gs.fillRect(b[0]*SW,60+b[1]*520,b[2],b[2]);});
    gs.fillStyle='#e2e8f0';gs.font=SIM.font(24);gs.textAlign='center';gs.fillText('천구에서 본 별의 1년 동안 위치',cx,42);
    gs.strokeStyle='rgba(253,224,71,.6)';gs.lineWidth=2.5;gs.setLineDash([6,6]);gs.beginPath();gs.ellipse(cx,cy,ra,Math.max(rb,1),0,0,7);gs.stroke();gs.setLineDash([]);
    gs.font=SIM.font(17,false);gs.fillStyle='#94a3b8';
    [[0,'1월'],[Math.PI/2,'4월'],[Math.PI,'7월'],[Math.PI*1.5,'10월']].forEach(([q,m])=>{const mx=cx-ra*Math.cos(q),my=cy-rb*Math.sin(q);gs.beginPath();gs.arc(mx,my,4,0,7);gs.fill();
      if(rb>=30||Math.abs(Math.cos(q))>0.5)gs.fillText(m,mx+(Math.cos(q)>0.5?-28:Math.cos(q)<-0.5?28:0),my+(Math.sin(q)>0.5?-12:Math.sin(q)<-0.5?26:6));});
    gs.strokeStyle='rgba(148,163,184,.7)';gs.lineWidth=1.5;gs.beginPath();gs.moveTo(cx-8,cy);gs.lineTo(cx+8,cy);gs.moveTo(cx,cy-8);gs.lineTo(cx,cy+8);gs.stroke();
    gs.strokeStyle='#f97316';gs.lineWidth=3.5;gs.beginPath();gs.moveTo(cx,cy);gs.lineTo(cx+ra,cy);gs.stroke();
    gs.fillStyle='#f97316';gs.beginPath();gs.moveTo(cx+ra,cy);gs.lineTo(cx+ra-11,cy-6);gs.lineTo(cx+ra-11,cy+6);gs.fill();
    gs.font=SIM.font(24);gs.fillText('p',cx+ra/2,cy-10);
    const sx2=cx-ra*Math.cos(ph),sy2=cy-rb*Math.sin(ph),s2=gs.createRadialGradient(sx2,sy2,1,sx2,sy2,15);s2.addColorStop(0,'#fff');s2.addColorStop(.5,'#facc15');s2.addColorStop(1,'rgba(250,204,21,0)');gs.fillStyle=s2;gs.beginPath();gs.arc(sx2,sy2,15,0,7);gs.fill();
    gs.textAlign='left';gs.font=SIM.font(24);gs.fillStyle='#fdba74';gs.fillText('연주 시차 p = '+p.toFixed(3)+'″',28,SH-118);
    gs.fillStyle='#e2e8f0';gs.fillText('거리 r = 1 / p = '+d.toFixed(2)+' pc',28,SH-82);
    gs.fillStyle='#94a3b8';gs.font=SIM.font(17,false);gs.fillText('+ 태양에서 본 위치 · 황위 '+Math.round(beta*180/Math.PI)+'° (공전 궤도면에 가까울수록 납작)',28,SH-48);
    gs.fillText('궤적 크기는 보기 쉽게 확대해 그렸어요',28,SH-22);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
</body>
