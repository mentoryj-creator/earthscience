<div id="presentation-wrapper">
<div class="slide sim-slide active" id="d101_window"><div class="ppt-title"><span class="sim-tag">시뮬레이션</span>어떤 빛이 지표까지 도달할까?</div><div class="ppt-subtitle">파장을 골라 전자기파를 지구로 보내 봅시다.</div>
<div class="sim-wrap"><div class="sim-stage"><canvas id="cB" width="1060" height="610"></canvas></div>

<div class="sim-box key" style="font-size:25px">대기에 흡수되는 파장은 대기 밖의 <b>인공위성(우주 망원경)</b>으로만 관측할 수 있어요.</div></div></div></div>

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>



/* ===== 대기의 창 ===== */
(function(){
  const c=document.getElementById('cB'),g=c.getContext('2d'),W=1060,H=610,GROUND=540,TOP=60;
  const BANDS=[['감마선','0.01 nm 이하',75,'#a855f7',8,'페르미 감마선 우주 망원경'],['X선','0.01~10 nm',90,'#8b5cf6',11,'찬드라 X선 우주 망원경'],['자외선','10~400 nm',35,'#6366f1',16,'허블 우주 망원경 등'],['가시광선','400~700 nm',0,'#facc15',24,'지상 광학 망원경'],['적외선','0.7 μm~1 mm',15,'#ef4444',34,'제임스 웹·스피처 우주 망원경 (일부 파장은 높은 산 위)'],['전파','1 mm~10 m',0,'#22c55e',52,'지상 전파 망원경'],['긴 전파','10 m 이상',110,'#16a34a',72,'우주 공간에서 관측 (전리층이 반사)']];
  let sel=3,y=TOP,ph=0,stop=false;
  const Y=km=>GROUND-(km/120)*(GROUND-TOP);
  const box=document.getElementById('bandsB');
  BANDS.forEach((b,i)=>{const e=document.createElement('button');e.className='sim-btn';e.textContent=b[0];e.onclick=()=>{sel=i;y=TOP-20;stop=false;out();};box.appendChild(e);});
  function out(){const b=BANDS[sel];box.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===sel));
    document.getElementById('oB').innerHTML='<h4 style="color:'+b[3]+'">'+b[0]+' <span style="font-size:22px;color:#64748b">('+b[1]+')</span></h4><div>'+(b[2]===0?'<span class="sim-ok">지표까지 도달해요! (대기의 창)</span>':'고도 약 <b class="or">'+b[2]+' km</b>에서 '+(sel===6?'반사·흡수':'흡수')+'돼요.')+'</div><div style="margin-top:8px">관측 방법: <b>'+b[5]+'</b></div>';}
  out();
  SIM.loop('d101_window',(t,dt)=>{
    const b=BANDS[sel],stopY=b[2]===0?GROUND-40:Y(b[2]);
    if(y<stopY)y=Math.min(stopY,y+dt*260);ph+=dt*8;
    const sk=g.createLinearGradient(0,0,0,GROUND);sk.addColorStop(0,'#020617');sk.addColorStop(.45,'#1e3a8a');sk.addColorStop(1,'#7dd3fc');g.fillStyle=sk;g.fillRect(0,0,W,H);
    g.fillStyle='#166534';g.fillRect(0,GROUND,W,H-GROUND);
    g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.font=SIM.font(17,false);g.fillStyle='#e2e8f0';g.textAlign='right';
    [0,20,40,60,80,100,120].forEach(k=>{g.beginPath();g.moveTo(70,Y(k));g.lineTo(W,Y(k));g.stroke();g.fillText(k+' km',62,Y(k)+5);});
    g.textAlign='left';g.fillStyle='rgba(255,255,255,.75)';g.font=SIM.font(18);g.fillText('오존층',W-140,Y(30)+5);g.fillText('전리층',W-140,Y(100)+5);g.fillText('우주 공간',W-140,TOP-10);
    // 위성 & 망원경
    g.fillStyle='#cbd5e1';g.fillRect(820,22,40,22);g.fillStyle='#60a5fa';g.fillRect(780,28,36,10);g.fillRect(864,28,36,10);g.fillStyle='#e2e8f0';g.font=SIM.font(17);g.fillText('우주 망원경',780,64);
    const reached=b[2]===0&&y>=stopY;g.fillStyle=reached?'#facc15':'#e2e8f0';g.beginPath();g.arc(560,GROUND,34,Math.PI,0);g.fill();g.fillRect(552,GROUND-6,16,30);
    g.fillStyle='#fff';g.fillText('지상 망원경',600,GROUND+40);
    // 전자기파
    g.strokeStyle=b[3];g.lineWidth=5;g.beginPath();for(let yy=TOP-10;yy<y;yy+=2){const x=560+18*Math.sin((yy-ph*20)/b[4]*6.283/4);yy===TOP-10?g.moveTo(x,yy):g.lineTo(x,yy);}g.stroke();
    if(y>=stopY&&b[2]>0){const a=0.5+0.5*Math.sin(t/150);g.fillStyle='rgba(255,255,255,'+(0.35*a)+')';g.beginPath();g.ellipse(560,stopY,90,18,0,0,7);g.fill();g.fillStyle='#fff';g.font=SIM.font(22);g.textAlign='center';g.fillText(sel===6?'반사·흡수!':'흡수!',560,stopY-26);g.textAlign='left';}
    g.fillStyle='#fff';g.font=SIM.font(24);g.fillText(b[0],590,TOP+20);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
