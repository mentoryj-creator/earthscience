<!DOCTYPE html>
<html lang="ko">
<head>

<title>작은 밀도 차이가 거대 구조로</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #020617; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', sans-serif; color: #1e293b; }
        button, input { font-family: 'Gowun Dodum', sans-serif; }
        p, h3, figure { margin: 0; }
        #presentation-wrapper { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform-origin: center center; background-color: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 20px; }
        .slide { display: none; width: 100%; height: 100%; padding: 60px 80px 130px 80px; flex-direction: column; box-sizing: border-box; }

        .ppt-subtitle { display: inline-block; font-size: 38px; font-weight: 700; background-color: #eff6ff; border-left: 8px solid #3b82f6; color: #1d4ed8; padding: 12px 32px; border-radius: 0 20px 20px 0; margin-bottom: 28px; align-self: flex-start; }

        .visual-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 4px dashed #cbd5e1; border-radius: 20px; background-color: #f8fafc; position: relative; padding: 20px; min-height: 0; margin-top: 10px; }

        .controls { position: absolute; bottom: 0; left: 0; height: 100px; width: 100%; background-color: #f1f5f9; border-top: 3px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; box-sizing: border-box; z-index: 50; }
        .controls button { font-size: 28px; padding: 12px 35px; font-weight: bold; background-color: white; border: 2px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .controls button:hover:not(:disabled) { background-color: #e2e8f0; color: #0f172a; }

        .guide-label { position: absolute; bottom: 20px; right: 30px; font-size: 24px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 10px 20px; border-radius: 10px; font-weight: bold; z-index: 10; }
        /* 06단원 본문 요소 (03~05단원 색·글꼴 체계에 맞춤) */
        .main { flex: 1; min-height: 0; display: flex; gap: 40px; }

        .or { color: #ea580c; font-weight: bold; }

        .chip.b { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }

        .blank { display: inline-block; min-width: 200px; border-bottom: 4px dashed #ea580c; text-align: center; color: transparent; cursor: pointer; font-weight: bold; transition: color .4s; user-select: none; }
        .blank.on { color: #ea580c; border-bottom-style: solid; }
        .barrow { display: flex; align-items: center; gap: 20px; height: 84px; }
        .barrow .bl { width: 340px; }
        .barrow .bt { position: relative; flex: 1; height: 44px; background: #e2e8f0; border-radius: 10px; }
        .barrow .rb { position: absolute; top: 0; height: 100%; border-radius: 10px; transition: width .9s; }
        .barrow .bv { width: 200px; font-size: 34px; font-weight: 800; }
        .qrow { display: flex; align-items: center; gap: 16px; }
        .q { font-size: 32px; padding: 18px 28px; }
        .q .sim-btn { font-size: 32px; padding: 4px 26px; }
        .q .res { width: 160px; font-size: 32px; font-weight: 800; }
        .q .why { margin-top: 6px; font-size: 26px; }
        .sim-btn.tool.on { background: var(--c); border-color: var(--c); color: #fff; }
        .sim-btn.tool { border-color: var(--c); color: var(--c); }
        .sim-row span { font-size: 26px; }
        .pulse { animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

        /* 단계별로 나타나기 (다음 ▶ 버튼으로 하나씩 보여 줌) */
        [data-step] { opacity: 0; transform: translateY(14px); transition: opacity .55s, transform .55s; pointer-events: none; }
        [data-step].on { opacity: 1; transform: none; pointer-events: auto; }
        svg [data-step] { transform: none !important; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .slide.active .ppt-title { animation: rise .6s both; }
        .slide.active .ppt-subtitle { animation: rise .6s .1s both; }
        .slide.active .main { animation: rise .6s .2s both; }

        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */
        .sim-slide .ppt-title { margin-bottom: 20px; padding-bottom: 14px; }
        .sim-slide .ppt-subtitle { font-size: 34px; padding: 10px 30px; margin-bottom: 22px; }
        .sim-tag { display: inline-block; background: #0f172a; color: #facc15; font-size: 28px; padding: 6px 18px; border-radius: 12px; margin-right: 18px; vertical-align: 8px; letter-spacing: 0; }
        .sim-wrap { flex: 1; display: flex; gap: 30px; min-height: 0; }
        .sim-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .sim-stage { position: relative; background: #0f172a; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); flex: none; }
        .sim-stage.light { background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .sim-stage canvas { display: block; }
        .sim-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .sim-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px 26px; font-size: 28px; color: #1e293b; line-height: 1.5; word-break: keep-all; }
        .sim-box.key { background: #fff7ed; border-color: #fdba74; }
        .sim-box.blue { background: #eff6ff; border-color: #bfdbfe; }
        .sim-box h4 { font-size: 30px; font-weight: 800; color: #1d4ed8; margin: 0 0 8px 0; }
        .sim-slide, .sim-slide button, .sim-slide table { font-family: 'Gowun Dodum', sans-serif; }
        .sim-box p, .sim-box div { margin: 0; }
        .sim-box.key h4 { color: #c2410c; }
        .sim-row { display: flex; align-items: center; gap: 14px; font-size: 27px; margin: 6px 0; }
        .sim-row > .lbl { flex: none; width: 190px; font-weight: bold; color: #334155; }
        input[type=range].sim-range { flex: 1; accent-color: #3b82f6; height: 36px; cursor: pointer; min-width: 0; }
        .sim-val { flex: none; min-width: 150px; text-align: right; font-weight: bold; color: #ea580c; font-size: 29px; }
        .sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
        .sim-btn:hover { background: #e2e8f0; }
        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .sim-btn.orange { border-color: #fdba74; color: #c2410c; }
        .sim-btn.orange.on { background: #ea580c; border-color: #ea580c; color: #fff; }
        .sim-table { width: 100%; border-collapse: collapse; font-size: 26px; }
        .sim-table th { background: #3b82f6; color: #fff; padding: 8px 10px; font-weight: bold; }
        .sim-table td { padding: 6px 10px; border-bottom: 2px solid #e2e8f0; text-align: center; background: #fff; }
        .sim-big { font-size: 40px; font-weight: 800; color: #ea580c; }
        .sim-note { font-size: 22px; color: #64748b; line-height: 1.45; }
        .sim-ok { color: #16a34a; font-weight: bold; }
        .sim-hint { position: absolute; left: 20px; top: 16px; font-size: 22px; color: #cbd5e1; background: rgba(15,23,42,0.75); padding: 6px 14px; border-radius: 10px; pointer-events: none; }
        .sim-stage.light .sim-hint { color: #475569; background: rgba(255,255,255,0.9); }

<style id="standalone">
  /* ---- 독립 실행용 (사이트 iframe·수업 모드·새 창에 맞춤) ---- */
  html, body { margin: 0 !important; padding: 0 !important; width: auto !important; height: auto !important;
    overflow: hidden !important; display: block !important; background: #ffffff; }
  html.fit, html.fit body { height: 100% !important; background: #0f172a; }
  #presentation-wrapper { position: relative !important; top: 0 !important; left: 0 !important;
    width: 1920px !important; height: auto !important; transform-origin: 0 0 !important;
    border-radius: 0 !important; box-shadow: none !important; overflow: visible !important; background: #fff !important; }
  #presentation-wrapper > .slide { display: flex !important; height: auto !important; min-height: 0 !important;
    padding: 34px 60px 40px 60px !important; }
  #presentation-wrapper > .slide > .ppt-title { display: none !important; }
  #presentation-wrapper > .slide > .ppt-subtitle { margin-top: 0 !important; }
  #presentation-wrapper [data-step] { opacity: 1 !important; visibility: visible !important; }
  #presentation-wrapper .slide, #presentation-wrapper .slide * { animation: none !important; }
</style>
</head>
<body>
<div id="presentation-wrapper">
<div class="slide sim-slide active" id="s21">
            <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>작은 밀도 차이가 거대 구조로</div>
            <div class="ppt-subtitle">밀도가 높은 곳은 <span class="or">더 높아지고</span>, 낮은 곳은 <span class="or">더 낮아져요.</span></div>
            <div class="main">
                <div class="col" style="align-items:center">
                    <div class="sim-stage"><canvas id="c21"></canvas></div>
                    <div class="sim-row" style="width:100%"><button class="sim-btn on" id="b21p">▶ 재생</button><span>과거</span><input type="range" class="sim-range" id="r21" min="0" max="1000" value="0"><span>현재</span></div>
                </div>
                <div class="col grow" style="font-size:27px">
                    <div class="card soft" style="font-size:27px"><span class="look o">관찰 포인트</span>처음엔 거의 <b>고른 분포</b>예요. 시간이 지날수록 <b>실 모양·덩어리</b>와 <b>빈 곳</b>이 뚜렷해져요.</div>
                    <div class="card" data-step="1" style="font-size:27px">초기 우주의 <b>밀도 차이</b>가 중력 불안정으로 자라서 오늘날의 은하 구조가 되었어요.</div>
                    <div class="card soft" data-step="2" style="font-size:27px">차가운 암흑 물질은 느리게 움직여 <b>작은 구조가 먼저</b> 생기고 점점 <b>합쳐져 큰 구조</b>가 돼요.</div>
                    <div class="card key" data-step="3" style="font-size:27px"><b>확인!</b> 거대 공동 vs 은하 장성 중, 초기 우주의 밀도가 <b>높은 곳</b>에서 형성되었을 것은?
                        <div style="margin-top:8px" class="sim-btns"><button class="sim-btn" id="q21a">거대 공동</button><button class="sim-btn" id="q21b">은하 장성</button></div><div id="a21" class="or" style="margin-top:6px"></div></div>
                    <div class="note" style="font-size:21px">※ 개념을 보여 주는 단순 모형이에요(실제 우주 시뮬레이션 아님).</div>
                </div>
            </div>

</div>
<script>
(function(){
'use strict';
'use strict';
/* ---------- utils ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const $=(s,p)=> (p||document).querySelector(s);
const $$=(s,p)=> Array.from((p||document).querySelectorAll(s));
const FONT="'Gowun Dodum', sans-serif"; const F=(px)=>'bold '+px+'px '+FONT;
// 캔버스: 원래 좌표(w×h)는 그대로 쓰고, 화면에는 s배 크게 선명하게 그림
function hd(c,w,h,s){c.width=Math.round(w*s);c.height=Math.round(h*s);c.style.width=c.width+'px';c.style.height=c.height+'px';c._lw=w;c._lh=h;const g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);return g;}
function pos(ev,el){const r=el.getBoundingClientRect();return{x:(ev.clientX-r.left)*(el._lw||el.width)/r.width,y:(ev.clientY-r.top)*(el._lh||el.height)/r.height};}
const DARK='#0f172a', LIGHT='rgba(226,232,240,.85)', GRID='rgba(148,163,184,.45)', TXT='#94a3b8', BLUE='#60a5fa', ORANGE='#fb923c';

/* ---------- sim registry ---------- */
const SIM={}; const STEP={};
function loop(id,fn){let raf=0,run=false,last=0;
  function f(t){ if(!run)return; fn(t,(t-last)/1000||0.016); last=t; raf=requestAnimationFrame(f);}
  return {start(){ if(run)return; run=true; last=performance.now(); raf=requestAnimationFrame(f);}, stop(){run=false;cancelAnimationFrame(raf);}};}

const slides=[$('#s21')];let cur=0;function upd(){}
function setShown(el,n,fire){el._shown=n;$$('[data-step]',el).forEach(e=>e.classList.toggle('on',+e.dataset.step<=n));if(fire&&STEP[el.id])STEP[el.id](n);}
/* ---------- 21. structure formation ---------- */
(function(){
  const c=$('#c21'),g=hd(c,520,440,1.25),r=rng(21);
  const M=[];for(let i=0;i<46;i++){let kx=((r()*9)|0)-4,ky=((r()*9)|0)-4;if(!kx&&!ky)kx=1;const k2=kx*kx+ky*ky;M.push({kx:kx,ky:ky,A:(r()*.7+.3)/Math.pow(k2,.9),ph:r()*6.28});}
  const n=96,q=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)q.push([i/n,j/n]);
  const S=q.map(p=>{let sx=0,sy=0;M.forEach(m=>{const th=6.2832*(m.kx*p[0]+m.ky*p[1])+m.ph;const k2=m.kx*m.kx+m.ky*m.ky;const f=-m.A*Math.sin(th)/(6.2832*k2)*6.2832;sx+=f*m.kx;sy+=f*m.ky;});return [sx,sy];});
  let t=0,play=false;
  function draw(){
    g.fillStyle=DARK;g.fillRect(0,0,520,440);
    const D=t*0.62;
    g.fillStyle='rgba(226,232,240,.6)';
    for(let i=0;i<q.length;i++){let x=q[i][0]+D*S[i][0],y=q[i][1]+D*S[i][1];x=((x%1)+1)%1;y=((y%1)+1)%1;g.fillRect(x*516+2,y*436+2,2,2);}
    g.fillStyle='rgba(15,23,42,.75)';g.fillRect(8,8,170,34);g.fillStyle='#facc15';g.font=F(18);g.fillText(t<0.05?'초기 우주':(t>0.95?'현재':'시간이 흐르는 중…'),18,32);
  }
  SIM.s21=loop('s21',(time,dt)=>{if(play){t=Math.min(1,t+dt/10);$('#r21').value=t*1000;if(t>=1){play=false;$('#b21p').textContent='▶ 재생';}}draw();});
  $('#r21').oninput=e=>{t=e.target.value/1000;play=false;$('#b21p').textContent='▶ 재생';};
  $('#b21p').onclick=()=>{if(t>=1)t=0;play=!play;$('#b21p').textContent=play?'❚❚ 멈춤':'▶ 재생';};
  $('#q21a').onclick=()=>{$('#a21').textContent='✕ 거대 공동은 밀도가 낮은 곳이에요.';};
  $('#q21b').onclick=()=>{$('#a21').textContent='○ 정답! 은하 장성이에요.';};
  draw();
})();


window.STEP=STEP;const el=slides[0];if(SIM[el.id])SIM[el.id].start();
})();
</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
