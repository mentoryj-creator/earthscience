<script>
(function(){
'use strict';
'use strict';
/* ---------- utils ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const $=(s,p)=> (p||document).querySelector(s);
const $$=(s,p)=> Array.from((p||document).querySelectorAll(s));
const FONT="'Gowun Dodum', sans-serif"; const F=(px)=>'bold '+px+'px '+FONT;
// 캔버스: 원래 좌표(w×h)는 그대로 쓰고, 화면에는 s배 크게 선명하게 그림
function hd(c,w,h,s){c.width=Math.round(w*s);c.height=Math.round(h*s);c.style.width=c.width+'px';c.style.height=c.height+'px';c._lw=w;c._lh=h;const g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);return g;}
function pos(ev,el){const r=el.getBoundingClientRect();return{x:(ev.clientX-r.left)*(el._lw||el.width)/r.width,y:(ev.clientY-r.top)*(el._lh||el.height)/r.height};}
const DARK='#0f172a', LIGHT='rgba(226,232,240,.85)', GRID='rgba(148,163,184,.45)', TXT='#94a3b8', BLUE='#60a5fa', ORANGE='#fb923c';

/* ---------- sim registry ---------- */
const SIM={}; const STEP={};
function loop(id,fn){let raf=0,run=false,last=0;
  function f(t){ if(!run)return; fn(t,(t-last)/1000||0.016); last=t; raf=requestAnimationFrame(f);}
  return {start(){ if(run)return; run=true; last=performance.now(); raf=requestAnimationFrame(f);}, stop(){run=false;cancelAnimationFrame(raf);}};}

const slides=[$('#s19')];let cur=0;function upd(){}
function setShown(el,n,fire){el._shown=n;$$('[data-step]',el).forEach(e=>e.classList.toggle('on',+e.dataset.step<=n));if(fire&&STEP[el.id])STEP[el.id](n);}
/* ---------- 19. slab sim ---------- */
(function(){
  const ca=$('#c19a'),ga=hd(ca,360,230,1.92),cb=$('#c19b'),gb=hd(cb,520,340,1.84),r=rng(19);
  const gal=[];
  for(let i=0;i<2600;i++){gal.push({ph:(r()-.5)*120,de:(r()-.5)*60,d:.58+gauss(r)*.018,w:true});}
  for(let i=0;i<1500;i++){gal.push({ph:(r()-.5)*120,de:(r()-.5)*60,d:Math.sqrt(r())*.98+.02,w:false});}
  for(let i=0;i<500;i++){const c=[[-30,12,.36],[20,-8,.8],[35,15,.45]][(r()*3)|0];gal.push({ph:c[0]+gauss(r)*4,de:c[1]+gauss(r)*3,d:c[2]+gauss(r)*.02,w:false});}
  let th=10;
  const OX=260,OY=325,R=300;
  function draw(){
    const half=th/2;
    ga.fillStyle=DARK;ga.fillRect(0,0,360,230);
    const sc=230/60;
    ga.fillStyle='rgba(250,204,21,.28)';ga.fillRect(0,115-half*sc,360,th*sc);
    ga.strokeStyle='rgba(250,204,21,.9)';ga.lineWidth=1.5;ga.strokeRect(0,115-half*sc,360,th*sc);
    gal.forEach((p,i)=>{if(i%3)return;const x=(p.ph+60)/120*360,y=115-p.de*sc;ga.fillStyle=p.w?'rgba(251,146,60,.6)':'rgba(226,232,240,.5)';ga.fillRect(x-1,y-1,2,2);});
    ga.fillStyle=TXT;ga.font=F(15);ga.fillText('적경 →',6,222);ga.fillText('적위 ↑',6,16);
    gb.fillStyle=DARK;gb.fillRect(0,0,520,340);gb.strokeStyle=GRID;gb.lineWidth=1.5;
    [.25,.5,.75,1].forEach(k=>{gb.beginPath();gb.arc(OX,OY,R*k,(-90-60)*Math.PI/180,(-90+60)*Math.PI/180);gb.stroke();});
    [-60,60].forEach(a=>{gb.beginPath();gb.moveTo(OX,OY);gb.lineTo(OX+Math.sin(a*Math.PI/180)*R,OY-Math.cos(a*Math.PI/180)*R);gb.stroke();});
    gb.fillStyle='#e2e8f0';gb.font=F(16);gb.fillText('관측자',OX-24,OY+12);
    let n=0;
    gal.forEach(p=>{if(Math.abs(p.de)>half)return;n++;const a=p.ph*Math.PI/180;const x=OX+Math.sin(a)*p.d*R,y=OY-Math.cos(a)*p.d*R;gb.fillStyle=p.w?'rgba(251,146,60,.9)':'rgba(226,232,240,.75)';gb.fillRect(x-1.2,y-1.2,2.4,2.4);});
    $('#n19').textContent=n.toLocaleString();$('#v19').textContent=th+'°';
  }
  $('#r19').oninput=e=>{th=+e.target.value;draw();};
  SIM.s19={start:draw,stop(){}};draw();
})();


window.STEP=STEP;const el=slides[0];if(SIM[el.id])SIM[el.id].start();
})();
</script>

    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
