<body>
<div id="presentation-wrapper">

<div class="slide sim-slide active" id="simF">
            <div class="ppt-title"><span class="sim-tag">시뮬레이션</span>빠르게 움직이는 은하들을 붙잡아 두려면?</div>
            <div class="ppt-subtitle" style="background-color:#eff6ff; border-left-color:#3b82f6; color:#1d4ed8;">은하들의 속도(관측값)는 그대로 두고, 은하단의 질량만 바꿔 봅시다.</div>

                <div class="sim-stage"><canvas id="cF" width="1160" height="900"></canvas></div>

                        츠비키가 관측한 은하들의 속도는 보이는 질량의 중력만으로는 붙잡을 수 없을 만큼 빨랐어요. → <b>보이지 않는 질량(암흑 물질)</b>이 필요!

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>


    /* ===================== 시뮬레이션 F: 은하단 속도 분산 ===================== */
    (function () {
        const c = document.getElementById('cF'), g = c.getContext('2d');
        const KS = 1.3; // 16:9 화면용으로 키운 캔버스에 맞춰 확대해서 그림
        const W = c.width / KS, H = c.height / KS, CX = W / 2, CY = H / 2, A = 70, RB = 250, GM1 = 712000 * 2.56 / 10;
        let mult = 10, gal = [], time = 0;
        function reset() {
            const r = SIM.rng(77); gal = []; time = 0;
            for (let i = 0; i < 60; i++) {
                const rad = A * Math.sqrt(Math.pow(r(), -2 / 3) - 1) * 0.55; const rr = Math.min(rad, 200);
                const an = r() * 6.283, x = Math.cos(an) * rr, y = Math.sin(an) * rr;
                const vc = Math.sqrt(GM1 * 10 * rr * rr / Math.pow(rr * rr + A * A, 1.5)) * (0.75 + r() * 0.35);
                const va = r() * 6.283;
                gal.push({ x: x, y: y, vx: Math.cos(va) * vc, vy: Math.sin(va) * vc, s: 4 + r() * 4, rot: r() * 3, trail: [] });
            }
        }
        function setM(m) {
            mult = +m; document.getElementById('rF').value = mult; document.getElementById('vF').textContent = '× ' + mult;
            document.querySelectorAll('#simF [data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === mult));
            reset();
        }
        document.querySelectorAll('#simF [data-m]').forEach(b => b.onclick = () => setM(b.dataset.m));
        document.getElementById('rF').oninput = e => setM(e.target.value);
        document.getElementById('bF').onclick = reset;
        reset();
        const bgs = []; { const r = SIM.rng(5); for (let i = 0; i < 150; i++) bgs.push([r() * W, r() * H, r() * 1.5 + .3]); }
        SIM.loop('simF', (t, dt) => {
            const GM = GM1 * mult, sub = 4, h = dt / sub; time += dt;
            for (let k = 0; k < sub; k++) gal.forEach(p => {
                const d2 = p.x * p.x + p.y * p.y + A * A, f = -GM / Math.pow(d2, 1.5);
                p.vx += f * p.x * h; p.vy += f * p.y * h; p.x += p.vx * h; p.y += p.vy * h;
            });
            g.setTransform(KS, 0, 0, KS, 0, 0);
            g.fillStyle = '#0f172a'; g.fillRect(0, 0, W, H);
            bgs.forEach(s => { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(s[0], s[1], s[2], s[2]); });
            // 암흑 물질 헤일로
            if (mult > 1) { const gr = g.createRadialGradient(CX, CY, 10, CX, CY, 290); gr.addColorStop(0, 'rgba(59,130,246,' + (0.45 * (mult - 1) / 9).toFixed(2) + ')'); gr.addColorStop(1, 'rgba(59,130,246,0)'); g.fillStyle = gr; g.beginPath(); g.arc(CX, CY, 290, 0, 7); g.fill(); }
            g.setLineDash([10, 10]); g.strokeStyle = '#475569'; g.lineWidth = 2; g.beginPath(); g.arc(CX, CY, RB, 0, 7); g.stroke(); g.setLineDash([]);
            let inside = 0;
            const blink = 0.5 + 0.5 * Math.sin(t * 0.012); // 경계 밖 은하 깜빡임
            gal.forEach(p => {
                const x = CX + p.x, y = CY + p.y, esc = Math.hypot(p.x, p.y) >= RB; if (!esc) inside++;
                p.trail.push([x, y]); if (p.trail.length > 40) p.trail.shift();
                g.strokeStyle = esc ? 'rgba(239,68,68,.45)' : 'rgba(250,204,21,.25)'; g.lineWidth = 2; g.beginPath(); p.trail.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke();
                if (esc) { g.strokeStyle = 'rgba(239,68,68,' + (0.3 + 0.7 * blink).toFixed(2) + ')'; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, p.s * 2.6 + 4 * blink, 0, 7); g.stroke(); }
                g.save(); g.translate(x, y); g.rotate(p.rot); const gr = g.createRadialGradient(0, 0, 0, 0, 0, p.s * 1.6);
                if (esc) { gr.addColorStop(0, 'rgba(255,255,255,' + (0.4 + 0.6 * blink).toFixed(2) + ')'); gr.addColorStop(.4, 'rgba(248,113,113,' + (0.4 + 0.6 * blink).toFixed(2) + ')'); gr.addColorStop(1, 'rgba(239,68,68,0)'); }
                else { gr.addColorStop(0, '#fff'); gr.addColorStop(.4, '#fde68a'); gr.addColorStop(1, 'rgba(250,204,21,0)'); }
                g.fillStyle = gr; g.scale(1.6, 0.7); g.beginPath(); g.arc(0, 0, p.s * 1.6, 0, 7); g.fill(); g.restore();
            });
            g.fillStyle = '#e2e8f0'; g.font = SIM.font(24); g.textAlign = 'left';
            g.fillText(mult === 1 ? '보이는 질량(은하+기체)만 있을 때' : (mult >= 10 ? '암흑 물질까지 포함한 질량' : '질량 × ' + mult), 24, 40);
            g.fillStyle = '#94a3b8'; g.font = SIM.font(20, false); g.fillText('점선 원 = 은하단의 경계', 24, 72);            document.getElementById('oF1').textContent = inside;
            document.getElementById('oF2').innerHTML = inside >= 55 ? '<span class="sim-ok">은하들이 은하단에 붙잡혀 있어요.</span>' : (inside > 35 ? '일부 은하가 탈출하고 있어요.' : '<b style="color:#dc2626">은하단이 흩어지고 있어요!</b>');
        });
    })();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  function sync(){ btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
