<div id="presentation-wrapper">
<div class="slide sim-slide active" id="d204_binary"><div class="ppt-title"><span class="sim-tag">시뮬레이션</span>쌍성의 질량을 직접 재 보기</div><div class="ppt-subtitle">두 별의 질량을 바꾸며 공전 모습을 관찰하고, 관측 자료로 질량을 구해 봐요.</div>

<div class="sim-row"><span class="lbl" style="width:150px">두 별 사이 거리</span><input type="range" class="sim-range" id="rA3" min="1" max="6" step="0.1" value="2"><span class="sim-val" id="vA3" style="min-width:90px"></span></div></div></div>

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>



/* ===== 쌍성 ===== */
(function(){
  const c=document.getElementById('cA'),g=c.getContext('2d'),W=1060,H=610,CX=380,CY=310;let S=80;
  let m1=1.5,m2=0.5,a=2,ph=0,mode='free',q=null,hist=[],tt=0;
  const P=()=>Math.sqrt(a*a*a/(m1+m2));
  function out(){const p=P(),a1=a*m2/(m1+m2),a2=a*m1/(m1+m2);
    ['vA1','vA2','vA3'].forEach((id,i)=>document.getElementById(id).textContent=[m1.toFixed(1),m2.toFixed(1),a.toFixed(1)+' AU'][i]);
    if(mode==='free'){document.getElementById('oA').innerHTML='<h4>관측 결과</h4><div>공전 주기 P = <b class="or">'+p.toFixed(2)+'년</b></div><div>a₁ = '+a1.toFixed(2)+' AU, a₂ = '+a2.toFixed(2)+' AU</div><div>m₁ + m₂ = a³/P² = <b>'+(a**3/(p*p)).toFixed(2)+'</b></div><div class="sim-note">무거운 별 A가 공통 질량 중심(+)에 더 가까이서 작은 원을 그려요.</div>';}
    else{document.getElementById('oA').innerHTML='<h4>관측 자료</h4><div>공전 주기 P = <b class="or">'+p.toFixed(1)+'년</b></div><div>a₁ = <b>'+a1.toFixed(2)+' AU</b>, a₂ = <b>'+a2.toFixed(2)+' AU</b></div><div style="margin-top:6px">질량 합 = <span class="blank" style="min-width:120px">'+(m1+m2).toFixed(1)+'</span></div><div>별 A = <span class="blank" style="min-width:100px">'+m1.toFixed(1)+'</span>, 별 B = <span class="blank" style="min-width:100px">'+m2.toFixed(1)+'</span></div><div class="sim-note">계산한 뒤 빈칸을 눌러 확인! (태양 질량 단위)</div>';
      document.querySelectorAll('#oA .blank').forEach(b=>b.onclick=()=>b.classList.toggle('on'));}}
  [['rA1',x=>m1=x],['rA2',x=>m2=x],['rA3',x=>a=x]].forEach(([id,f])=>document.getElementById(id).oninput=e=>{f(+e.target.value);hist=[];out();});
  document.querySelectorAll('#d204_binary [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#d204_binary [data-m]').forEach(x=>x.classList.toggle('on',x===b));
    if(mode==='quiz'){m1=Math.round((0.8+Math.random()*3)*10)/10;m2=Math.round((0.5+Math.random()*1.5)*10)/10;a=Math.round((1.5+Math.random()*3.5)*10)/10;document.getElementById('ctlA').style.display='none';}else{document.getElementById('ctlA').style.display='';}
    hist=[];out();});
  out();
  SIM.loop('d204_binary',(t,dt)=>{
    const p=P();ph+=dt*2*Math.PI/(p*1.6);
    S=Math.min(120,250/(a*Math.max(m1,m2)/(m1+m2)));const a1=a*m2/(m1+m2)*S,a2=a*m1/(m1+m2)*S;
    g.fillStyle='#0f172a';g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(148,163,184,.35)';g.lineWidth=1.5;g.setLineDash([5,6]);g.beginPath();g.arc(CX,CY,a1,0,7);g.stroke();g.beginPath();g.arc(CX,CY,a2,0,7);g.stroke();g.setLineDash([]);
    const x1=CX+a1*Math.cos(ph),y1=CY+a1*Math.sin(ph),x2=CX-a2*Math.cos(ph),y2=CY-a2*Math.sin(ph);
    g.strokeStyle='rgba(255,255,255,.3)';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    [[x1,y1,m1,'#93c5fd','A'],[x2,y2,m2,'#fdba74','B']].forEach(([x,y,m,col,n])=>{const r=10+Math.cbrt(m)*10,sg=g.createRadialGradient(x,y,1,x,y,r*1.6);sg.addColorStop(0,'#fff');sg.addColorStop(.5,col);sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.beginPath();g.arc(x,y,r*1.6,0,7);g.fill();g.fillStyle='#fff';g.font=SIM.font(20);g.textAlign='center';g.fillText(n,x,y-r-12);});
    g.strokeStyle='#facc15';g.lineWidth=3;g.beginPath();g.moveTo(CX-10,CY);g.lineTo(CX+10,CY);g.moveTo(CX,CY-10);g.lineTo(CX,CY+10);g.stroke();
    // 시선 속도 그래프
    const vx1=Math.cos(ph)*a1,vx2=-Math.cos(ph)*a2;hist.push([vx1,vx2]);if(hist.length>360)hist.shift();
    const gx=760,gy=60,gw=270,gh=220;g.fillStyle='rgba(15,23,42,.9)';g.fillRect(gx-10,gy-36,gw+20,gh+60);g.strokeStyle='#475569';g.strokeRect(gx,gy,gw,gh);g.fillStyle='#cbd5e1';g.font=SIM.font(17);g.textAlign='left';g.fillText('시선 속도 변화 (도플러 효과)',gx,gy-12);
    const mx=Math.max(a1,a2,40);[[0,'#93c5fd'],[1,'#fdba74']].forEach(([k,col])=>{g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();hist.forEach((h,i)=>{const x=gx+i/360*gw,y=gy+gh/2-h[k]/mx*gh*0.45;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();});
    g.fillStyle='#94a3b8';g.font=SIM.font(16,false);g.fillText('진폭이 클수록 가벼운 별 (더 빠름)',gx,gy+gh+22);
    g.fillStyle='#e2e8f0';g.font=SIM.font(18);g.textAlign='left';g.fillText('+ 공통 질량 중심',CX-60,CY+40);
    g.strokeStyle='#64748b';g.lineWidth=2;g.beginPath();g.moveTo(40,H-40);g.lineTo(40+S,H-40);g.stroke();g.fillStyle='#94a3b8';g.fillText('1 AU',40,H-50);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
