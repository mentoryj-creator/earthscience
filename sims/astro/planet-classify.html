<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });

  const Q=['태양 주위를 직접 공전하나요?','충분히 커서 구에 가까운 모양인가요?','궤도 주변을 청소했나요?'];
  let i=0,ans=[null,null,null];
  function rock(cx,cy,r,col,seed){const rr=SIM.rng(seed);g.fillStyle=col;g.beginPath();for(let k=0;k<=24;k++){const a=k/24*6.283,q=r*(0.6+0.4*rr())*(k%2?1:0.9);const x=cx+Math.cos(a)*q*1.5,y=cy+Math.sin(a)*q*0.75;k?g.lineTo(x,y):g.moveTo(x,y);}g.fill();}
  function draw(){const o=OBJ[i];g.fillStyle='#0f172a';g.fillRect(0,0,W,H);const r=SIM.rng(1);for(let k=0;k<120;k++){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(r()*W,r()*H,1.5,1.5);}
    const cx=380,cy=270;
    if(o.shape===1)rock(cx,cy,o.r,o.col,i+3);
    else if(o.shape===2){const gr=g.createLinearGradient(cx,cy,cx+340,cy-160);gr.addColorStop(0,'rgba(186,230,253,.8)');gr.addColorStop(1,'rgba(186,230,253,0)');g.fillStyle=gr;g.beginPath();g.moveTo(cx,cy-30);g.lineTo(cx+360,cy-200);g.lineTo(cx+380,cy-120);g.lineTo(cx,cy+30);g.fill();rock(cx,cy,o.r*0.5,'#94a3b8',9);const cg=g.createRadialGradient(cx,cy,5,cx,cy,90);cg.addColorStop(0,'rgba(224,242,254,.6)');cg.addColorStop(1,'rgba(224,242,254,0)');g.fillStyle=cg;g.beginPath();g.arc(cx,cy,90,0,7);g.fill();}
    else{const gr=g.createRadialGradient(cx-o.r*0.3,cy-o.r*0.3,o.r*0.1,cx,cy,o.r);gr.addColorStop(0,'#fff');gr.addColorStop(0.25,o.col);gr.addColorStop(1,'#1e293b');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,o.r,0,7);g.fill();if(o.band){g.save();g.beginPath();g.arc(cx,cy,o.r,0,7);g.clip();[[-50,14],[-15,10],[20,16],[55,10]].forEach(([y,h])=>{g.fillStyle='rgba(146,64,14,.45)';g.fillRect(cx-o.r,cy+y,o.r*2,h);});g.restore();}}
    g.fillStyle='#fff';g.font=SIM.font(40);g.textAlign='center';g.fillText(o.n,cx,500);g.fillStyle='#cbd5e1';g.font=SIM.font(24,false);g.fillText(o.d,cx,545);g.fillStyle='#64748b';g.font=SIM.font(18,false);g.fillText((i+1)+' / '+OBJ.length,cx,40);}
  function out(){const o=OBJ[i];document.getElementById('hA').textContent='세 가지 조건 확인';
    document.getElementById('qA').innerHTML=Q.map((q,k)=>'<div class="sim-row" style="font-size:25px;justify-content:space-between"><span>'+(k+1)+'. '+q+'</span><span><button class="sim-btn'+(ans[k]===1?' on':'')+'" data-q="'+k+'" data-v="1" style="padding:4px 18px">예</button> <button class="sim-btn'+(ans[k]===0?' on':'')+'" data-q="'+k+'" data-v="0" style="padding:4px 18px">아니요</button></span></div>').join('');
    document.querySelectorAll('#qA button').forEach(b=>b.onclick=()=>{ans[+b.dataset.q]=+b.dataset.v;out();});
    let h;if(ans.includes(null))h='<div class="sim-note">세 질문에 모두 답하면 분류 결과가 나와요.</div>';
    else{const ok=ans.every((v,k)=>v===o.a[k]);let guess=ans[0]===0?'위성':(ans[1]&&ans[2]?'행성':(ans[1]?'왜소 행성':'소행성 또는 혜성'));
      h=(ok?'<div class="sim-ok" style="font-size:30px">✔ 정답이에요!</div>':'<div style="color:#dc2626;font-weight:bold;font-size:28px">다시 생각해 볼까요?</div>')+'<div>분류: <span class="sim-big" style="font-size:36px">'+(ok?o.ans:guess)+'</span></div>'+(ok&&o.ans==='혜성'?'<div class="sim-note">얼음과 먼지로 이뤄져 꼬리가 생기면 혜성!</div>':'')+(ok?'':'<div class="sim-note">'+o.n+'의 특징을 다시 읽어 보세요.</div>');}
    document.getElementById('oA').innerHTML=h;draw();}
  document.getElementById('bA1').onclick=()=>{i=(i+OBJ.length-1)%OBJ.length;ans=[null,null,null];out();};
  document.getElementById('bA2').onclick=()=>{i=(i+1)%OBJ.length;ans=[null,null,null];out();};
  out();
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
