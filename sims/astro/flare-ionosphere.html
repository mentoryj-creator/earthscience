<style id="standalone">

<body>
<div id="presentation-wrapper">
<div class="slide sim-slide active" id="d102_iono"><div class="ppt-title"><span class="sim-tag">시뮬레이션</span>태양 플레어가 터지면 통신은?</div><div class="ppt-subtitle">플레어 전후로 전파가 전리층에서 어떻게 달라지는지 비교해 봐요.</div>
<div class="sim-wrap"><div class="sim-stage"><canvas id="cB" width="1060" height="610"></canvas></div>
<div class="sim-panel"><div class="sim-box blue"><h4>태양 활동</h4>
<div class="sim-btns"><button class="sim-btn on" data-f="0">평상시</button><button class="sim-btn orange" data-f="1">태양 플레어 발생!</button></div>
<div class="sim-row"><span class="lbl" style="width:170px">전리층 교란</span><input type="range" class="sim-range" id="rB" min="0" max="1" step="0.01" value="0"><span class="sim-val" id="vB" style="min-width:100px"></span></div></div>
<div class="sim-box" id="oB" style="font-size:27px"></div></div></div></div>
</div>
<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>



/* ===== 전리층과 통신 ===== */
(function(){
  const c=document.getElementById('cB'),g=c.getContext('2d'),W=1060,H=610;
  let d=0,target=0,ph=0;
  function out(){document.getElementById('vB').textContent=Math.round(d*100)+'%';document.getElementById('rB').value=d;
    const sig=Math.max(0,1-d*1.05),err=1+d*35;
    document.getElementById('oB').innerHTML='<h4>통신 상태</h4><div>단파 통신 수신 세기: <b class="'+(sig<0.4?'':'or')+'" style="'+(sig<0.4?'color:#dc2626':'')+'">'+Math.round(sig*100)+'%</b></div><div>GPS 위치 오차: <span class="sim-big" style="font-size:34px">약 '+err.toFixed(0)+' m</span></div><div class="sim-note">'+(d>0.5?'D층이 짙어져 단파가 흡수돼요 (델린저 현상). GPS 신호도 굴절·지연돼요.':'전파가 F층에서 반사되어 멀리까지 전달돼요.')+'</div>';
    document.querySelectorAll('#d102_iono [data-f]').forEach(b=>b.classList.toggle('on',(+b.dataset.f===1)===(target>0.5)));}
  document.querySelectorAll('#d102_iono [data-f]').forEach(b=>b.onclick=()=>{target=+b.dataset.f*0.95;out();});
  document.getElementById('rB').oninput=e=>{d=target=+e.target.value;out();};out();
  SIM.loop('d102_iono',(t,dt)=>{
    if(Math.abs(d-target)>0.005){d+=(target-d)*Math.min(1,dt*2);out();}
    ph+=dt;
    const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#020617');sk.addColorStop(1,'#1e3a8a');g.fillStyle=sk;g.fillRect(0,0,W,H);
    // 층
    const lay=[['F층',150,'rgba(167,139,250,.25)'],['E층',250,'rgba(96,165,250,.2)'],['D층',320,'rgba(251,146,60,'+(0.12+d*0.55)+')']];
    lay.forEach(([n,y,col])=>{g.fillStyle=col;g.fillRect(0,y-22,W,44);g.fillStyle='#e2e8f0';g.font=SIM.font(19);g.fillText(n,W-70,y+6);});
    g.fillStyle='#166534';g.beginPath();g.ellipse(W/2,H+760,W*1.1,880,0,0,7);g.fill();
    // 태양 플레어 표시
    if(d>0.05){g.fillStyle='rgba(253,224,71,'+d+')';g.font=SIM.font(22);g.fillText('☀ 플레어의 X선이 D층을 강하게 이온화!',20,40);}
    // 단파 경로
    const tx=[120,520],rx=[560,520],top=[340,150];const sig=Math.max(0,1-d*1.05);
    const P=[tx,top,rx];g.strokeStyle='rgba(250,204,21,.25)';g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.moveTo(...tx);g.lineTo(...top);g.lineTo(...rx);g.stroke();g.setLineDash([]);
    for(let k=0;k<6;k++){let f=((ph*0.45+k/6)%1);let x,y,a=1;if(f<0.5){const u=f*2;x=tx[0]+(top[0]-tx[0])*u;y=tx[1]+(top[1]-tx[1])*u;if(y<342&&y>298)a=1;if(y<298)a=sig;}else{const u=(f-0.5)*2;x=top[0]+(rx[0]-top[0])*u;y=top[1]+(rx[1]-top[1])*u;a=y>298?sig*sig:sig;}

    g.fillStyle='#334155';g.fillRect(rx[0]-40,rx[1]-90,80,14);g.fillStyle=sig>0.4?'#4ade80':'#ef4444';g.fillRect(rx[0]-40,rx[1]-90,80*sig,14);

    const gx=850,gy=60;g.fillStyle='#cbd5e1';g.fillRect(gx-14,gy-8,28,16);g.fillStyle='#60a5fa';g.fillRect(gx-44,gy-4,26,8);g.fillRect(gx+18,gy-4,26,8);g.fillText('GPS 위성',gx,gy+34);
    const cx=880,cy=500;g.strokeStyle='rgba(96,165,250,.8)';g.lineWidth=2;g.beginPath();g.moveTo(gx,gy+10);g.lineTo(gx+(cx-gx)*0.42,320);g.lineTo(cx+d*40,cy-20);g.stroke();
    g.fillStyle='#f8fafc';g.fillRect(cx-22,cy-12,44,22);g.fillText('자동차',cx,cy+36);
    const er=6+d*60;g.strokeStyle='#f87171';g.lineWidth=3;g.setLineDash([5,5]);g.beginPath();g.arc(cx,cy,er,0,7);g.stroke();g.setLineDash([]);g.fillStyle='#fca5a5';g.fillText('위치 오차 범위',cx,cy-er-10);g.textAlign='left';

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
