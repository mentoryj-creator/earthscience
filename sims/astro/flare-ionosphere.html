<div class="sim-box key" style="font-size:24px"><h4>GPS는 어떻게 위치를 찾을까?</h4>위성 <b>4개 이상</b>이 보낸 신호의 도착 시간으로 각 위성까지의 <b>거리</b>를 구하고, 그 거리 원들이 만나는 점을 내 위치로 정해요. (3개는 위치, 1개는 수신기 시계 보정) 플레어로 전리층이 교란되면 신호가 <b>늦게 도착</b>해 거리가 틀려지고, 원들이 한 점에서 만나지 않아 <b>오차 범위가 넓어져요</b>.</div></div>

<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });

<script>



/* ===== 전리층과 통신 ===== */
(function(){
  const c=document.getElementById('cB'),g=c.getContext('2d'),W=c.width,H=c.height,GND=640;
  let d=0,target=0,ph=0,hist=[],acc=0,rms=1;
  // GPS 위성 4개: 옆에서 본 위치, 위에서 본 방향(방위각), 고도각(낮을수록 전리층을 비스듬히 오래 지남)
  const SAT=[{x:650,y:80,az:-2.4,el:35,col:'#f472b6'},{x:790,y:44,az:-0.6,el:70,col:'#60a5fa'},{x:960,y:60,az:0.9,el:55,col:'#4ade80'},{x:1110,y:100,az:2.6,el:28,col:'#facc15'}];
  SAT.forEach((s,i)=>{s.k=1/Math.sin(s.el*Math.PI/180);s.w=0.7+i*0.37;s.f=i*1.9;s.u=[Math.cos(s.az),Math.sin(s.az)];});
  const CAR=[880,GND],MAP={x:600,y:662,w:540,h:226},MC=[870,775],SC=2.2; // 지도: 1 m = 2.2 px
  const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*Math.random());};
  // 위성까지 거리 오차(m): 전리층 지연 × 비스듬함 + 잡음
  const errs=t=>SAT.map(s=>(2.6+d*27)*s.k*(0.55+0.45*Math.sin(t*s.w+s.f))+(0.4+d*4)*gauss());
  // 최소제곱: e_i = -u_i·p + b (p: 위치 오차, b: 수신기 시계 오차) → 위성 4개로 미지수 3개를 구함
  function solve(e){const A=SAT.map(s=>[-s.u[0],-s.u[1],1]),M=[[0,0,0],[0,0,0],[0,0,0]],v=[0,0,0];
    A.forEach((a,i)=>{for(let r=0;r<3;r++){v[r]+=a[r]*e[i];for(let q=0;q<3;q++)M[r][q]+=a[r]*a[q];}});
    const det=m=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]),D=det(M);
    return [0,1,2].map(k=>det(M.map((row,r)=>row.map((x,q)=>q===k?v[r]:x)))/D);}
  let E=errs(0),X=solve(E);
  function out(){document.getElementById('vB').textContent=Math.round(d*100)+'%';document.getElementById('rB').value=d;
    const sig=Math.max(0,1-d*1.05),R=rms*1.6;
    document.getElementById('oB').innerHTML='<h4>통신 상태</h4><div>단파 통신 수신 세기: <b class="'+(sig<0.4?'':'or')+'" style="'+(sig<0.4?'color:#dc2626':'')+'">'+Math.round(sig*100)+'%</b></div><div>GPS 위치 오차 범위: <span class="sim-big" style="font-size:34px">약 '+(R<10?R.toFixed(1):R.toFixed(0))+' m</span></div><div class="sim-note">'+(d>0.5?'D층이 짙어져 단파가 흡수돼요 (델린저 현상). GPS 신호는 전리층에서 늦어져 위성까지의 거리가 틀리게 계산돼요.':'단파는 F층에서 반사되어 멀리 전달되고, GPS 거리 원 4개가 거의 한 점에서 만나요.')+'</div>';
    document.querySelectorAll('#d102_iono [data-f]').forEach(b=>b.classList.toggle('on',(+b.dataset.f===1)===(target>0.5)));}
  document.querySelectorAll('#d102_iono [data-f]').forEach(b=>b.onclick=()=>{target=+b.dataset.f*0.95;hist=[];out();});
  document.getElementById('rB').oninput=e=>{d=target=+e.target.value;out();};out();
  SIM.loop('d102_iono',(t,dt)=>{
    if(Math.abs(d-target)>0.005){d+=(target-d)*Math.min(1,dt*2);}
    ph+=dt;acc+=dt;
    if(acc>0.12){acc=0;E=errs(ph);X=solve(E);hist.push([X[0],X[1]]);if(hist.length>45)hist.shift();
      const m=Math.sqrt(hist.reduce((a,p)=>a+p[0]*p[0]+p[1]*p[1],0)/hist.length);rms+=(m-rms)*0.25;out();}
    const sk=g.createLinearGradient(0,0,0,GND);sk.addColorStop(0,'#020617');sk.addColorStop(1,'#1e3a8a');g.fillStyle=sk;g.fillRect(0,0,W,H);
    // 전리층
    const lay=[['F층',170,'rgba(167,139,250,.25)'],['E층',280,'rgba(96,165,250,.2)'],['D층',360,'rgba(251,146,60,'+(0.12+d*0.55)+')']];
    lay.forEach(([n,y,col])=>{g.fillStyle=col;g.fillRect(0,y-24,W,48);g.fillStyle='#e2e8f0';g.font=SIM.font(20);g.textAlign='left';g.fillText(n,14,y+7);});
    g.fillStyle='#166534';g.fillRect(0,GND,W,H-GND);g.fillStyle='#14532d';g.fillRect(0,GND,W,6);
    if(d>0.05){g.fillStyle='rgba(253,224,71,'+d+')';g.font=SIM.font(24);g.textAlign='left';g.fillText('☀ 플레어의 X선이 D층을 강하게 이온화!',80,40);}
    // 단파 통신
    const tx=[110,GND],rx=[500,GND],top=[305,170],sig=Math.max(0,1-d*1.05);
    g.strokeStyle='rgba(250,204,21,.25)';g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.moveTo(...tx);g.lineTo(...top);g.lineTo(...rx);g.stroke();g.setLineDash([]);
    for(let k=0;k<6;k++){const f=(ph*0.45+k/6)%1;let x,y,a=1;if(f<0.5){const u=f*2;x=tx[0]+(top[0]-tx[0])*u;y=tx[1]+(top[1]-tx[1])*u;if(y<336)a=sig;}else{const u=(f-0.5)*2;x=top[0]+(rx[0]-top[0])*u;y=top[1]+(rx[1]-top[1])*u;a=y>336?sig*sig:sig;}
      if(a>0.02){g.fillStyle='rgba(250,204,21,'+a+')';g.beginPath();g.arc(x,y,8,0,7);g.fill();}}
    g.fillStyle='#e2e8f0';g.fillRect(tx[0]-6,tx[1]-60,12,60);g.fillRect(rx[0]-6,rx[1]-60,12,60);g.font=SIM.font(20);g.textAlign='center';g.fillText('단파 송신소',tx[0],tx[1]+30);g.fillText('수신소',rx[0],rx[1]+30);
    g.fillStyle='#334155';g.fillRect(rx[0]-44,rx[1]-100,88,14);g.fillStyle=sig>0.4?'#4ade80':'#ef4444';g.fillRect(rx[0]-44,rx[1]-100,88*sig,14);
    // GPS 위성 4개 → 자동차 (전리층을 지나며 늦어짐)
    SAT.forEach((s,i)=>{g.strokeStyle=s.col;g.globalAlpha=.55;g.lineWidth=2;g.beginPath();g.moveTo(s.x,s.y+10);g.lineTo(CAR[0],CAR[1]-14);g.stroke();g.globalAlpha=1;
      for(let k=0;k<3;k++){const f=(ph*0.35+k/3+i*0.13)%1,y0=s.y+10,y1=CAR[1]-14,y=y0+(y1-y0)*f,inI=y>146&&y<384,x=s.x+(CAR[0]-s.x)*(y-y0)/(y1-y0);
        g.fillStyle=inI&&d>0.3?'#fb923c':s.col;g.beginPath();g.arc(x,y,inI?4+d*3:4,0,7);g.fill();}
      g.fillStyle='#cbd5e1';g.fillRect(s.x-12,s.y-7,24,14);g.fillStyle=s.col;g.fillRect(s.x-38,s.y-4,22,8);g.fillRect(s.x+16,s.y-4,22,8);
      g.font=SIM.font(17);g.textAlign='center';g.fillText('GPS '+(i+1),s.x,s.y-14);});
    g.fillStyle='#f8fafc';g.fillRect(CAR[0]-24,CAR[1]-16,48,16);g.fillStyle='#0f172a';g.beginPath();g.arc(CAR[0]-13,CAR[1],5,0,7);g.arc(CAR[0]+13,CAR[1],5,0,7);g.fill();
    g.fillStyle='#fff';g.font=SIM.font(18);g.fillText('자동차',CAR[0]+62,CAR[1]-8);
    // 위에서 본 지도: 위성마다 '거리 원'(호) → 만나는 점이 GPS가 계산한 위치
    g.save();g.fillStyle='#e7e5e4';g.fillRect(MAP.x,MAP.y,MAP.w,MAP.h);g.beginPath();g.rect(MAP.x,MAP.y,MAP.w,MAP.h);g.clip();
    g.fillStyle='#fff';g.fillRect(MAP.x,MC[1]-14,MAP.w,28);g.fillRect(MC[0]-14,MAP.y,28,MAP.h);g.strokeStyle='#fbbf24';g.lineWidth=2;g.setLineDash([12,10]);g.beginPath();g.moveTo(MAP.x,MC[1]);g.lineTo(MAP.x+MAP.w,MC[1]);g.stroke();g.setLineDash([]);
    const b=X[2],DP=1400;
    SAT.forEach((s,i)=>{const cx=MC[0]+DP*s.u[0],cy=MC[1]+DP*s.u[1],r=DP+(E[i]-b)*SC,a0=Math.atan2(-s.u[1],-s.u[0]);g.strokeStyle=s.col;g.lineWidth=3;g.beginPath();g.arc(cx,cy,Math.max(1,r),a0-0.14,a0+0.14);g.stroke();});
    const R=rms*1.6*SC;g.fillStyle='rgba(239,68,68,.12)';g.strokeStyle='#dc2626';g.lineWidth=2.5;g.setLineDash([6,5]);g.beginPath();g.arc(MC[0],MC[1],Math.max(6,R),0,7);g.fill();g.stroke();g.setLineDash([]);
    hist.forEach((p,i)=>{g.fillStyle='rgba(220,38,38,'+(0.2+0.6*i/hist.length)+')';g.beginPath();g.arc(MC[0]+p[0]*SC,MC[1]+p[1]*SC,3,0,7);g.fill();});
    g.fillStyle='#0f172a';g.fillRect(MC[0]-9,MC[1]-5,18,10);
    g.restore();
    g.strokeStyle='#94a3b8';g.lineWidth=2;g.strokeRect(MAP.x,MAP.y,MAP.w,MAP.h);
    g.fillStyle='rgba(15,23,42,.85)';g.fillRect(MAP.x,MAP.y,250,30);g.fillStyle='#fff';g.font=SIM.font(17);g.textAlign='left';g.fillText('위에서 본 자동차 주변 (확대)',MAP.x+8,MAP.y+21);
    g.fillStyle='#b91c1c';g.font=SIM.font(18);g.textAlign='right';g.fillText('빨간 점 = GPS가 계산한 위치',MAP.x+MAP.w-8,MAP.y+MAP.h-30);g.fillText('색깔 호 = 위성까지의 거리',MAP.x+MAP.w-8,MAP.y+MAP.h-8);
    g.textAlign='left';g.fillStyle='#e2e8f0';g.font=SIM.font(17);g.fillText('지도 축척',MAP.x-140,MAP.y+MAP.h-44);g.fillRect(MAP.x-140,MAP.y+MAP.h-34,10*SC,4);g.fillText('10 m',MAP.x-140,MAP.y+MAP.h-8);
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  /* 휴대폰·태블릿: 전체화면이 되면 가로 화면으로 고정 (지원하는 기기만) */
  function land(){ try { var o = screen.orientation; if (!o) return; if (document.fullscreenElement || document.webkitFullscreenElement) { if (o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function(){}); } } else if (o.unlock) o.unlock(); } catch(e){} }
  function sync(){ land(); btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
<!--pem:start--><script id="pem-kit">
/* ===== 예측 → 실험 → 미션 도구 (_도구/pem.js가 넣음 — 직접 고치지 마세요) ===== */
Object.assign(window.SIM = window.SIM || {}, {
  val(id) { return +document.getElementById(id).value; },
  set(id, v) { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); e.dispatchEvent(new Event('change', { bubbles: true })); },
  text(sel) { const e = document.querySelector(sel); return e ? e.textContent : ''; },
  num(sel) { const m = SIM.text(sel).replace(/−/g, '-').match(/-?\d+(\.\d+)?/); return m ? +m[0] : NaN; },
  click(sel) { const e = document.querySelector(sel); e && e.click(); },
  toast(text, kind, ms) {
    const stage = document.querySelector('.slide.active .sim-stage') || document.getElementById('presentation-wrapper');
    let t = stage.querySelector(':scope > .sim-toast');
    if (!t) { t = document.createElement('div'); t.className = 'sim-toast'; stage.appendChild(t); }
    t.textContent = text; t.className = 'sim-toast ' + (kind || '');
    void t.offsetWidth; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2600);
  },
  burst() {
    const stage = document.querySelector('.slide.active .sim-stage'); if (!stage) return;
    const cols = ['#22c55e', '#3b82f6', '#f59e0b', '#ec4899', '#a855f7'];
    for (let i = 0; i < 26; i++) {
      const b = document.createElement('i'); b.className = 'sim-burst';
      b.style.left = '50%'; b.style.top = '60px'; b.style.background = cols[i % cols.length];
      const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      b.style.setProperty('--dx', Math.cos(a) * r + 'px'); b.style.setProperty('--dy', Math.sin(a) * r * 0.7 + 120 + 'px');
      stage.appendChild(b); setTimeout(() => b.remove(), 1200);
    }
  },
  tabs(root) {
    root = root || document;
    const tabs = [...root.querySelectorAll('.sim-tab')], pages = [...root.querySelectorAll('.sim-tabpage')];
    const show = name => {
      tabs.forEach(t => { t.classList.toggle('on', t.dataset.tab === name); t.setAttribute('aria-selected', t.dataset.tab === name); });
      pages.forEach(p => p.classList.toggle('on', p.dataset.page === name));
    };
    tabs.forEach(t => { t.setAttribute('role', 'tab'); t.onclick = () => { t.classList.remove('nudge'); show(t.dataset.tab); }; });
    const first = tabs.find(t => t.classList.contains('on')) || tabs[0];
    if (first) show(first.dataset.tab);
    SIM.showTab = show; return show;
  },
  predict(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    let picked = -1, revealed = false;
    el.innerHTML = `<div class="predict-q"><span class="tag">예측</span>${o.q}</div>
      <div class="predict-opts">${o.options.map((t, i) => `<button type="button" class="predict-opt" data-i="${i}"><span class="n">${'ABCDEF'[i]}</span><span>${t}</span></button>`).join('')}</div>
      <div class="predict-go" hidden><div class="sim-note" style="margin-bottom:8px">좋아요! 이제 실험해서 확인해 봐요.</div>
        <div class="sim-btns"><button type="button" class="sim-btn on" data-act="go">② 실험하러 가기 →</button><button type="button" class="sim-btn orange" data-act="show">✔ 정답 확인</button></div></div>
      <div class="predict-result" hidden></div>`;
    const opts = [...el.querySelectorAll('.predict-opt')];
    const reveal = () => {
      if (revealed || picked < 0) return; revealed = true;
      opts.forEach((b, i) => { b.disabled = true; b.classList.toggle('right', i === o.answer); b.classList.toggle('wrong', i === picked && i !== o.answer); });
      const ok = picked === o.answer, r = el.querySelector('.predict-result');
      r.hidden = false; r.classList.toggle('miss', !ok);
      r.innerHTML = (ok ? '<b>예측 성공!</b> ' : `<b>정답은 ${'ABCDEF'[o.answer]}</b> — `) + (o.why || '');
      el.querySelector('.predict-go').hidden = true;
      SIM.toast(ok ? '예측 성공!' : '예측과 결과가 달라요. 까닭을 확인해 봐요', ok ? '' : 'warn');
      if (ok) SIM.burst();
      const tab = document.querySelector('.sim-tab[data-tab="predict"]');
      if (tab) { tab.classList.add('nudge'); const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge ' + (ok ? 'done' : ''); b.textContent = ok ? '✓' : '!'; }
    };
    opts.forEach((b, i) => b.onclick = () => {
      if (revealed) return;
      picked = i; opts.forEach(x => x.classList.toggle('picked', x === b));
      el.querySelector('.predict-go').hidden = false;
    });
    el.querySelector('[data-act="go"]').onclick = () => { o.setup && o.setup(); SIM.showTab && SIM.showTab('lab'); };
    el.querySelector('[data-act="show"]').onclick = reveal;
    let armed = false;
    if (o.reached) SIM._checks.push(() => {
      if (picked < 0 || revealed) return;
      let r = false; try { r = o.reached(); } catch (e) {}
      if (!r) armed = true; else if (armed) reveal();
    });
    return { reveal };
  },
  missions(o) {
    const el = typeof o.el === 'string' ? document.querySelector(o.el) : o.el;
    const done = o.items.map(() => false);
    el.innerHTML = `<div class="mission-bar"><i></i></div>
      <ul class="mission-list">${o.items.map(m => `<li><span class="ck">✓</span><span>${m.t}${m.hint ? `<span class="hint">${m.hint}</span>` : ''}</span></li>`).join('')}</ul>
      <div class="mission-all" hidden>모든 미션 달성!</div>`;
    const lis = [...el.querySelectorAll('li')], tab = document.querySelector('.sim-tab[data-tab="mission"]');
    const badge = () => {
      const n = done.filter(Boolean).length;
      el.querySelector('.mission-bar i').style.width = (n / done.length * 100) + '%';
      el.querySelector('.mission-all').hidden = n < done.length;
      if (tab) { const b = tab.querySelector('.badge') || tab.appendChild(document.createElement('span')); b.className = 'badge' + (n === done.length ? ' done' : ''); b.textContent = n + '/' + done.length; }
    };
    const mark = i => {
      if (done[i]) return; done[i] = true; lis[i].classList.add('done');
      badge(); SIM.burst();
      const txt = lis[i].querySelector('span:not(.ck)').cloneNode(true); txt.querySelectorAll('.hint').forEach(h => h.remove());
      const t = txt.textContent.trim();
      SIM.toast(done.every(Boolean) ? '모든 미션 달성!' : '미션 달성! ' + (t.length > 24 ? t.slice(0, 23) + '…' : t));
      if (tab) tab.classList.add('nudge');
    };
    // 처음부터 맞아 있던 조건은 세지 않음 (한 번 벗어났다가 다시 맞춰야 달성)
    const armed = o.items.map(() => false);
    SIM._checks.push(() => o.items.forEach((m, i) => {
      if (done[i]) return;
      let ok = false; try { ok = !!m.test(); } catch (e) {}
      if (!ok) armed[i] = true; else if (armed[i]) mark(i);
    }));
    badge();
    return { mark, done };
  },
  _checks: [],
});
setInterval(() => SIM._checks.forEach(f => f()), 250);
</script>
<script id="pem-cfg">
(function(){
// 1.02 플레어와 전리층 — 상태: rB 전리층 교란, #oB 단파 수신 세기(%)·GPS 오차(m)
const sig = () => { const m = SIM.text('#oB').match(/수신 세기: (\d+)%/); return m ? +m[1] : NaN; };
const err = () => { const m = SIM.text('#oB').match(/약 ([\d.]+) m/); return m ? +m[1] : NaN; };
SIM.predict({ el: '#predictBox',
  q: '<b>태양 플레어</b>가 일어나 전리층이 교란되면 GPS 위치 오차는 어떻게 될까요?',
  options: ['커진다', '작아진다', '변하지 않는다'],
  answer: 0,
  why: '교란된 전리층을 지나며 GPS 신호가 <b>늦게 도착</b>해 위성까지의 거리가 틀려져요. 거리 원들이 한 점에서 만나지 않아 <b>오차 범위가 넓어져요</b>.',
  setup: () => SIM.set('rB', 0),
  reached: () => SIM.val('rB') >= 0.8 });
SIM.missions({ el: '#missionBox', items: [
  { t: '단파 통신 수신 세기를 <b>30% 아래</b>로 떨어뜨려 보세요 (델린저 현상).', test: () => sig() < 30 },
  { t: 'GPS 위치 오차 범위를 <b>20 m 이상</b>으로 만들어 보세요.', test: () => err() >= 20 },
  { t: '평상시로 돌아가 GPS 거리 원 4개가 <b>거의 한 점</b>에서 만나게 해 보세요.', hint: '전리층 교란을 0으로', test: () => SIM.val('rB') === 0 },
] });

SIM.tabs();
})();
</script>
<script id="pem-pop">
/* 미션: 버튼 → 팝업 · 모두 달성하면 폭죽 */
(function(){
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script><!--pem:end-->
