<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케플러 제2법칙</title>
<style>
  /* ---- 단독 시뮬레이션 공통 규칙 (사이트 안 틀과 수업 모드에 맞춤) ---- */
  html, body { margin: 0; background: #0b1020; color: #e8ebf1;
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif; }
  .wrap { padding: 12px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; touch-action: none; }
  .fs body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .fs canvas { height: calc(100vh - 90px); object-fit: contain; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: center; padding: 12px 4px 2px; font-size: 15px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 170px; accent-color: #6c9bff; }
  .readout { color: #9fc0ff; min-width: 3.5em; font-variant-numeric: tabular-nums; }
  .btn { font: inherit; cursor: pointer; border: none; background: #2563eb; color: #fff; padding: 7px 16px; border-radius: 8px; }
  .btn.ghost { background: transparent; color: #cfd8ea; border: 1px solid #3a4560; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="sim" width="900" height="540"></canvas>
  <div class="controls">
    <button class="btn" id="playBtn">⏸ 정지</button>
    <label>이심률 e
      <input type="range" id="eSlider" min="0" max="0.8" step="0.01" value="0.5">
      <span class="readout" id="eOut"></span>
    </label>
    <label>속도
      <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1">
    </label>
    <label><input type="checkbox" id="showArea" checked> 같은 시간 동안 쓸고 간 면적</label>
  </div>
</div>

<script>
// ============================================================
//  케플러 제2법칙 시뮬레이션
//  케플러 방정식 M = E - e·sinE 를 풀어 '시간 → 위치'를 정확히 계산합니다.
// ============================================================
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const eSlider = document.getElementById('eSlider');
const eOut = document.getElementById('eOut');
const speedSlider = document.getElementById('speedSlider');
const showArea = document.getElementById('showArea');
const playBtn = document.getElementById('playBtn');

const A = 210;            // 긴반지름 (화면 픽셀)
const N = 12;             // 한 주기를 나눌 구간 수
const CY = 280;
let t = 0;                // 0~1 : 한 주기 중 지난 시간 비율
let playing = true;

// 케플러 방정식 풀이 (뉴턴법)
function solveE(M, e) {
  let E = e < 0.8 ? M : Math.PI;
  for (let i = 0; i < 12; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}

// 시간 비율 → 화면 좌표
function posAt(frac, e, sun) {
  const B = A * Math.sqrt(1 - e * e);
  const E = solveE(2 * Math.PI * frac, e);
  return { x: sun.x + A * (Math.cos(E) - e), y: sun.y - B * Math.sin(E), E };
}

function draw() {
  const e = parseFloat(eSlider.value);
  const B = A * Math.sqrt(1 - e * e);
  const sun = { x: 450 + A * e, y: CY };       // 타원 중심이 화면 가운데에 오도록
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.font = '14px "Noto Sans KR", system-ui, sans-serif';

  // ---- 같은 시간 구간의 면적 ----
  const cur = Math.floor(t * N);
  if (showArea.checked) {
    for (let k = 0; k < N; k++) {
      ctx.beginPath(); ctx.moveTo(sun.x, sun.y);
      for (let s = 0; s <= 30; s++) {
        const p = posAt((k + s / 30) / N, e, sun);
        ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fillStyle = k === cur ? 'rgba(255,214,90,.45)'
                    : (k % 2 ? 'rgba(108,155,255,.20)' : 'rgba(167,139,250,.20)');
      ctx.fill();
    }
  }

  // ---- 궤도 ----
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(450, CY, A, B, 0, 0, Math.PI * 2); ctx.stroke();

  // 다른 초점
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.arc(450 - A * e, CY, 3, 0, Math.PI * 2); ctx.fill();

  // 근일점, 원일점
  ctx.fillStyle = '#cfd8ea';
  ctx.fillText('근일점', 450 + A + 34, CY + 5);
  ctx.fillText('원일점', 450 - A - 34, CY + 5);

  // ---- 태양 ----
  const g = ctx.createRadialGradient(sun.x, sun.y, 2, sun.x, sun.y, 26);
  g.addColorStop(0, '#fff7c2'); g.addColorStop(.5, '#ffc93c'); g.addColorStop(1, 'rgba(255,160,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sun.x, sun.y, 26, 0, Math.PI * 2); ctx.fill();

  // ---- 행성 ----
  const p = posAt(t, e, sun);
  const rRel = 1 - e * Math.cos(p.E);                 // r / a
  const vRel = Math.sqrt(2 / rRel - 1);               // v / (원궤도 속력), 활력 방정식
  // 속도 방향 (위치를 E로 미분)
  let vx = -A * Math.sin(p.E), vy = -B * Math.cos(p.E);
  const len = Math.hypot(vx, vy); vx /= len; vy /= len;
  const L = 45 * vRel;

  ctx.strokeStyle = 'rgba(159,192,255,.6)'; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(sun.x, sun.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = '#7dd3fc'; ctx.fillStyle = '#7dd3fc'; ctx.lineWidth = 2.5;
  const tx = p.x + vx * L, ty = p.y + vy * L;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(tx, ty); ctx.stroke();
  const ang = Math.atan2(vy, vx);
  ctx.beginPath(); ctx.moveTo(tx, ty);
  ctx.lineTo(tx - 9 * Math.cos(ang - .4), ty - 9 * Math.sin(ang - .4));
  ctx.lineTo(tx - 9 * Math.cos(ang + .4), ty - 9 * Math.sin(ang + .4)); ctx.fill();

  ctx.fillStyle = '#60a5fa';
  ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();

  // ---- 수치 표시 ----
  ctx.textAlign = 'left'; ctx.fillStyle = '#e8ebf1'; ctx.font = '15px "Noto Sans KR", system-ui, sans-serif';
  ctx.fillText(`태양까지 거리  ${rRel.toFixed(2)} a`, 20, 30);
  ctx.fillText(`공전 속력  ${vRel.toFixed(2)} (원궤도 기준)`, 20, 54);
  ctx.fillStyle = '#ffd65a';
  ctx.fillText(`각 구간 면적 = πab/12 (모두 같음)`, 20, 78);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '13px "Noto Sans KR", system-ui, sans-serif';
  ctx.fillText(`근일점 속력 ÷ 원일점 속력 = ${((1 + e) / (1 - e)).toFixed(2)}`, 20, canvas.height - 20);

  eOut.textContent = e.toFixed(2);
}

function loop() {
  if (playing) t = (t + 0.0015 * parseFloat(speedSlider.value)) % 1;
  draw();
  requestAnimationFrame(loop);
}

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 정지' : '▶ 재생';
});

loop();
</script>

<script>
// ---- 사이트 연동: 높이 알리기 + 수업 모드(전체 화면) 감지 ----
(function () {
  const post = () => { try { parent.postMessage({ type: 'sim-height', h: document.body.offsetHeight }, '*'); } catch (e) {} };
  const check = () => {
    document.documentElement.classList.toggle('fs', window.innerHeight >= screen.height - 4);
    if (!document.documentElement.classList.contains('fs')) post();
  };
  addEventListener('load', check); addEventListener('resize', check); check();
})();
</script>
</body>
</html>
