        [data-step] { opacity: 0; transform: translateY(14px); transition: opacity .55s, transform .55s; pointer-events: none; }
        [data-step].on { opacity: 1; transform: none; pointer-events: auto; }

        .slide.active .main { animation: rise .6s .2s both; }

    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });

<script>



/* ===== 맥동 변광성 ===== */
(function(){
  const c=document.getElementById('cB'),g=c.getContext('2d'),W=1060,H=610,KS=c.width/W;
  let ph=0,run=true,dR=0.15,dT=0.1,hist=[];
  const R=p=>1+dR*Math.sin(p),Tm=p=>1+dT*Math.cos(p),L=p=>R(p)**2*Tm(p)**4;
  function out(){document.getElementById('vB1').textContent='±'+Math.round(dR*100)+'%';document.getElementById('vB2').textContent='±'+Math.round(dT*100)+'%';
    const p=((ph%6.283)+6.283)%6.283;const exp=Math.cos(p)>0;
    document.getElementById('oB').innerHTML='<h4>지금 상태</h4><div>반지름: <b>'+(R(ph)*100).toFixed(0)+'%</b> '+(exp?'(팽창 중)':'(수축 중)')+'</div><div>표면 온도: <b>'+(Tm(ph)*6000).toFixed(0)+' K</b></div><div>광도: <span class="sim-big" style="font-size:32px">'+(L(ph)*100).toFixed(0)+'%</span></div>';}
  document.getElementById('rB1').oninput=e=>{dR=+e.target.value;hist=[];out();};document.getElementById('rB2').oninput=e=>{dT=+e.target.value;hist=[];out();};
  const b1=document.getElementById('bB1');b1.onclick=()=>{run=!run;b1.textContent=run?'❚❚ 멈춤':'▶ 재생';};
  document.getElementById('bB2').onclick=()=>{run=false;b1.textContent='▶ 재생';ph+=Math.PI/4;for(let k=0;k<45;k++){hist.push([R(ph-Math.PI/4+k/45*Math.PI/4),Tm(ph-Math.PI/4+k/45*Math.PI/4),L(ph-Math.PI/4+k/45*Math.PI/4)]);}out();};out();
  let ot=0;
  SIM.loop('d205_pulse',(t,dt)=>{
    g.setTransform(KS,0,0,KS,0,0);
    if(run){ph+=dt*1.3;hist.push([R(ph),Tm(ph),L(ph)]);if(hist.length>500)hist.shift();}
    if(hist.length>500)hist=hist.slice(-500);
    g.fillStyle='#020617';g.fillRect(0,0,W,H);
    const T=Tm(ph)*6000,rgb=SIM.bbRGB(T),r=80*R(ph),cx=150,cy=170,br=Math.min(1,0.4+0.5*L(ph));
    const gr=g.createRadialGradient(cx,cy,1,cx,cy,r*1.5);gr.addColorStop(0,'rgba(255,255,255,'+br+')');gr.addColorStop(.55,'rgba('+rgb.join(',')+','+br+')');gr.addColorStop(1,'rgba('+rgb.join(',')+',0)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r*1.5,0,7);g.fill();
    g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([5,6]);g.beginPath();g.arc(cx,cy,80,0,7);g.stroke();g.setLineDash([]);
    const gx=320,gw=710,rows=[['반지름 R',0,'#60a5fa',dR],['표면 온도 T',1,'#f87171',dT],['광도 L',2,'#facc15',null]];
    rows.forEach(([n,k,col],i)=>{const gy=40+i*185,gh=150;g.strokeStyle='#334155';g.lineWidth=1.5;g.strokeRect(gx,gy,gw,gh);g.strokeStyle='rgba(148,163,184,.4)';g.beginPath();g.moveTo(gx,gy+gh/2);g.lineTo(gx+gw,gy+gh/2);g.stroke();
      const vals=hist.map(h=>h[k]),amp=k===2?Math.max(0.05,...vals.map(v=>Math.abs(v-1))):0.32;
      g.strokeStyle=col;g.lineWidth=3;g.beginPath();vals.forEach((v,j)=>{const x=gx+j/500*gw,y=gy+gh/2-(v-1)/amp*gh*0.42;j?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
      g.fillStyle=col;g.font=SIM.font(20);g.textAlign='left';g.fillText(n,gx+10,gy+26);});
    g.fillStyle='#e2e8f0';g.font=SIM.font(20);g.textAlign='center';g.fillText(Math.cos(ph)>0?'팽창 중':'수축 중',cx,330);
    g.fillStyle='#94a3b8';g.font=SIM.font(17,false);g.fillText('점선 = 평균 크기',cx,360);
    if(t-ot>250){ot=t;out();}
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  /* 휴대폰·태블릿: 전체화면이 되면 가로 화면으로 고정 (지원하는 기기만) */
  function land(){ try { var o = screen.orientation; if (!o) return; if (document.fullscreenElement || document.webkitFullscreenElement) { if (o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function(){}); } } else if (o.unlock) o.unlock(); } catch(e){} }
  function sync(){ land(); btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
<!--pem:start--><script id="pem-kit">

      const txt = lis[i].querySelector('span:not(.ck)').cloneNode(true); txt.querySelectorAll('.hint').forEach(h => h.remove());
      const t = txt.textContent.trim();
      SIM.toast(done.every(Boolean) ? '모든 미션 달성!' : '미션 달성! ' + (t.length > 24 ? t.slice(0, 23) + '…' : t));
      if (tab) tab.classList.add('nudge');
    };
    // 처음부터 맞아 있던 조건은 세지 않음 (한 번 벗어났다가 다시 맞춰야 달성)
    const armed = o.items.map(() => false);
    SIM._checks.push(() => o.items.forEach((m, i) => {
      if (done[i]) return;
      let ok = false; try { ok = !!m.test(); } catch (e) {}
      if (!ok) armed[i] = true; else if (armed[i]) mark(i);
    }));
    badge();
    return { mark, done };
  },
  _checks: [],
});
setInterval(() => SIM._checks.forEach(f => f()), 250);
</script>
<script id="pem-cfg">
(function(){
// 2.05 맥동 변광성 — 상태: rB1 반지름 변화 폭, rB2 온도 변화 폭, #bB1 글자(멈춤/재생), #oB 반지름·온도·광도(%)
const ob = () => SIM.text('#oB'), Lp = () => SIM.num('#oB .sim-big'), paused = () => SIM.text('#bB1').includes('재생');
SIM.predict({ el: '#predictBox',
  q: '맥동 변광성은 <b>반지름이 가장 클 때</b> 가장 밝을까요?',
  options: ['그렇다, 가장 클 때 가장 밝다', '아니다, 온도가 가장 높을 때쯤 가장 밝다', '크기와 밝기는 상관없다'],
  answer: 1,
  why: 'L ∝ R²T⁴. 온도는 <b>4제곱</b>으로 들어가서 온도 변화가 광도를 거의 결정해요. 그래서 가장 밝은 때는 반지름 최대가 아니라 <b>온도가 높은 팽창 초기</b>예요. 멈춤·한 단계씩 버튼으로 확인해 보세요.',
  reached: () => paused() });
SIM.missions({ el: '#missionBox', items: [
  { t: '온도 변화 폭을 <b>0</b>으로 두고, 광도가 <b>125% 이상</b>인 순간을 잡아 보세요.', test: () => SIM.val('rB2') === 0 && Lp() >= 125 },
  { t: '반지름 변화 폭을 <b>0</b>으로 두고, 광도가 <b>140% 이상</b>인 순간을 잡아 보세요.', test: () => SIM.val('rB1') === 0 && Lp() >= 140 },
  { t: '광도가 <b>200% 이상</b>이 되는 순간을 만들어 보세요.', hint: '두 변화 폭을 모두 키워 보세요', test: () => Lp() >= 200 },
  { t: '멈춘 채 <b>한 단계씩</b> 넘겨 <b>수축 중</b>인 순간을 찾아보세요.', test: () => paused() && ob().includes('수축 중') },
] });

SIM.tabs();
})();
</script>
<script id="pem-pop">
/* 미션: 버튼 → 팝업 · 모두 달성하면 폭죽 */
(function(){
  const pp=document.getElementById('predictPop');
  if(pp){const pg=pp.querySelector('[data-page="predict"]'),sync=()=>{pp.hidden=!pg.classList.contains('on');};
    new MutationObserver(sync).observe(pg,{attributes:true,attributeFilter:['class']});sync();
    document.getElementById('predictClose').onclick=()=>SIM.showTab('lab');
    pp.addEventListener('pointerdown',e=>{if(e.target===pp)SIM.showTab('lab');});}
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script><!--pem:end-->
