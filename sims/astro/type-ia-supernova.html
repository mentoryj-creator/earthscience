<div id="presentation-wrapper">
<div class="slide sim-slide active" id="d205_sn"><div class="ppt-title"><span class="sim-tag">시뮬레이션</span>Ia형 초신성으로 은하까지의 거리 재기</div><div class="ppt-subtitle">먼 은하에서 터진 초신성의 밝기를 관측해 거리를 구해 봐요.</div>
<div class="sim-wrap"><div class="sim-stage"><canvas id="cC" width="1060" height="610"></canvas></div>
<div class="sim-panel"><div class="sim-box blue"><h4>관측하기</h4>
<div class="sim-btns"><button class="sim-btn on" id="bC1">새 초신성 관측</button><button class="sim-btn" id="bC2">폭 보정하기</button></div>
<div class="sim-row" style="margin-top:8px"><span class="lbl" style="width:220px">보정한 최대 등급 m</span><b id="vC" class="sim-val" style="min-width:90px">-</b></div></div>
<div class="sim-box" id="oC" style="font-size:26px"></div>
<div class="sim-note">※ Ia형 초신성의 최대 절대 등급 M = −19.3을 이용해요. 단순화한 광도 곡선 모형이에요.</div></div></div></div>
</div>
<script>
    /* ===== 시뮬레이션 공통 도구 (추가) ===== */
    window.SIM = {
        FONT: "'Gowun Dodum', sans-serif",
        // 해당 슬라이드가 화면에 보일 때만 그리기
        loop(slideId, fn) {
            const el = document.getElementById(slideId);
            let last = performance.now();
            function f(t) {
                const dt = Math.min(0.05, (t - last) / 1000); last = t;
                if (el && el.classList.contains('active')) fn(t, dt);
                requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        },
        rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
        gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },
        font(px, bold) { return (bold === false ? '' : 'bold ') + px + 'px ' + this.FONT; },
        // 파장(nm) → 화면 색
        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; }
            else if (w <= 780) { r = 1; }
            let f = 1;
            if (w < 380 || w > 780) f = 0; else if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
            return [Math.round(255 * Math.pow(r * f, 0.8)), Math.round(255 * Math.pow(g * f, 0.8)), Math.round(255 * Math.pow(b * f, 0.8))];
        },
        // 흑체 온도(K) → 대략적인 색
        bbRGB(T) {
            const t = T / 100; let r, g, b;
            if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
            else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
            const c = v => Math.max(0, Math.min(255, Math.round(v)));
            return [c(r), c(g), c(b)];
        },
        fmtExp(v, digits) {
            if (!isFinite(v) || v <= 0) return '0';
            const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e);
            const sup = String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(ch)] || ch).join('');
            return m.toFixed(digits == null ? 1 : digits) + '×10' + sup;
        }
    };
    // 슬라이더·입력칸 조작 중에는 키보드로 슬라이드가 넘어가지 않도록
    document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'INPUT') a.blur(); });
    </script>
<script>



/* ===== Ia형 초신성 ===== */
(function(){
  const c=document.getElementById('cC'),g=c.getContext('2d'),W=1060,H=610,MABS=-19.3;
  let sn=null,corr=false,anim=0;
  function newSN(){const lr=Math.log10(30+Math.random()*700)+6;const s=0.8+Math.random()*0.4;sn={lr,s,mObs:MABS+5*lr-5-1.2*(s-1)*-1*0+(-(s-1)*1.0)};anim=0;corr=false;document.getElementById('bC2').classList.remove('on');out();}
  function lc(tt,s,m){const x=tt/s;return x<0?m+3*Math.pow(x/15,2):m+Math.min(5,0.065*x+0.002*x*x);}
  function out(){if(!sn){document.getElementById('oC').innerHTML='<div class="sim-note">‘새 초신성 관측’을 눌러 보세요.</div>';return;}
    const mpk=corr?sn.mObs+(sn.s-1)*1.0:sn.mObs;document.getElementById('vC').textContent=corr?mpk.toFixed(2):'(보정 전)';
    if(!corr){document.getElementById('oC').innerHTML='<h4>관측 결과</h4><div>관측된 최대 등급: <b>'+sn.mObs.toFixed(2)+'</b></div><div>어두워지는 속도(폭): <b>'+(sn.s>1?'느림':(sn.s<1?'빠름':'보통'))+'</b> (폭 '+sn.s.toFixed(2)+')</div><div class="sim-note">폭을 보정한 뒤 거리를 구해요.</div>';return;}
    const mu=mpk-MABS,r=Math.pow(10,(mu+5)/5);
    document.getElementById('oC').innerHTML='<h4>거리 구하기</h4><div>m − M = '+mpk.toFixed(2)+' − (−19.3) = <b>'+mu.toFixed(2)+'</b></div><div>r = 10<sup>(m−M+5)/5</sup> pc</div><div>≈ <span class="sim-big" style="font-size:36px">'+(r/1e6).toFixed(0)+' Mpc</span></div><div class="sim-note">(약 '+(r*3.26/1e8).toFixed(1)+'억 광년)</div>';}
  document.getElementById('bC1').onclick=newSN;
  document.getElementById('bC2').onclick=()=>{if(!sn)return;corr=!corr;document.getElementById('bC2').classList.toggle('on',corr);out();};
  newSN();
  SIM.loop('d205_sn',(t,dt)=>{
    anim=Math.min(1,anim+dt*0.5);
    g.fillStyle='#020617';g.fillRect(0,0,W,H);
    // 은하와 초신성
    const gx=180,gy=170;const gg=g.createRadialGradient(gx,gy,4,gx,gy,120);gg.addColorStop(0,'rgba(254,243,199,.9)');gg.addColorStop(1,'rgba(147,197,253,0)');g.fillStyle=gg;g.save();g.translate(gx,gy);g.scale(1,0.5);g.beginPath();g.arc(0,0,120,0,7);g.fill();g.restore();
    const flash=Math.max(0,Math.sin(anim*Math.PI))*1;const sg=g.createRadialGradient(gx+40,gy-10,1,gx+40,gy-10,8+30*flash);sg.addColorStop(0,'#fff');sg.addColorStop(1,'rgba(191,219,254,0)');g.fillStyle=sg;g.beginPath();g.arc(gx+40,gy-10,8+30*flash,0,7);g.fill();
    g.fillStyle='#cbd5e1';g.font=SIM.font(18);g.textAlign='center';g.fillText('먼 은하에서 터진 Ia형 초신성',gx,300);
    // 광도 곡선
    const x0=380,x1=1030,y0=40,y1=540,TT=t=>x0+(t+20)/80*(x1-x0);const m0=sn.mObs,mm=corr?sn.mObs+(sn.s-1)*1.0:m0,sc=corr?1:sn.s;
    const Y=m=>y0+(m-(m0-1.5))/7*(y1-y0);
    g.strokeStyle='#475569';g.lineWidth=2;g.strokeRect(x0,y0,x1-x0,y1-y0);
    g.fillStyle='#94a3b8';g.font=SIM.font(16,false);g.textAlign='center';for(let d=-20;d<=60;d+=20)g.fillText(d+'일',TT(d),y1+22);
    g.textAlign='right';for(let m=Math.ceil(m0-1);m<=m0+5;m++)g.fillText(m,x0-6,Y(m)+5);
    // 표준 템플릿
    g.strokeStyle='rgba(148,163,184,.5)';g.setLineDash([6,6]);g.lineWidth=2;g.beginPath();for(let d=-20;d<=60;d+=1){const y=Y(lc(d,1,corr?mm:m0+(sn.s-1)*1.0));d===-20?g.moveTo(TT(d),y):g.lineTo(TT(d),y);}g.stroke();g.setLineDash([]);
    g.fillStyle='#60a5fa';const nmax=Math.floor(anim*70);const rr=SIM.rng(Math.floor(sn.lr*1000));for(let k=0;k<nmax;k++){const d=-15+k*1.05,m=lc(d,sc,mm)+SIM.gauss(rr)*0.06;g.beginPath();g.arc(TT(d),Y(m),4,0,7);g.fill();}
    g.fillStyle='#e2e8f0';g.font=SIM.font(19);g.textAlign='left';g.fillText(corr?'폭 보정 후 광도 곡선 (점선 = 표준 곡선)':'관측된 광도 곡선',x0+10,y0+26);
    g.save();g.translate(x0-50,(y0+y1)/2);g.rotate(-Math.PI/2);g.fillStyle='#94a3b8';g.textAlign='center';g.fillText('겉보기 등급 (위로 갈수록 밝음)',0,0);g.restore();
  });
})();


</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!document.fullscreenElement;
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>
