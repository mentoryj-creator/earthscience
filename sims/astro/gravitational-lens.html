<style>
        body {
            margin: 0;

        #presentation-wrapper {

            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;

            background-color: #ffffff;

        .page-indicator { font-size: 32px; font-weight: bold; color: #64748b; }
        
        #fullscreen-btn { position: absolute; top: 30px; right: 30px; font-size: 24px; padding: 10px 20px; background-color: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; font-family: 'Gowun Dodum', sans-serif; font-weight: bold; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s; }
        #fullscreen-btn:hover { background-color: #1e293b; }

        /* 풍부한 애니메이션 정의 */
        @keyframes flow { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
        @keyframes pulse-light { 0%, 100% { opacity: 0.7; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
        @keyframes spin-flip { 0%, 30% { transform: scaleY(1); fill: #3b82f6;} 50%, 80% { transform: scaleY(-1); fill: #e74c3c;} 100% { transform: scaleY(1); fill: #3b82f6;} }
        @keyframes emit-wave { 0% { opacity: 0; transform: translateX(0) scale(0.8); } 20% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(150px) scale(0.8); } }
        @keyframes spin-cw { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }

        .anim-wave { stroke-dasharray: 15, 15; animation: flow 1s linear infinite; }
        .anim-wave-fast { stroke-dasharray: 10, 10; animation: flow 0.5s linear infinite; }
        .anim-pulse { animation: pulse-light 3s ease-in-out infinite; transform-origin: center; }
        .anim-pulse-fast { animation: pulse-light 1.5s ease-in-out infinite; transform-origin: center; }
        .anim-spin-flip { animation: spin-flip 4s ease-in-out infinite; transform-origin: center; }
        .anim-emit { animation: emit-wave 3s ease-in-out infinite; transform-origin: center;}
        .anim-float { animation: float 5s ease-in-out infinite; }
        
        /* 회전 애니메이션 클래스 */
        .spin-solid { animation: spin-cw 4s linear infinite; transform-origin: center; }
        .spin-orbit-fast { animation: spin-cw 2s linear infinite; transform-origin: center; }
        .spin-orbit-mid { animation: spin-cw 4s linear infinite; transform-origin: center; }
        .spin-orbit-slow { animation: spin-cw 8s linear infinite; transform-origin: center; }
        .spin-orbit-v-slow { animation: spin-cw 20s linear infinite; transform-origin: center; }
    
        @keyframes fade-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 시뮬레이션 공통 스타일 (추가) ===== */

        .sim-btns { display: flex; flex-wrap: wrap; gap: 12px; }
        .sim-btn { font-family: 'Gowun Dodum', sans-serif; font-size: 26px; font-weight: bold; padding: 9px 22px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; transition: all .2s; }
        .sim-btn:hover { background: #e2e8f0; }
        .sim-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }

        .sim-ok { color: #16a34a; font-weight: bold; }

        .fs-btn:hover { border-color: #3b82f6; color: #1d4ed8; }

        pos(ev, c) { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; },

        wl2rgb(w) {
            let r = 0, g = 0, b = 0;
            if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
            else if (w < 490) { g = (w - 440) / 50; b = 1; }
            else if (w < 510) { g = 1; b = -(w - 510) / 20; }

<script>


    /* ===================== 시뮬레이션 G: 중력 렌즈 ===================== */
    (function () {
        const c = document.getElementById('cG'), g = c.getContext('2d');
        const W = c.width, H = c.height, HW = W / 2, HH = H / 2, CX = W / 2, CY = H / 2;
        const off = document.createElement('canvas'); off.width = HW; off.height = HH; const og = off.getContext('2d'); const img = og.createImageData(HW, HH);
        const bgStar = new Float32Array(HW * HH); { const r = SIM.rng(3); for (let i = 0; i < 420; i++) bgStar[(r() * HH | 0) * HW + (r() * HW | 0)] = 0.3 + r() * 0.7; }
        let mass = 6, bx = 150, by = 60, showLens = true, auto = false, dirty = true, at = 0;
        const thE = () => 96 * Math.sqrt(mass);
        const ca = Math.cos(0.5), sa = Math.sin(0.5);
        function render() {
            const tE2 = thE() * thE(), d = img.data;
            for (let j = 0; j < HH; j++) for (let i = 0; i < HW; i++) {
                const x = i * 2 - CX + 1, y = j * 2 - CY + 1, r2 = x * x + y * y + 1;
                const sx = x - tE2 * x / r2 - bx, sy = y - tE2 * y / r2 - by;
                const u = sx * ca + sy * sa, v = -sx * sa + sy * ca;
                // 배경 은하 크기 2배 (실제 위치 타원과 같은 크기)
                const q = u * u / 9200 + v * v / 2640;
                const I = Math.exp(-q), core = Math.exp(-(u * u + v * v) / 600);
                const arm = Math.exp(-q * 0.35) * (0.5 + 0.5 * Math.sin(Math.atan2(v * 1.8, u) * 2 + Math.sqrt(u * u + v * v) * 0.055));
                const b = bgStar[j * HW + i], k = (j * HW + i) * 4;
                d[k] = Math.min(255, 15 + 60 * I + 70 * arm * I + 230 * core + 255 * b);
                d[k + 1] = Math.min(255, 23 + 120 * I + 110 * arm * I + 240 * core + 255 * b);
                d[k + 2] = Math.min(255, 42 + 230 * I + 150 * arm * I + 255 * core + 255 * b);
                d[k + 3] = 255;
            }
            og.putImageData(img, 0, 0);
        }
        function out() {
            document.getElementById('vG').textContent = '× ' + mass;
            const b = Math.hypot(bx, by), e = thE(); let s;
            if (b < 0.15 * e) s = '<b style="color:#2563eb">아인슈타인 고리</b> (거의 일직선)';
            else if (b < 1.3 * e) s = '<b style="color:#2563eb">휘어진 호 2개</b>로 보여요';
            else s = '조금 늘어나 보이는 상 (약한 렌즈)';
            document.getElementById('oG').innerHTML = '<h4>관측되는 모습</h4><div>' + s + '</div><div style="margin-top:6px">아인슈타인 고리 반지름: <b style="color:#ea580c">' + Math.sqrt(mass).toFixed(2) + ' 배' + '</b> <span class="sim-note">(질량 ×1일 때 = 1)</span></div>';
        }
        document.getElementById('rG').oninput = e => { mass = +e.target.value; dirty = true; out(); };
        const b1 = document.getElementById('bG1'), b2 = document.getElementById('bG2');
        b1.onclick = () => { showLens = !showLens; b1.classList.toggle('on', showLens); b1.textContent = showLens ? '렌즈 은하 보이기' : '렌즈 은하 숨김'; };
        b2.onclick = () => { auto = !auto; b2.classList.toggle('on', auto); b2.textContent = auto ? '❚❚ 자동 이동 멈춤' : '▶ 배경 은하 자동 이동'; };
        document.getElementById('bG3').onclick = () => { auto = false; b2.classList.remove('on'); b2.textContent = '▶ 배경 은하 자동 이동'; bx = 0; by = 0; dirty = true; out(); };
        let drag = false;
        const setB = e => { const p = SIM.pos(e, c); bx = p.x - CX; by = p.y - CY; dirty = true; out(); };
        c.addEventListener('pointerdown', e => { drag = true; auto = false; b2.classList.remove('on'); b2.textContent = '▶ 배경 은하 자동 이동'; c.setPointerCapture(e.pointerId); setB(e); });
        c.addEventListener('pointermove', e => { if (drag) setB(e); });
        c.addEventListener('pointerup', () => drag = false);
        out();
        SIM.loop('simG', (t, dt) => {
            if (auto) { at += dt; bx = Math.sin(at * 0.45) * 320; by = 60 * Math.cos(at * 0.3); dirty = true; out(); }
            if (dirty) { render(); dirty = false; }
            g.imageSmoothingEnabled = true; g.drawImage(off, 0, 0, W, H);
            // 아인슈타인 반지름
            g.setLineDash([6, 8]); g.strokeStyle = 'rgba(148,163,184,.45)'; g.lineWidth = 2; g.beginPath(); g.arc(CX, CY, thE(), 0, 7); g.stroke();
            // 실제 위치
            g.strokeStyle = 'rgba(250,204,21,.9)'; g.lineWidth = 2.5; g.save(); g.translate(CX + bx, CY + by); g.rotate(0.5); g.beginPath(); g.ellipse(0, 0, 108, 58, 0, 0, 7); g.stroke(); g.restore(); g.setLineDash([]);
            g.fillStyle = '#facc15'; g.font = SIM.font(24); g.textAlign = 'center'; g.fillText('실제 위치', CX + bx, CY + by - 84);
            if (showLens) {
                const gr = g.createRadialGradient(CX, CY, 0, CX, CY, 96); gr.addColorStop(0, 'rgba(255,247,237,1)'); gr.addColorStop(.35, 'rgba(251,146,60,.85)'); gr.addColorStop(1, 'rgba(251,146,60,0)');
                g.fillStyle = gr; g.beginPath(); g.ellipse(CX, CY, 96, 72, 0, 0, 7); g.fill();
                g.fillStyle = '#fdba74'; g.font = SIM.font(24); g.fillText('렌즈 (은하단)', CX, CY + 110);
            }
            g.textAlign = 'left'; g.fillStyle = '#94a3b8'; g.font = SIM.font(22, false); g.fillText('회색 점선 원 = 아인슈타인 반지름', 20, H - 20);
        });
    })();
    
</script>

<script>
/* ---- 독립 실행용: 화면 크기에 맞춰 1920px 슬라이드를 축소/확대 ---- */
(function(){
  var w = document.getElementById('presentation-wrapper');
  var inFrame = window.top !== window.self;
  function fit(){
    var de = document.documentElement;
    var h = w.offsetHeight, fs = !inFrame || window.innerHeight >= screen.height - 4 || !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs');
    var s = window.innerWidth / 1920, x = 0, y = 0;
    document.documentElement.classList.toggle('fit', fs);
    if (fs) { s = Math.min(s, window.innerHeight / h); x = (window.innerWidth - 1920*s)/2; y = Math.max(0,(window.innerHeight - h*s)/2); }
    w.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    document.body.style.height = fs ? '100%' : Math.ceil(h*s) + 'px';
    if (inFrame && !fs) { try { parent.postMessage({ type: 'sim-height', h: Math.ceil(h*s) }, '*'); } catch(e){} }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w);
  fit(); setTimeout(fit, 300);

  /* ---- 전체화면 버튼 ---- */
  var btn = document.getElementById('fsBtn'), de = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || de.classList.contains('pfs'); }
  /* 휴대폰·태블릿: 전체화면이 되면 가로 화면으로 고정 (지원하는 기기만) */
  function land(){ try { var o = screen.orientation; if (!o) return; if (document.fullscreenElement || document.webkitFullscreenElement) { if (o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function(){}); } } else if (o.unlock) o.unlock(); } catch(e){} }
  function sync(){ land(); btn.textContent = isFs() ? '✕ 전체화면 끄기' : '⛶ 전체화면'; fit(); setTimeout(fit, 100); }
  btn.onclick = function(){
    if (isFs()) {
      if (de.classList.contains('pfs')) de.classList.remove('pfs');
      else { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex && ex.call(document); if (p && p.catch) p.catch(function(){}); } catch(e){} }
      sync(); return;
    }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var fallback = function(){ de.classList.add('pfs'); sync(); };
    try { if (!req) throw 0; var p = req.call(de); if (p && p.then) p.then(sync, fallback); else sync(); } catch(e) { fallback(); }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && de.classList.contains('pfs')) { de.classList.remove('pfs'); sync(); } });
})();
/* 단계(▶)로 나타나는 요소는 처음부터 모두 보이게 */
(function(){
  var el = document.querySelector('#presentation-wrapper > .slide');
  var n = 0; el.querySelectorAll('[data-step]').forEach(function(e){ n = Math.max(n, +e.dataset.step); e.classList.add('on'); });
  el._shown = n;
  try { if (window.STEP && STEP[el.id]) STEP[el.id](n); } catch(e) {}
})();
</script>

<script id="pem-cfg">

<script id="pem-pop">
/* 미션: 버튼 → 팝업 · 모두 달성하면 폭죽 */
(function(){
  const pp=document.getElementById('predictPop');
  if(pp){const pg=pp.querySelector('[data-page="predict"]'),sync=()=>{pp.hidden=!pg.classList.contains('on');};
    new MutationObserver(sync).observe(pg,{attributes:true,attributeFilter:['class']});sync();
    document.getElementById('predictClose').onclick=()=>SIM.showTab('lab');
    pp.addEventListener('pointerdown',e=>{if(e.target===pp)SIM.showTab('lab');});}
  const mBtn=document.querySelector('.sim-tab[data-tab="mission"]'),pop=document.getElementById('missionPop');
  if(!mBtn||!pop)return;
  const closePop=()=>{pop.hidden=true;};
  mBtn.onclick=()=>{mBtn.classList.remove('nudge');mBtn.firstChild.textContent='🎯 미션 보기 ';pop.hidden=false;};
  document.getElementById('missionClose').onclick=closePop;
  document.getElementById('missionGo').onclick=()=>{closePop();SIM.showTab&&SIM.showTab('lab');};
  pop.addEventListener('pointerdown',e=>{if(e.target===pop)closePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();});
  function fireworks(){
    const wrap=document.getElementById('presentation-wrapper'),cv=document.createElement('canvas');cv.width=1920;cv.height=1080;
    cv.style.cssText='position:absolute;inset:0;z-index:90;pointer-events:none';wrap.appendChild(cv);
    const msg=document.createElement('div');msg.className='fw-msg';msg.innerHTML='🎉 모든 미션 완료! 🎉<small>멋진 탐구였어요!</small>';wrap.appendChild(msg);
    const x=cv.getContext('2d'),cols=['#f43f5e','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#ffffff'];
    const rockets=[],parts=[];let t0=performance.now(),last=t0,next=0;
    const boom=(px,py)=>{const col=cols[Math.random()*cols.length|0],col2=cols[Math.random()*cols.length|0],k=70+Math.random()*40;
      for(let i=0;i<k;i++){const a=i/k*Math.PI*2,v=4+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.5?col:col2,s:3+Math.random()*3});}};
    (function f(t){const dt=Math.min(3,(t-last)/16.7);last=t;const el=t-t0;
      if(el<3600&&el>next){next=el+260+Math.random()*260;rockets.push({x:300+Math.random()*1320,y:1080,vy:-(17+Math.random()*6),ty:180+Math.random()*380});}
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,1920,1080);x.globalCompositeOperation='lighter';
      for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;x.fillStyle='#fde68a';x.beginPath();x.arc(r.x,r.y,5,0,7);x.fill();if(r.y<=r.ty){boom(r.x,r.y);rockets.splice(i,1);}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.97;p.vy=p.vy*.97+.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
        if(p.life<=0){parts.splice(i,1);continue;}x.globalAlpha=p.life;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();}
      x.globalAlpha=1;
      if(el<3600||parts.length||rockets.length)requestAnimationFrame(f);else{cv.remove();msg.classList.add('out');setTimeout(()=>msg.remove(),600);}
    })(t0);
    for(let i=0;i<4;i++)setTimeout(()=>SIM.burst(),i*450);
  }
  let cheered=false;
  const timer=setInterval(()=>{const lis=document.querySelectorAll('#missionBox .mission-list li');
    if(!cheered&&lis.length&&[...lis].every(l=>l.classList.contains('done'))){cheered=true;clearInterval(timer);setTimeout(fireworks,700);}},300);
})();
</script><!--pem:end-->
