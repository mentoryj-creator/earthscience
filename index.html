<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지구과학 시뮬레이션 실험실</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/sims.js"></script>
  <script src="js/site.js"></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="hero">
    <h1>눈으로 보고, 손으로 움직이는 지구과학</h1>
    <p class="lead">중·고등학교 지구과학 수업을 위한 시뮬레이션 모음입니다.</p>
    <label class="search">
      <span>🔍</span>
      <input id="q" type="search" placeholder="시뮬레이션 검색 (예: 달, 엘니뇨, 판)">
    </label>
  </section>

  <div id="results"></div>

  <div id="browse">
    <h2 class="section-title">고등학교 과목별</h2>
    <div class="cards" id="courseCards"></div>

    <h2 class="section-title">주제별 둘러보기</h2>
    <div class="cards" id="topicCards"></div>

    <h2 class="section-title">최근 추가된 시뮬레이션</h2>
    <div class="cards" id="recent"></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script>
const { S, esc, card, url } = App;
const ready = S.sims.filter(s => s.status === 'ready');

// 과목 카드
document.getElementById('courseCards').innerHTML = S.courses.filter(c => c.level === 'high').map(c => {
  const n = ready.filter(s => (s.links || []).some(l => l.course === c.id)).length;
  return `<a class="card big-card" href="${url.course(c.id)}">
    <h3>${esc(c.name)}</h3>
    <p>${c.units.map(u => esc(u.name)).slice(0, 3).join(' · ')}${c.units.length > 3 ? ' …' : ''}</p>
    <span class="count">시뮬레이션 ${n}개</span></a>`;
}).join('');

// 주제 카드
document.getElementById('topicCards').innerHTML = S.topics.map(t => {
  const n = ready.filter(s => s.topic === t.id).length;
  return `<a class="card big-card" style="--c:${t.color}" href="${url.topic(t.id)}">
    <h3>${esc(t.name)}</h3><p>${t.subs.map(esc).join(' · ')}</p>
    <span class="count">시뮬레이션 ${n}개</span></a>`;
}).join('');

// 최근 추가 (목록의 뒤쪽이 최신)
document.getElementById('recent').innerHTML = ready.slice(-6).reverse().map(s => card(s)).join('');

// 검색
const q = document.getElementById('q'), results = document.getElementById('results'), browse = document.getElementById('browse');
q.addEventListener('input', () => {
  const k = q.value.trim().toLowerCase();
  if (!k) { results.innerHTML = ''; browse.hidden = false; return; }
  const hit = S.sims.filter(s => {
    const courses = (s.links || []).map(l => App.course(l.course)?.name).join(' ');
    return [s.title, s.desc, s.sub, App.topic(s.topic)?.name, courses, s.concept]
      .join(' ').toLowerCase().includes(k);
  });
  browse.hidden = true;
  results.innerHTML = `<h2 class="section-title">검색 결과 ${hit.length}개</h2>` +
    (hit.length ? `<div class="cards">${hit.map(s => card(s)).join('')}</div>`
                : '<p class="empty">찾는 시뮬레이션이 없습니다.</p>');
});
</script>
</body>
</html>
