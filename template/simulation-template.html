<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ① 제목 바꾸기 -->
  <title>시뮬레이션 제목 | 지구과학 시뮬레이션 실험실</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--
  ================= 새 시뮬레이션 만드는 법 =================
  1. 이 파일을 복사해서 단원 폴더(예: geology/)에 넣고 이름을 영어로 바꿉니다.
     예) geology/plate-boundary.html
  2. ①~⑤ 표시된 곳의 내용을 바꿉니다.
  3. index.html의 해당 단원에 카드를 하나 추가합니다.
     (기존 카드를 복사해 href 주소만 바꾸면 됩니다)
  ===========================================================
-->

<header class="site-header">
  <div class="inner">
    <a class="logo" href="../index.html">지구과학 <span>시뮬레이션</span> 실험실</a>
    <nav class="site-nav">
      <a href="../index.html#geo">고체지구</a>
      <a href="../index.html#atmo">대기와 해양</a>
      <a href="../index.html#space">우주</a>
    </nav>
  </div>
</header>

<main>
  <!-- ② 단원 위치와 제목 -->
  <div class="breadcrumb"><a href="../index.html">홈</a> › 단원 › 소단원</div>
  <h1 class="page-title">시뮬레이션 제목</h1>
  <span class="standard">관련 개념: 여기에 적기</span>

  <!-- ③ 시뮬레이션 영역 -->
  <div class="sim-box">
    <canvas id="sim" width="900" height="480"></canvas>
    <div class="controls">
      <button class="btn" id="playBtn">▶ 재생</button>
      <label>변수
        <input type="range" id="slider" min="0" max="100" value="50">
        <span class="readout" id="out">50</span>
      </label>
    </div>
  </div>

  <!-- ④ 설명 -->
  <div class="info-grid">
    <section class="panel">
      <h2>조작 방법</h2>
      <ul>
        <li>조작 방법 1</li>
        <li>조작 방법 2</li>
      </ul>
    </section>
    <section class="panel">
      <h2>핵심 개념</h2>
      <p>개념 설명을 여기에 적습니다.</p>
    </section>
    <section class="panel full">
      <h2>탐구 활동</h2>
      <ol>
        <li>탐구 질문 1</li>
        <li>탐구 질문 2</li>
      </ol>
    </section>
  </div>
</main>

<footer class="site-footer">
  지구과학 시뮬레이션 실험실
</footer>

<script>
// ⑤ 시뮬레이션 코드 (Claude가 만든 코드를 여기에 붙여 넣으세요)
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('slider');
const out = document.getElementById('out');

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#9fc0ff';
  ctx.font = '22px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('여기에 시뮬레이션이 들어갑니다 (값: ' + slider.value + ')', canvas.width / 2, canvas.height / 2);
  out.textContent = slider.value;
}
slider.addEventListener('input', draw);
draw();
</script>
</body>
</html>
